- id: p21-e03-repetir-mensaje
  title: 03. Repetir un mensaje con while
  description: |
    Recibe un entero `N` entre **1 y 8**, inclusive. Con un bucle `while`, muestra N líneas con el formato `1: hola, mundo`, `2: hola, mundo`, etc. No añadas encabezados ni líneas vacías.

    Valida cantidad de argumentos, formato decimal y rango, por ese orden. Practica `$#`, variables, `(( ))`, `if`, stderr y `exit`.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `echo`, `printf`.
    - **Bash / conceptos:** `while`, `$#`, `(( ... ))`, `if`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p21-e03-repetir-mensaje.sh`
    - **Uso:** `p21-e03-repetir-mensaje.sh N`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Exactamente un argumento.
    - N contiene solamente dígitos.
    - N debe estar entre 1 y 8.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Produce el resultado especificado y deja stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Uso: N`.
    - **numero:** código `2`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `N debe ser numerico`.
    - **rango:** código `3`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `N fuera de rango`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p21-e03-repetir-mensaje.sh 3
    ```
    Salida estándar esperada:
    ```text
    1: hola, mundo
    2: hola, mundo
    3: hola, mundo
    ```
    Código de salida: `0`.
  tips:
  - Recuerda que `((i++))` puede producir estado no cero si i era 0; no lo trates como fallo 
    automáticamente.
  sources: []
  supplemental: Datos ficticios preparados solo para practicar en Linux Lab; no se crea el script 
    del estudiante.
  tasks:
  - id: iteraciones
    description: Produce exactamente el número de líneas pedido.
    points: 12
    checks:
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
