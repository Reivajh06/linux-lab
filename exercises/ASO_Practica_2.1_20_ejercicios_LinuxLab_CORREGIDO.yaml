        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set +e
        /home/learner/lab/aso-fundamentos/scripts/p21-e09-rango-bucle.sh 15 20 </dev/null >"$td/out" 2>"$td/err"
        status=$?
