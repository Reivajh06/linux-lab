        trap 'rm -rf "$td"' EXIT
        set +e
        /home/learner/lab/aso-fundamentos/scripts/p21-e09-rango-bucle.sh 0 0 </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s '0
        ')
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
