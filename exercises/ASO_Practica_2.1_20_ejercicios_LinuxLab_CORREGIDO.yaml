        set +e
        /home/learner/lab/aso-fundamentos/scripts/p21-e09-rango-bucle.sh 2 4 </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s '2
        3
