- id: p21-e19-controlar-errores-al-crear-un-directorio
  title: 19. Controlar errores al crear un directorio
  description: |
    Recibe una ruta DIRECTORIO. Intenta ejecutar `mkdir` (sin `-p`): si se crea muestra `Creado`; si ya existe un directorio muestra `Ya existe` y termina correctamente; si no puede crearlo (por ejemplo porque el destino es un fichero o no existe el padre), emite `No se pudo crear` a stderr y código 3. Practica comprobar el código devuelto por un comando.

    ### Comandos y conceptos a practicar
    - **Comandos:** `mkdir`, `ls -ld`.
    - **Bash / conceptos:** `if ! mkdir`, `[[ -d ]]`, `$?`, `exit`.

    ### Entrega
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p21-e19-controlar-errores-al-crear-un-directorio.sh`
    - **Uso:** `p21-e19-controlar-errores-al-crear-un-directorio.sh DIRECTORIO`
    - Empieza con `#!/bin/bash`, guarda el script tú mismo y hazlo ejecutable (`chmod +x`).

    ### Validaciones y resultados
    - 0: `Creado` si es nuevo o `Ya existe` si ya había un directorio.
    - 1: `Uso: DIRECTORIO`.
    - 3: `No se pudo crear` si mkdir falla. Suprime stderr interno de mkdir.

    ### Ejemplo
    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p21-e19-controlar-errores-al-crear-un-directorio.sh /temporal
    ```
    Salida esperada:
    ```text
    Creado

    ```
