- id: p21-e07-miembros-grupo
  title: 07. Listar miembros secundarios de un grupo
  description: |
    Recibe un nombre de grupo y busca su entrada en `/home/learner/lab/aso-fundamentos/bash-21-22/datos/grupos.txt`, fichero de muestra con formato `/etc/group`. Si existe, muestra `Miembros: NOMBRES` usando exactamente el campo 4 (nombres separados por comas). Si ese campo está vacío, muestra `Miembros: ninguno`. Si el grupo no aparece, escribe `Grupo inexistente` en stderr y termina con código 3.

    La actividad reproduce la consulta de grupos de la práctica 2.1 sin modificar las cuentas reales. No añadas espacios entre los nombres.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `grep`, `cut -d: -f4`.
    - **Bash / conceptos:** `if`, `[[ ... == ... ]]`, `exit`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p21-e07-miembros-grupo.sh`
    - **Uso:** `p21-e07-miembros-grupo.sh GRUPO`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Exactamente un argumento.
    - El nombre del grupo contiene solo letras minúsculas.
    - El grupo debe aparecer en los datos.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Produce el resultado especificado y deja stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Uso: GRUPO`.
    - **nombre:** código `2`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Nombre invalido`.
    - **inexistente:** código `3`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Grupo inexistente`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p21-e07-miembros-grupo.sh proyecto
    ```
    Salida estándar esperada:
    ```text
    Miembros: ana,cora
    ```
    Código de salida: `0`.
  tips:
  - Recuerda que los miembros suplementarios de un grupo aparecen en el último campo de 
    `/etc/group`.
  - Un campo vacío es diferente de un grupo inexistente.
