- id: p21-e08-crear-salida
  title: 08. Crear directorio y añadir líneas al fichero
  description: |
    Recibe `N NOMBRE`. N es un entero entre **1 y 5**; NOMBRE tiene entre **3 y 12** letras minúsculas. Crea si hace falta el directorio `/home/learner/lab/aso-fundamentos/bash-21-22/salidas/NOMBRE`. Escribe N líneas numeradas `1: hola, mundo`, `2: hola, mundo`, ... en `salida.txt` dentro del directorio usando `>>` (añadir, **no sobrescribir**). En la salida estándar imprime `Creado: NOMBRE`.

    Si `mkdir -p` no puede crear el directorio, suprime el mensaje original y emite `No se pudo crear directorio` por stderr (código 5). Valida todos los argumentos antes de crear nada. Reproduce el ejemplo de creación y tratamiento de fallos de la práctica 2.1.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `mkdir -p`, `>>`, `2>/dev/null`.
    - **Bash / conceptos:** `while`, `(( ... ))`, `if ! comando`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p21-e08-crear-salida.sh`
    - **Uso:** `p21-e08-crear-salida.sh N NOMBRE`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Se reciben exactamente dos argumentos.
    - N debe contener únicamente dígitos.
    - N debe valer entre 1 y 5.
    - El nombre tiene de 3 a 12 letras minúsculas.
    - La creación del directorio y salida deben tener éxito.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Produce el resultado especificado y deja stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Uso: N NOMBRE`.
    - **numero:** código `2`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `N no numerico`.
    - **rango:** código `3`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `N fuera de rango`.
    - **nombre:** código `4`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Nombre invalido`.
    - **crear:** código `5`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `No se pudo crear directorio`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p21-e08-crear-salida.sh 2 boletin
    ```
    Salida estándar esperada:
    ```text
    Creado: boletin
    ```
    Código de salida: `0`.
  tips:
  - Si ejecutas dos veces el script con el mismo nombre, las nuevas líneas deben añadirse.
  - Para comprobar un fallo de un comando se puede usar `if ! mkdir -p ... 2>/dev/null; then ... 
    fi`.
  sources: []
  supplemental: Datos ficticios preparados solo para practicar en Linux Lab; no se crea el script 
    del estudiante.
  tasks:
  - id: crear
    description: Crea el directorio y rellena salida.txt.
    points: 10
    checks:
    - type: command
      user: root
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set -e
        rm -rf /home/learner/lab/aso-fundamentos/bash-21-22/salidas/boletin
        set +e
        set +e
        runuser -u learner -- /home/learner/lab/aso-fundamentos/scripts/p21-e08-crear-salida.sh 2 boletin </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s 'Creado: boletin
        ')
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        exit 0
    - type: path
      path: /home/learner/lab/aso-fundamentos/bash-21-22/salidas/boletin
      kind: directory
    - type: content
      path: /home/learner/lab/aso-fundamentos/bash-21-22/salidas/boletin/salida.txt
      match: exact
      value: |
        1: hola, mundo
        2: hola, mundo
  - id: anexar
    description: Con una salida ya existente se añaden líneas, sin borrar las anteriores.
    points: 6
    checks:
