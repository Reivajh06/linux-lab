    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Se exige una ruta, ni más ni menos.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Produce el resultado especificado y deja stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Uso: RUTA`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p21-e06-existe-fichero.sh /home/learner/lab/aso-fundamentos/bash-21-22/datos/lineas.txt
    ```
    Salida estándar esperada:
    ```text
    EXISTE
    ```
    Código de salida: `0`.
