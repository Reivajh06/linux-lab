- id: p21-e02-clasificar-numero
  title: 02. Clasificar un número según sus dígitos
  description: |
    El script recibe una única cadena y responde con **una sola línea**, según el contenido: `NO ES NUMERO` si está vacía o tiene algún carácter no numérico; `UN DIGITO` si tiene un dígito; `DOS DIGITOS` si tiene dos; `TRES O MAS DIGITOS` si tiene tres o más.

    Clasifica el texto, no el valor matemático: `007` tiene tres dígitos. El contenido no numérico **no es un error de ejecución**; solo se considera error una cantidad incorrecta de argumentos. Practica `[[ =~ ]]`, condiciones y `${#variable}`.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `printf`.
    - **Bash / conceptos:** `if/elif/else`, `[[ ... =~ ... ]]`, `${#variable}`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p21-e02-clasificar-numero.sh`
    - **Uso:** `p21-e02-clasificar-numero.sh CADENA`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Exactamente una cadena (puede ser vacía).

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Produce el resultado especificado y deja stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Uso: CADENA`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p21-e02-clasificar-numero.sh 007
    ```
    Salida estándar esperada:
    ```text
    TRES O MAS DIGITOS
    ```
    Código de salida: `0`.
  tips:
  - Usa una expresión regular anclada para aceptar únicamente dígitos.
  - La longitud de una variable se obtiene con `${#cadena}`.
  sources: []
  supplemental: Datos ficticios preparados solo para practicar en Linux Lab; no se crea el script 
    del estudiante.
