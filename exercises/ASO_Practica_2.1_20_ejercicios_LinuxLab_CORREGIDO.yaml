exercises:
- id: p21-e01-contar-inicial
  title: 01. Contar palabras por letra
  description: |
    Desarrolla un script que reciba **FICHERO LETRA**. Cuenta las líneas del fichero cuyo primer carácter es la letra indicada, sin distinguir mayúsculas de minúsculas. Imprime solo un número y un salto de línea (incluido si es 0).

    El fichero de prueba `/home/learner/lab/aso-fundamentos/bash-21-22/datos/diccionario.txt` sustituye al diccionario `/usr/share/dict/words` de la práctica 2.1. Puedes combinar `grep -i` y `wc -l`. Valida primero la cantidad de argumentos, luego el fichero y por último que LETRA sea una sola letra ASCII.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `grep -ic`, `wc -l`, `|`.
    - **Bash / conceptos:** `if`, `[[ ... =~ ... ]]`, `códigos de salida`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p21-e01-contar-inicial.sh`
    - **Uso:** `p21-e01-contar-inicial.sh FICHERO LETRA`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Exactamente dos argumentos.
    - El primer argumento debe ser un fichero regular.
    - LETRA debe ser una única letra ASCII.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Produce el resultado especificado y deja stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Uso: FICHERO LETRA`.
    - **fichero:** código `2`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Fichero no valido`.
    - **letra:** código `3`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Letra invalida`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p21-e01-contar-inicial.sh /home/learner/lab/aso-fundamentos/bash-21-22/datos/diccionario.txt a
    ```
    Salida estándar esperada:
    ```text
    5
    ```
    Código de salida: `0`.
  tips:
  - La expresión regular `^a` busca la letra a al principio de la línea.
  - '`grep -i` no distingue mayúsculas y minúsculas.'
  sources: []
  supplemental: Datos ficticios preparados solo para practicar en Linux Lab; no se crea el script 
    del estudiante.
  tasks:
