- id: p21-e10-comprobar-cuenta
  title: 10. Comprobar home y shell de una cuenta
  description: |
    Recibe el nombre de una cuenta de prueba que figura en `/home/learner/lab/aso-fundamentos/bash-21-22/datos/registros.txt`. Muestra una línea con el formato `HOME=SI SHELL=NO` (o `SI/NO` según corresponda). `HOME=SI` significa que el directorio personal registrado empieza por `/home/`. `SHELL=SI` significa que el campo 7 es exactamente `/bin/bash`.

    Si no existe la cuenta, emite `Usuario inexistente` en stderr con código 3. Practica `grep`, `cut`, condiciones y `&&` / `||` si lo deseas, siguiendo las actividades de la práctica 2.1.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `grep`, `cut -d: -f`, `|`.
    - **Bash / conceptos:** `if`, `[[ ... == ... ]]`, `&&`, `||`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p21-e10-comprobar-cuenta.sh`
    - **Uso:** `p21-e10-comprobar-cuenta.sh USUARIO`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Un argumento obligatorio.
    - Nombre de usuario en letras minúsculas.
    - El usuario debe figurar en el fichero de prueba.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Produce el resultado especificado y deja stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Uso: USUARIO`.
    - **nombre:** código `2`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Nombre invalido`.
    - **inexistente:** código `3`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Usuario inexistente`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p21-e10-comprobar-cuenta.sh ana
    ```
    Salida estándar esperada:
    ```text
    HOME=SI SHELL=SI
    ```
    Código de salida: `0`.
  tips:
  - El nombre va en el primer campo de cada línea de tipo passwd.
  - Comprueba las dos propiedades de manera independiente.
