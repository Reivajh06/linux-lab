- id: p21-e09-rango-bucle
  title: 09. Generar un rango de enteros
  description: |
    Recibe `INICIO FIN` y muestra una línea por cada entero entre INICIO y FIN, ambos inclusive. Los dos extremos deben estar en **0..20**, INICIO no puede ser mayor que FIN y la diferencia `FIN-INICIO` no puede superar 10.

    Usa un bucle `while` y operadores aritméticos de Bash. Valida en este orden: cantidad, formato, límites y orden. No se admiten signos negativos. La salida no lleva prefijos.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `printf`.
    - **Bash / conceptos:** `while`, `(( ... ))`, `[[ ... =~ ... ]]`, `if`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p21-e09-rango-bucle.sh`
    - **Uso:** `p21-e09-rango-bucle.sh INICIO FIN`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Dos argumentos obligatorios.
    - Ambos argumentos deben ser cadenas de dígitos.
    - Ambos extremos están en 0..20 y se generan como máximo 11 números.
    - INICIO debe ser menor o igual que FIN.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Produce el resultado especificado y deja stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Uso: INICIO FIN`.
    - **numero:** código `2`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Extremos no numericos`.
    - **rango:** código `3`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Rango fuera de limites`.
    - **orden:** código `4`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Inicio mayor que fin`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p21-e09-rango-bucle.sh 2 4
    ```
    Salida estándar esperada:
    ```text
    2
    3
    4
    ```
    Código de salida: `0`.
  tips:
  - '`while (( i <= fin ))` permite iterar sin necesitar `seq`.'
  - Evita un bucle infinito incrementando el contador.
  sources: []
  supplemental: Datos ficticios preparados solo para practicar en Linux Lab; no se crea el script 
    del estudiante.
  tasks:
  - id: rangos
    description: Comprueba rango de un elemento, con cero y con varios elementos.
