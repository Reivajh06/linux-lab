- id: p21-e05-dos-campos
  title: 05. Dos campos de un fichero tipo passwd
  description: |
    Recibe `CAMPO1 CAMPO2 [FICHERO]`. Los dos campos son números del **1 al 7**. Si no se indica FICHERO, utiliza `/home/learner/lab/aso-fundamentos/bash-21-22/datos/registros.txt`; de lo contrario, procesa el fichero indicado. Muestra exactamente esos dos campos de cada línea separados por `:` y conserva **el orden en que están en el fichero**, aunque se hayan indicado los números en orden inverso.

    Puedes emplear `cut -d: -f`. El fichero opcional y la validación del número de parámetros proceden de la actividad de la práctica 2.1.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `cut -d: -f`, `<`.
    - **Bash / conceptos:** `$#`, `if`, `"$3"`, `[[ ... =~ ... ]]`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p21-e05-dos-campos.sh`
    - **Uso:** `p21-e05-dos-campos.sh CAMPO1 CAMPO2 [FICHERO]`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Se aceptan dos o tres argumentos.
    - Los campos han de ser cadenas de dígitos.
    - Ambos campos deben estar en el intervalo 1..7 y ser distintos.
    - FICHERO tiene que ser un fichero regular.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Produce el resultado especificado y deja stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Uso: CAMPO1 CAMPO2 [FICHERO]`.
    - **numero:** código `2`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Campos no numericos`.
    - **rango:** código `3`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Campo fuera de rango`.
    - **fichero:** código `4`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Fichero no valido`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p21-e05-dos-campos.sh 1 7
    ```
    Salida estándar esperada:
    ```text
    ana:/bin/bash
    beto:/bin/sh
    cora:/bin/bash
    dani:/usr/sbin/nologin
    elena:/bin/bash
    fede:/bin/sh
    ```
    Código de salida: `0`.
  tips:
  - '`cut` muestra los campos en el orden en el que aparecen en la línea, no en el orden escrito tras
    `-f`.'
  - La ruta por defecto está preparada con datos de prueba.
