    Únicamente se considera error recibir cero o más de un argumento. Practica `[[ -f ... ]]`, `if` y la diferencia entre resultado booleano y error de ejecución. Puedes probar `/home/learner/lab/aso-fundamentos/bash-21-22/datos/lineas.txt`.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `echo`.
    - **Bash / conceptos:** `if/else`, `[[ -f ... ]]`, `exit`.

