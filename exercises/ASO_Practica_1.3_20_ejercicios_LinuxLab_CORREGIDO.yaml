- id: p13-e09-sticky-bit
  title: 09. Activar el sticky bit de un directorio
  description: |
    Recibe la ruta de un directorio existente. Activa su **sticky bit** sin alterar los permisos normales y muestra `Sticky activado`.

    Prueba los directorios `/home/learner/lab/aso-fundamentos/directorios/sticky-a` y `/home/learner/lab/aso-fundamentos/directorios/sticky-b`. La práctica 1.3 explica este permiso especial y su uso en `/tmp`.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `chmod +t`.
    - **Bash / conceptos:** `if`, `[[ -d ... ]]`, `stderr`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p13-e09-sticky-bit.sh`
    - **Uso:** `p13-e09-sticky-bit.sh DIRECTORIO`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Exactamente un argumento.
    - Debe ser un directorio.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Resultado indicado; stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Uso: DIRECTORIO`.
    - **no-directorio:** código `2`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Directorio no valido`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p13-e09-sticky-bit.sh /home/learner/lab/aso-fundamentos/directorios/sticky-a
    ```
    Salida estándar esperada:
    ```text
    Sticky activado
    ```
    Código de salida: `0`.
  tips:
