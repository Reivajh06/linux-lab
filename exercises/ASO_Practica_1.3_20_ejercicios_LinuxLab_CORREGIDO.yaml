  title: 11. Crear usuario y añadirlo a un grupo secundario
  description: |
    Script de administración (root). Recibe un nombre de usuario nuevo y el de un grupo existente. Si el usuario no existe, créalo con `useradd -m -U -s /bin/bash` (directorio personal y grupo privado propio), y después añádelo al grupo indicado como **secundario** usando `usermod -aG` o `gpasswd -a`. Muestra `Usuario creado: NOMBRE`.

