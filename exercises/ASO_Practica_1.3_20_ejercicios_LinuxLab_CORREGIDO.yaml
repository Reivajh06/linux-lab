- id: p13-e03-ver-permisos
  title: 03. Consultar permisos con ls -l
  description: |
    Recibe una ruta de fichero o directorio existente y muestra únicamente los **primeros diez caracteres** del listado detallado de `ls -ld`, incluyendo tipo y permisos (`-rw-r-----`, `drwx...`, etc.). No uses `stat`.

    Prueba el fichero `/home/learner/lab/aso-fundamentos/permisos/ver-permisos.txt` y el directorio `/home/learner/lab/aso-fundamentos/directorios/privado`.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `ls -ld`, `cut -c1-10`, `|`.
    - **Bash / conceptos:** `if`, `[[ -e ... ]]`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p13-e03-ver-permisos.sh`
    - **Uso:** `p13-e03-ver-permisos.sh RUTA`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Exactamente un argumento.
    - La ruta debe existir.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Resultado indicado; stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Uso: RUTA`.
    - **no-existe:** código `2`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Ruta inexistente`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p13-e03-ver-permisos.sh /home/learner/lab/aso-fundamentos/permisos/ver-permisos.txt
    ```
    Salida estándar esperada:
    ```text
    -rw-r-----
    ```
    Código de salida: `0`.
  tips:
  - El primer carácter de `ls -l` indica el tipo de entrada.
  - '`cut -c1-10` permite seleccionar caracteres, no campos.'
  sources: []
  supplemental: Ficheros y nombres de prueba creados únicamente para este entorno Linux Lab.
  tasks:
  - id: modos
    description: Distingue ficheros y directorios.
    points: 12
    checks:
    - type: command
      user: root
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set -e
        chmod 0640 /home/learner/lab/aso-fundamentos/permisos/ver-permisos.txt
        set +e
        set +e
        runuser -u learner -- /home/learner/lab/aso-fundamentos/scripts/p13-e03-ver-permisos.sh /home/learner/lab/aso-fundamentos/permisos/ver-permisos.txt </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s '-rw-r-----
        ')
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        exit 0
    - type: command
      user: root
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set -e
        chmod 0755 /home/learner/lab/aso-fundamentos/directorios/privado
        set +e
        set +e
        runuser -u learner -- /home/learner/lab/aso-fundamentos/scripts/p13-e03-ver-permisos.sh /home/learner/lab/aso-fundamentos/directorios/privado </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s 'drwxr-xr-x
        ')
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        exit 0
  - id: errores
    description: Falta de argumentos y ruta inexistente.
    points: 8
    checks:
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set +e
        /home/learner/lab/aso-fundamentos/scripts/p13-e03-ver-permisos.sh </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 1 ] || exit 1
        [ ! -s "$td/out" ] || exit 1
        actual=$(cat "$td/err")
        expected=$(printf %s 'Uso: RUTA')
        [ "$actual" = "$expected" ] || exit 1
        exit 0
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set +e
        /home/learner/lab/aso-fundamentos/scripts/p13-e03-ver-permisos.sh /no/existe </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 2 ] || exit 1
        [ ! -s "$td/out" ] || exit 1
        actual=$(cat "$td/err")
        expected=$(printf %s 'Ruta inexistente')
        [ "$actual" = "$expected" ] || exit 1
        exit 0
- id: p13-e04-chmod-octal
  title: 04. Cambiar permisos con chmod octal
  description: |
    Recibe un modo octal de **tres dígitos** (por ejemplo `600`, `640`, `755`) y la ruta de un fichero regular. Asigna exactamente esos permisos usando `chmod`. Imprime `Permisos cambiados` cuando termina bien.

    Trabaja con `/home/learner/lab/aso-fundamentos/permisos/archivo-octal.txt`. Rechaza caracteres fuera de 0-7 y cualquier fichero inexistente.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `chmod`.
    - **Bash / conceptos:** `[[ ... =~ ... ]]`, `if`, `códigos de salida`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p13-e04-chmod-octal.sh`
    - **Uso:** `p13-e04-chmod-octal.sh MODO FICHERO`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Dos argumentos.
    - Modo compuesto exactamente por tres dígitos de 0 a 7.
    - Fichero regular existente.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Resultado indicado; stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Uso: MODO FICHERO`.
    - **modo:** código `2`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Modo octal invalido`.
    - **no-fichero:** código `3`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Fichero no valido`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p13-e04-chmod-octal.sh 600 /home/learner/lab/aso-fundamentos/permisos/archivo-octal.txt
    ```
    Salida estándar esperada:
    ```text
    Permisos cambiados
    ```
    Código de salida: `0`.
  tips:
  - 'Recuerda: lectura=4, escritura=2 y ejecución=1.'
  sources: []
  supplemental: Ficheros y nombres de prueba creados únicamente para este entorno Linux Lab.
  tasks:
  - id: modo600
    description: Establece modo 600.
    points: 8
    checks:
    - type: command
      user: root
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set -e
        chmod 0644 /home/learner/lab/aso-fundamentos/permisos/archivo-octal.txt
        set +e
        set +e
        runuser -u learner -- /home/learner/lab/aso-fundamentos/scripts/p13-e04-chmod-octal.sh 600 /home/learner/lab/aso-fundamentos/permisos/archivo-octal.txt </dev/null >"$td/out" 2>"$td/err"
        status=$?
