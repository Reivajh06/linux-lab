    useradd -M -U -s /bin/bash aso_p13_admin1
    useradd -M -U -s /bin/bash aso_p13_admin2
exercises:
- id: p13-e01-existe-cuenta
  title: 01. Comprobar si existe un usuario o grupo
  description: |
    Recibe dos argumentos: `-u NOMBRE` para usuarios o `-g NOMBRE` para grupos. Comprueba su existencia en `/etc/passwd` o `/etc/group`, respectivamente. Imprime únicamente `EXISTE` o `NO EXISTE` y termina con código 0 en ambos casos.

    El nombre debe empezar por una letra minúscula y contener solo minúsculas, dígitos o `_`. No cambies ninguna cuenta. Puedes combinar `grep -q` con `if`.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `grep -q`, `/etc/passwd`, `/etc/group`.
    - **Bash / conceptos:** `case`, `if`, `[[ ... =~ ... ]]`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p13-e01-existe-cuenta.sh`
    - **Uso:** `p13-e01-existe-cuenta.sh -u|-g NOMBRE`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Exactamente dos argumentos.
    - Primero -u o -g.
    - NOMBRE tiene formato de cuenta simple.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Resultado indicado; stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Uso: -u|-g NOMBRE`.
    - **opcion:** código `2`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Opcion invalida`.
    - **nombre:** código `3`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Nombre invalido`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p13-e01-existe-cuenta.sh -u root
    ```
    Salida estándar esperada:
    ```text
    EXISTE
    ```
    Código de salida: `0`.
  tips:
  - Busca `^NOMBRE:` para evitar coincidencias parciales de nombres.
  sources: []
  supplemental: Ficheros y nombres de prueba creados únicamente para este entorno Linux Lab.
  tasks:
  - id: comprobaciones
    description: Usuarios y grupos existentes y ausentes.
    points: 12
    checks:
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set +e
        /home/learner/lab/aso-fundamentos/scripts/p13-e01-existe-cuenta.sh -u root </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s 'EXISTE
        ')
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        exit 0
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set +e
        /home/learner/lab/aso-fundamentos/scripts/p13-e01-existe-cuenta.sh -g root </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s 'EXISTE
        ')
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        exit 0
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set +e
        /home/learner/lab/aso-fundamentos/scripts/p13-e01-existe-cuenta.sh -u aso_inexistente_123 </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s 'NO EXISTE
        ')
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        exit 0
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set +e
        /home/learner/lab/aso-fundamentos/scripts/p13-e01-existe-cuenta.sh -g aso_inexistente_123 </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s 'NO EXISTE
        ')
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        exit 0
  - id: errores
    description: Tipos de error.
    points: 8
    checks:
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set +e
        /home/learner/lab/aso-fundamentos/scripts/p13-e01-existe-cuenta.sh -u </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 1 ] || exit 1
        [ ! -s "$td/out" ] || exit 1
        actual=$(cat "$td/err")
        expected=$(printf %s 'Uso: -u|-g NOMBRE')
        [ "$actual" = "$expected" ] || exit 1
        exit 0
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set +e
        /home/learner/lab/aso-fundamentos/scripts/p13-e01-existe-cuenta.sh -x root </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 2 ] || exit 1
        [ ! -s "$td/out" ] || exit 1
        actual=$(cat "$td/err")
        expected=$(printf %s 'Opcion invalida')
        [ "$actual" = "$expected" ] || exit 1
        exit 0
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set +e
        /home/learner/lab/aso-fundamentos/scripts/p13-e01-existe-cuenta.sh -u MAYUS </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 3 ] || exit 1
        [ ! -s "$td/out" ] || exit 1
        actual=$(cat "$td/err")
        expected=$(printf %s 'Nombre invalido')
        [ "$actual" = "$expected" ] || exit 1
        exit 0
- id: p13-e02-grupos-usuario
  title: 02. Mostrar los grupos de un usuario
  description: |
    Recibe un nombre de usuario existente. Muestra sus grupos primario y secundarios en una línea, con los mismos nombres y orden que `id -nG USUARIO`. No añadas texto alrededor.

    A diferencia de `grep` sobre `/etc/group`, `id` considera también el grupo primario.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `id -nG`.
    - **Bash / conceptos:** `if`, `[[ ... =~ ... ]]`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p13-e02-grupos-usuario.sh`
    - **Uso:** `p13-e02-grupos-usuario.sh USUARIO`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Exactamente un argumento.
    - Nombre simple con minúsculas, números o `_`.
    - El usuario debe existir.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Resultado indicado; stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Uso: USUARIO`.
    - **nombre:** código `2`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Nombre invalido`.
    - **usuario:** código `3`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Usuario inexistente`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p13-e02-grupos-usuario.sh aso_taller_a
    ```
    Salida estándar esperada:
    ```text
    aso_taller_a
    ```
    Código de salida: `0`.
  tips:
  - '`id`, `groups` y `whoami` aparecen en la práctica 1.3.'
  sources: []
  supplemental: Ficheros y nombres de prueba creados únicamente para este entorno Linux Lab.
  tasks:
  - id: grupos
    description: Muestra grupos de usuarios conocidos.
    points: 12
    checks:
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set +e
        /home/learner/lab/aso-fundamentos/scripts/p13-e02-grupos-usuario.sh root </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(id -nG root)
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        exit 0
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set +e
        /home/learner/lab/aso-fundamentos/scripts/p13-e02-grupos-usuario.sh aso_taller_a </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(id -nG aso_taller_a)
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        exit 0
  - id: errores
    description: Valida nombre y existencia.
    points: 8
    checks:
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set +e
        /home/learner/lab/aso-fundamentos/scripts/p13-e02-grupos-usuario.sh </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 1 ] || exit 1
