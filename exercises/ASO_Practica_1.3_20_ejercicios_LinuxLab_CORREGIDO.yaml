- id: p13-e06-umask-privado
  title: 06. Crear un directorio y fichero privados
  description: |
    Recibe un nombre de entre 3 y 10 letras minúsculas. Dentro de `/home/learner/lab/aso-fundamentos/umask`, crea un directorio con ese nombre y un fichero `nota.txt` que contenga exactamente `hola` y un salto de línea.

    Antes de crear nada, establece `umask 077` para que el directorio quede con permisos `700` y el fichero con permisos `600`. Imprime `Creado`. Si el directorio destino existe, no modifiques nada y devuelve código 3.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `umask 077`, `mkdir`, `printf`, `>`.
    - **Bash / conceptos:** `if`, `[[ -d ... ]]`, `"$1"`.

