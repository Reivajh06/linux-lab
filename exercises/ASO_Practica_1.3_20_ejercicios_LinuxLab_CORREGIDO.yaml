- id: p13-e20-practica-integradora-pequena-empresa
  title: '20. Práctica integradora: pequeña empresa'
  description: |
    Automatiza la actividad final de la Práctica 1.3 en versión reducida. Sin argumentos, crea si no existen el grupo `aso_p13_empresa`, el usuario `aso_p13_jefe`, los usuarios `aso_p13_trab1` y `aso_p13_trab2`. Todos deben pertenecer al grupo como secundario. El jefe será su administrador (`gpasswd -A`). Crea `/home/learner/lab/aso-fundamentos/directorios/empresa-integrada` con propietario `aso_p13_jefe`, grupo `aso_p13_empresa` y modo **1770** (sticky). A los dos trabajadores aplica con chage: máximo 60 días, aviso 4 días, inactividad 2 días. No asignes contraseñas en texto claro. El script debe poder ejecutarse de nuevo sin fallar. Requiere root.

    ### Comandos y conceptos a practicar
    - **Comandos:** `groupadd`, `useradd`, `usermod -aG`, `gpasswd -A`, `chage -M -W -I`, `mkdir -p`, `chown`, `chmod`.
    - **Bash / conceptos:** `if`, `getent`, `&&`, `||`, `exit`.

    ### Entrega
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p13-e20-practica-integradora-pequena-empresa.sh`
    - **Uso:** `p13-e20-practica-integradora-pequena-empresa.sh (sin argumentos)`
    - Empieza con `#!/bin/bash`, guarda el script tú mismo y hazlo ejecutable (`chmod +x`).

    ### Validaciones y resultados
    - 0: stdout `Empresa preparada`, estado de usuarios/grupo/directorio correcto, stderr vacío.
    - 1: stderr `Este script no admite argumentos`.
    - Si ya están creados, conserva el estado correcto sin emitir errores.

    ### Ejemplo
    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p13-e20-practica-integradora-pequena-empresa.sh
    ```
    Salida esperada:
    ```text
    Empresa preparada

    ```
