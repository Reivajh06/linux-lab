    chmod 0644 /home/learner/lab/aso-fundamentos/permisos/archivo-octal.txt
    chmod 0600 /home/learner/lab/aso-fundamentos/permisos/para-grupo.txt /home/learner/lab/aso-fundamentos/permisos/para-dueno.txt
    chmod 0777 /home/learner/lab/aso-fundamentos/directorios/sticky-a /home/learner/lab/aso-fundamentos/directorios/sticky-b
    groupadd aso_taller_equipo
    groupadd aso_taller_comun
    useradd -M -U -s /bin/bash aso_taller_a
    useradd -M -U -s /bin/bash aso_taller_b
