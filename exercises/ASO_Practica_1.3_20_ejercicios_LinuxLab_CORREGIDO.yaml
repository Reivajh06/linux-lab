- id: p13-e12-chage-claves
  title: 12. Configurar caducidad de contraseñas con chage
  description: |
    Script de administración (root). Recibe cuatro argumentos: `USUARIO MAX AVISO INACTIVO`. Configura con `chage` la **edad máxima** de la contraseña (MAX), el **periodo de aviso** (AVISO) y el **periodo de inactividad** (INACTIVO) en días.

    MAX debe estar entre 1 y 365; AVISO entre 0 y MAX; INACTIVO entre 0 y 30. Los tres valores deben ser cadenas de dígitos. Rechaza los errores sin cambiar la configuración. Muestra `Politica actualizada` al terminar. Usa las cuentas de prueba `aso_taller_a` y `aso_taller_b`; no cambies contraseñas reales. Esto practica la sección de contraseñas de la práctica 1.3.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `chage -M -W -I`, `id`.
    - **Bash / conceptos:** `if`, `[[ ... =~ ... ]]`, `(( ... ))`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p13-e12-chage-claves.sh`
    - **Uso:** `p13-e12-chage-claves.sh USUARIO MAX AVISO INACTIVO`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Exactamente cuatro argumentos.
    - La cuenta de usuario debe existir.
    - Los tres plazos deben ser enteros no negativos.
    - Rangos MAX 1..365, AVISO 0..MAX, INACTIVO 0..30.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Resultado indicado; stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Uso: USUARIO MAX AVISO INACTIVO`.
