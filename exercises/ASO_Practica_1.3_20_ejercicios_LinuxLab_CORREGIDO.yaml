schema_version: 1
id: aso-p13-20-ejercicios-bash-2026
version: '1.1'
title: 'ASO - Práctica 1.3: permisos, usuarios y grupos'
folder: ASO Prácticas · 20 ejercicios
description: |-
  20 ejercicios independientes basados en Práctica 1.3 (ULPGC, curso 2026/2027). Comandos generales: whoami, id, groups, ls -l, chmod (octal y simbólico), chown, chgrp, umask, groupadd, useradd, usermod, gpasswd, chage, getent. Conceptos: UID/GID, permisos rwx, propietario/grupo/otros, permisos especiales SGID y sticky bit, umask, cuentas, grupos primarios/secundarios, caducidad, Bash (if, parámetros, códigos de salida). Las acciones de administración se prueban solo dentro del entorno Linux Lab.

  Cada ejercicio incluye enunciado, ruta de script, comandos/conceptos y pruebas automáticas. Crea los scripts tú: la preparación solo facilita datos. Para las tareas Bash, escribe el shebang #!/bin/bash y da permisos de ejecución al script. Se usan las claves legacy `tasks` y `command`, compatibles con el formato solicitado por tu importador. Cuando no se diga otra cosa, stdout lleva los resultados, stderr los errores, éxito devuelve 0 y el número incorrecto de argumentos devuelve 1.
setup:
- script: |
    install -d -o learner -g learner /home/learner/lab/aso-fundamentos
    install -d -o learner -g learner /home/learner/lab/aso-fundamentos/scripts
    install -d -o learner -g learner /home/learner/lab/aso-fundamentos/permisos
    install -d -o learner -g learner /home/learner/lab/aso-fundamentos/directorios
    install -d -o learner -g learner /home/learner/lab/aso-fundamentos/umask
    install -d -o learner -g learner /home/learner/lab/aso-fundamentos/directorios/sticky-a
    install -d -o learner -g learner /home/learner/lab/aso-fundamentos/directorios/sticky-b
    install -d -o learner -g learner /home/learner/lab/aso-fundamentos/directorios/privado
    printf '%s\n' 'solo un ejemplo' > /home/learner/lab/aso-fundamentos/permisos/ver-permisos.txt
    printf '%s\n' 'datos de prueba' > /home/learner/lab/aso-fundamentos/permisos/archivo-octal.txt
    printf '%s\n' 'datos de prueba' > /home/learner/lab/aso-fundamentos/permisos/archivo-simbolico.txt
    printf '%s\n' 'contenido grupo' > /home/learner/lab/aso-fundamentos/permisos/para-grupo.txt
    printf '%s\n' 'contenido usuario' > /home/learner/lab/aso-fundamentos/permisos/para-dueno.txt
    printf '%s\n' 'no soy un directorio' > /home/learner/lab/aso-fundamentos/permisos/un-fichero.txt
    chown -R learner:learner /home/learner/lab/aso-fundamentos
    chmod 0640 /home/learner/lab/aso-fundamentos/permisos/ver-permisos.txt
