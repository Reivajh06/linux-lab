        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        getent group aso_p13_empresa >/dev/null || exit 1
        for u in aso_p13_jefe aso_p13_trab1 aso_p13_trab2; do
