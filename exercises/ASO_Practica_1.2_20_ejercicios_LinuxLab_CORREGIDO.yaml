- id: p12-e06-cambiar-separador
  title: 06. Sustituir un separador desde stdin
  description: |
    Escribe un filtro que lea texto de la **entrada estándar** y cambie todas las apariciones del carácter indicado como único argumento por un espacio. Debe conservar el resto de caracteres y los saltos de línea.

    No uses un nombre de fichero fijo: debe funcionar con `script.sh ':' < archivo.txt` y también con una tubería. Usa `tr`.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `tr`, `<`, `|`.
    - **Bash / conceptos:** `[[ ${#variable} -eq 1 ]]`, `"$1"`.

