- id: p12-e13-listar-extension
  title: 13. Listar ficheros mediante comodines
  description: |
    Recibe un directorio y una extensión sin punto (por ejemplo `txt`, `log`, `jpg`). Muestra las **rutas completas** de los ficheros regulares que estén directamente en ese directorio y terminen en `.EXTENSION`, ordenadas alfabéticamente. No recorras subdirectorios ni muestres ficheros ocultos.

    Si no hay coincidencias, stdout debe quedar vacío y el script terminar con código 0. Usa comodines `*` de Bash.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `comodín *`, `sort`, `printf`.
    - **Bash / conceptos:** `for`, `[[ -f ... ]]`, `if`.
    - **Ampliación opcional (no evaluada):** Prueba con `find -maxdepth 1 -type f -name "*.txt"` y compara el resultado con los comodines de Bash. No es necesario usar `find` en el script evaluado.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p12-e13-listar-extension.sh`
    - **Uso:** `p12-e13-listar-extension.sh DIRECTORIO EXTENSION`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Exactamente dos argumentos.
    - El primer argumento debe ser un directorio.
    - Extensión formada solo por letras minúsculas.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Resultado indicado; stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Uso: DIRECTORIO EXTENSION`.
    - **no-directorio:** código `2`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Directorio no valido`.
    - **extension:** código `3`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Extension invalida`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p12-e13-listar-extension.sh /home/learner/lab/aso-fundamentos/extensiones txt
    ```
    Salida estándar esperada:
    ```text
    /home/learner/lab/aso-fundamentos/extensiones/informe1.txt
    /home/learner/lab/aso-fundamentos/extensiones/informe2.txt
    /home/learner/lab/aso-fundamentos/extensiones/notas clase.txt
    ```
    Código de salida: `0`.
  tips:
  - En Bash, `"$directorio"/*.txt` permite expandir solo la parte del patrón que no va entre 
    comillas.
  - Al recorrer coincidencias, comprueba que cada entrada sea un fichero regular.
