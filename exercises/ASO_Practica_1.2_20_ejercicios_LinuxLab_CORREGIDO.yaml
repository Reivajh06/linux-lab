schema_version: 1
id: aso-p12-20-ejercicios-bash-2026
version: '1.1'
title: 'ASO - Práctica 1.2: filtros, tuberías y expresiones regulares'
folder: ASO Prácticas · 20 ejercicios
description: |-
  20 ejercicios independientes basados en Práctica 1.2 (ULPGC, curso 2026/2027). Comandos generales: cat, head, tail, cut, grep, sort, uniq, tr, wc, nl, ls, touch, mkdir, cp, redirecciones (<, >, >>, 2>) y tuberías (|). Conceptos: rutas, comodines (*, ?, []), expansión de llaves, ficheros de texto, campos, ordenaciones, expresiones regulares (anclas ^ y $, clases [], cuantificadores +, *, {n}, alternancia), Bash inicial (parámetros, if, for, while). No se requieren awk, sed, find ni Python.

  Cada ejercicio incluye enunciado, ruta de script, comandos/conceptos y pruebas automáticas. Crea los scripts tú: la preparación solo facilita datos. Para las tareas Bash, escribe el shebang #!/bin/bash y da permisos de ejecución al script. Se usan las claves legacy `tasks` y `command`, compatibles con el formato solicitado por tu importador. Cuando no se diga otra cosa, stdout lleva los resultados, stderr los errores, éxito devuelve 0 y el número incorrecto de argumentos devuelve 1.
