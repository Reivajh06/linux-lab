  description: |
    Recibe un entero `N` de 1 a 5 y crea en `/home/learner/lab/aso-fundamentos/series` los ficheros vacíos `nota1.txt`, `nota2.txt`, ..., `notaN.txt`. Si ya existen, déjalos vacíos.

    No crees otros ficheros. Cuando termine, imprime exactamente `Creados: N`. Usa `while`, aritmética Bash y `touch`/redirecciones.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `touch`, `>`.
    - **Bash / conceptos:** `while`, `(( ... ))`, `if`.

