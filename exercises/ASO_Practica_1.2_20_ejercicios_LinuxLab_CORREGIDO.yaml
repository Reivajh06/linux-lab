    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Exactamente un argumento.
    - El fichero debe ser regular.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Resultado indicado; stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Se espera un fichero`.
    - **no-fichero:** código `2`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Fichero no valido`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p12-e11-contar-repetidos.sh /home/learner/lab/aso-fundamentos/datos/frutas.txt
    ```
    Salida estándar esperada:
    ```text
          1 kiwi
          2 manzana
          3 pera
          2 uva
    ```
    Código de salida: `0`.
  tips:
  - La salida debe tener exactamente el formato de `uniq -c`, sin reformatear los números.
