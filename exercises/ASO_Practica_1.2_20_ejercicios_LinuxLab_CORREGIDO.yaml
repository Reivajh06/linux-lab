- id: p12-e08-contar-texto
  title: 08. Contar líneas que contienen un texto
  description: |
    Recibe una ruta de fichero y un texto de búsqueda. Muestra el número de líneas que contienen ese texto, sin distinguir mayúsculas de minúsculas. El texto se interpreta **literalmente**, no como expresión regular. Si no hay coincidencias muestra `0` y termina con éxito.

    Practica `grep -i`, `-F` y `-c`.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `grep -iF`, `grep -c`, `grep -iFc`.
    - **Bash / conceptos:** `if`, `[[ -f ... ]]`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p12-e08-contar-texto.sh`
    - **Uso:** `p12-e08-contar-texto.sh FICHERO TEXTO`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Exactamente dos argumentos.
    - La ruta corresponde a un fichero.
    - El texto no debe estar vacío.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Resultado indicado; stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Uso: FICHERO TEXTO`.
    - **no-fichero:** código `2`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Fichero no valido`.
    - **texto:** código `3`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Texto de busqueda vacio`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p12-e08-contar-texto.sh /home/learner/lab/aso-fundamentos/datos/mensajes.txt info
    ```
    Salida estándar esperada:
    ```text
    3
    ```
    Código de salida: `0`.
  tips:
  - '`grep -F` busca cadenas literales; `grep -i` ignora mayúsculas.'
