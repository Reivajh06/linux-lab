- id: p12-e15-copiar-con-redireccion
  title: 15. Copiar un texto mediante redirección
  description: |
    Recibe la ruta de un fichero de texto origen y la ruta del fichero de destino. Crea el destino con el **mismo contenido** usando redirección estándar (puedes usar `cat >`). Si ya existe el destino, sobrescríbelo. Muestra `Copia realizada`.

    El origen debe ser un fichero regular legible. El directorio del destino debe existir y el destino no debe ser un directorio. No uses `cp` en este ejercicio: queremos practicar flujos. Prueba con `/home/learner/lab/aso-fundamentos/copias/copia.txt`.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `cat`, `>`, `dirname`.
    - **Bash / conceptos:** `[[ -r ... ]]`, `if`, `"$1"`, `"$2"`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p12-e15-copiar-con-redireccion.sh`
    - **Uso:** `p12-e15-copiar-con-redireccion.sh ORIGEN DESTINO`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Exactamente dos argumentos.
    - Origen fichero regular y legible.
    - Directorio padre del destino accesible; destino no es directorio.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Resultado indicado; stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Uso: ORIGEN DESTINO`.
    - **no-fichero:** código `2`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Origen no valido`.
    - **destino:** código `3`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Destino no valido`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p12-e15-copiar-con-redireccion.sh /home/learner/lab/aso-fundamentos/datos/mensajes.txt /home/learner/lab/aso-fundamentos/copias/copia.txt
    ```
    Salida estándar esperada:
    ```text
    Copia realizada
    ```
    Código de salida: `0`.
  tips:
  - En Bash puedes comprobar `-f`, `-r`, `-d` y gestionar los errores con `if`.
  - Para obtener el directorio padre de una ruta puedes usar expansión de parámetros `${ruta%/*}` o 
    un comando elemental.
