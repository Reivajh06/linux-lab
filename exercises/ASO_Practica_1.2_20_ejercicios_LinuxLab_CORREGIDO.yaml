- id: p12-e07-linea-concreta
  title: 07. Mostrar la línea N de un fichero
  description: |
    Recibe un fichero de texto y un número de línea `N` (empezando en 1). Muestra **solo esa línea** y un salto final.

    Si el fichero no tiene tantas líneas, muestra `Linea fuera del fichero` en stderr con código 4. Debe resolverse con filtros sencillos como `head`, `tail` y `wc`.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `wc -l`, `head -n`, `tail -n`, `|`.
    - **Bash / conceptos:** `if`, `(( ... ))`.

