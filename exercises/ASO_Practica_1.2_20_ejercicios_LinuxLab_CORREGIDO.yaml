- id: p12-e11-contar-repetidos
  title: 11. Contar repeticiones con uniq -c
  description: |
    Recibe un fichero con una palabra por línea. Muestra una línea por palabra, ordenadas alfabéticamente, precedida por su frecuencia **en el formato estándar de `uniq -c`** (incluidos sus espacios de alineación).

    Practica `sort | uniq -c` con los ficheros de frutas y colores.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `sort`, `uniq -c`, `|`.
    - **Bash / conceptos:** `if`, `[[ -f ... ]]`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p12-e11-contar-repetidos.sh`
