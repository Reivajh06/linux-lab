    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Dos argumentos exactos.
    - El fichero debe ser regular.
    - N debe ser un entero mayor que cero.
    - La línea N debe existir.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Resultado indicado; stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Uso: FICHERO N`.
    - **no-fichero:** código `2`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Fichero no valido`.
    - **no-numero:** código `3`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `N debe ser positivo`.
    - **rango:** código `4`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Linea fuera del fichero`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p12-e07-linea-concreta.sh /home/learner/lab/aso-fundamentos/datos/mensajes.txt 1
    ```
    Salida estándar esperada:
    ```text
    INFO:inicio
    ```
    Código de salida: `0`.
  tips:
  - Puedes contar con `wc -l < fichero` para obtener solo el número.
  - '`head -n N | tail -n 1` selecciona una línea concreta.'
