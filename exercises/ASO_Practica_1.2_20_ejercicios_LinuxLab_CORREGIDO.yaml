- id: p12-e02-extraer-campo
  title: 02. Seleccionar un campo de /etc/passwd
  description: |
    Recibe la ruta de un fichero con formato `passwd` y un número de campo **de 1 a 7**. Muestra el contenido de ese campo para todas las líneas, respetando el orden del fichero.

    Valida los argumentos en este orden: cantidad, fichero, formato numérico y rango. Usa `cut -d` y `-f`.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `cut -d: -f`, `cat`.
    - **Bash / conceptos:** `$#`, `[[ ... =~ ... ]]`, `(( ... ))`.
    - **Ampliación opcional (no evaluada):** Extrae el mismo campo con `awk -F:`, en lugar de `cut`. Hazlo solo como comparación; la solución evaluada puede usar `cut`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p12-e02-extraer-campo.sh`
    - **Uso:** `p12-e02-extraer-campo.sh FICHERO CAMPO`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Exactamente dos argumentos.
    - Fichero regular existente.
    - CAMPO compuesto por uno o más dígitos.
    - El valor numérico CAMPO debe estar entre 1 y 7.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Resultado indicado; stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Uso: FICHERO CAMPO`.
    - **no-fichero:** código `2`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Fichero no valido`.
    - **no-numero:** código `3`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `El campo debe ser numerico`.
    - **rango:** código `4`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Campo fuera de rango`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p12-e02-extraer-campo.sh /home/learner/lab/aso-fundamentos/datos/usuarios.txt 1
    ```
    Salida estándar esperada:
    ```text
    ana
    bruno
    carla
    david
    elena
    fabio
    gloria
    ```
    Código de salida: `0`.
  tips:
  - '`$#` indica el número de parámetros.'
  - Puedes validar enteros con `[[ ... =~ ... ]]` y luego comparar con `(( ... ))`.
