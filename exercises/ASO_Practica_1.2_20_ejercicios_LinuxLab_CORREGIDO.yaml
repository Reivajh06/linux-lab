exercises:
- id: p12-e01-nombres-ordenados
  title: 01. Nombres de usuario ordenados
  description: |
    Escribe un script que reciba un fichero con el formato de `/etc/passwd` y muestre **solo el campo 1** (nombre de usuario), un nombre por línea y en orden alfabético.

    Prueba con `/home/learner/lab/aso-fundamentos/datos/usuarios.txt` y `/home/learner/lab/aso-fundamentos/datos/usuarios-corto.txt`. No modifiques el fichero original. Usa `cut` y `sort`.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `cut -d: -f1`, `sort`, `|`.
    - **Bash / conceptos:** `"$1"`, `[[ -f ... ]]`, `if`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p12-e01-nombres-ordenados.sh`
    - **Uso:** `p12-e01-nombres-ordenados.sh FICHERO`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Debes aportar exactamente una ruta.
    - La ruta debe ser un fichero regular.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Resultado indicado; stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Se espera un fichero`.
    - **no-fichero:** código `2`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `No existe un fichero regular`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p12-e01-nombres-ordenados.sh /home/learner/lab/aso-fundamentos/datos/usuarios.txt
    ```
    Salida estándar esperada:
    ```text
    ana
    bruno
    carla
    david
    elena
    fabio
    gloria
    ```
    Código de salida: `0`.
  tips:
  - El separador de `/etc/passwd` es `:`.
  - Las tuberías conectan la salida de un filtro con la entrada del siguiente.
  sources: []
  supplemental: Ficheros y nombres de prueba creados únicamente para este entorno Linux Lab.
  tasks:
  - id: dos-ficheros
    description: Extrae y ordena los nombres en dos conjuntos distintos.
    points: 12
    checks:
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set +e
        /home/learner/lab/aso-fundamentos/scripts/p12-e01-nombres-ordenados.sh /home/learner/lab/aso-fundamentos/datos/usuarios.txt </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s 'ana
        bruno
        carla
        david
        elena
        fabio
        gloria
        ')
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        exit 0
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set +e
        /home/learner/lab/aso-fundamentos/scripts/p12-e01-nombres-ordenados.sh /home/learner/lab/aso-fundamentos/datos/usuarios-corto.txt </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s 'alba
