- id: p31-e16-localizar-procesos-con-pgrep
  title: 16. Localizar procesos con pgrep
  description: |
    Recibe un nombre de comando y muestra los PID, uno por línea y ordenados numéricamente, que devuelva `pgrep -x` (nombre exacto). Si no hay coincidencias, stdout vacío y código 0. Para practicar, prueba `pgrep -x bash` o `pgrep -x sleep`.

    ### Comandos a practicar
    - **Comandos:** `pgrep -x`, `sort -n`.
    - **Bash y conceptos:** `if`, salida de comandos y manejo de coincidencia vacía.

    ### Script a entregar
    - **Ruta:** `/home/learner/lab/aso-procesos/scripts/p31-e16-localizar-procesos-con-pgrep.sh`.
    - **Uso:** `p31-e16-localizar-procesos-con-pgrep.sh COMANDO`.
    - Debe comenzar con `#!/bin/bash` y tener permiso de ejecución.

    ### Entradas, salidas y errores
    - **Salida correcta:** stdout según el enunciado, stderr vacío, código 0.
    - **Errores:** stdout vacío; el mensaje se imprime en stderr, con salto de línea.
      - **Código 1:** `Uso: COMANDO`.

    Para evitar resultados cambiantes, la evaluación comprueba el caso sin coincidencias y también una búsqueda de un proceso `sleep` creado de forma aislada.

    ### Ejemplo de invocación
    ```bash
    /home/learner/lab/aso-procesos/scripts/p31-e16-localizar-procesos-con-pgrep.sh proceso_que_no_existe_xxx
    ```
  tips:
  - '`pgrep` devuelve código 1 si no encuentra coincidencias: en este ejercicio, la ausencia no es un
    error del script.'
  tasks:
  - id: funcionamiento
    description: Comprueba casos de éxito y resultados.
    points: 14
    checks:
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        [ -x /home/learner/lab/aso-procesos/scripts/p31-e16-localizar-procesos-con-pgrep.sh ] || exit 1
        set +e
        /home/learner/lab/aso-procesos/scripts/p31-e16-localizar-procesos-con-pgrep.sh proceso_que_no_existe_xxx </dev/null >"$td/out" 2>"$td/err"
        rc=$?
        [ "$rc" -eq 0 ] || exit 1
        [ ! -s "$td/out" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        exit 0
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        sleep 30 &
        pid=$!
        trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; rm -rf "$td"' EXIT
        set +e
        /home/learner/lab/aso-procesos/scripts/p31-e16-localizar-procesos-con-pgrep.sh sleep </dev/null >"$td/out" 2>"$td/err"
        rc=$?
        [ "$rc" -eq 0 ] && [ ! -s "$td/err" ] || exit 1
        grep -Fxq "$pid" "$td/out" || exit 1
        while IFS= read -r value; do
          printf '%s\n' "$value" | grep -Eq '^[0-9]+$' || exit 1
        done <"$td/out"
        exit 0
  - id: validaciones
    description: Comprueba argumentos, errores y códigos de salida.
    points: 6
    checks:
