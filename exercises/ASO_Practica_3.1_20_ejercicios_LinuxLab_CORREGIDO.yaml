- id: p31-e03-cinco-procesos-con-mas-tiempo-de-cpu
  title: 03. Cinco procesos con más tiempo de CPU
  description: |
    Muestra `PID COMANDO TIEMPO_CPU` para los cinco procesos que más tiempo acumulado de CPU tienen en el volcado. El campo 7 tiene formato fijo HH:MM:SS, por lo que puede ordenarse como texto en orden descendente. Si hay empate, conserva el orden original.

    ### Comandos a practicar
    - **Comandos:** `sort -s -t'|' -k7,7r`, `head -n 5`, `cut`.
    - **Bash y conceptos:** tuberías y ordenación por campos.

    ### Script a entregar
    - **Ruta:** `/home/learner/lab/aso-procesos/scripts/p31-e03-cinco-procesos-con-mas-tiempo-de-cpu.sh`.
    - **Uso:** `p31-e03-cinco-procesos-con-mas-tiempo-de-cpu.sh (sin argumentos)`.
    - Debe comenzar con `#!/bin/bash` y tener permiso de ejecución.

    ### Entradas, salidas y errores
    - **Salida correcta:** stdout según el enunciado, stderr vacío, código 0.
    - **Errores:** stdout vacío; el mensaje se imprime en stderr, con salto de línea.
      - **Código 1:** `Uso: (sin argumentos)`.

    ### Ejemplo de invocación
    ```bash
    /home/learner/lab/aso-procesos/scripts/p31-e03-cinco-procesos-con-mas-tiempo-de-cpu.sh
    ```
  tips: []
  tasks:
  - id: funcionamiento
    description: Comprueba casos de éxito y resultados.
    points: 14
    checks:
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        [ -x /home/learner/lab/aso-procesos/scripts/p31-e03-cinco-procesos-con-mas-tiempo-de-cpu.sh ] || exit 1
        set +e
        /home/learner/lab/aso-procesos/scripts/p31-e03-cinco-procesos-con-mas-tiempo-de-cpu.sh </dev/null >"$td/out" 2>"$td/err"
        rc=$?
        [ "$rc" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s '325 gcc 00:20:00
        340 java 00:05:15
        315 python3 00:03:30
        100 systemd 00:01:10
        401 httpd 00:00:42
        ')
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        exit 0
  - id: validaciones
    description: Comprueba argumentos, errores y códigos de salida.
    points: 6
    checks:
