- id: p31-e19-terminar-un-proceso-de-prueba-por-pid
  title: 19. Terminar un proceso de prueba por PID
  description: |
    Recibe PID. Si el proceso existe y puedes enviarle señales, envía **SIGTERM solo a ese PID** con `kill -TERM`, muestra `TERMINADO` y termina con 0. Si no existe o no tienes permiso, emite `No se pudo terminar` con código 3. La evaluación crea un `sleep` propio; nunca actúes sobre PIDs ajenos.

    ### Comandos a practicar
    - **Comandos:** `kill -TERM`, `kill -0`, `ps -p`.
    - **Bash y conceptos:** validación y control de errores del comando kill.

    ### Script a entregar
    - **Ruta:** `/home/learner/lab/aso-procesos/scripts/p31-e19-terminar-un-proceso-de-prueba-por-pid.sh`.
    - **Uso:** `p31-e19-terminar-un-proceso-de-prueba-por-pid.sh PID`.
    - Debe comenzar con `#!/bin/bash` y tener permiso de ejecución.

    ### Entradas, salidas y errores
    - **Salida correcta:** stdout según el enunciado, stderr vacío, código 0.
    - **Errores:** stdout vacío; el mensaje se imprime en stderr, con salto de línea.
      - **Código 1:** `Uso: PID`.
      - **Código 2:** `PID no valido`.
      - **Código 3:** `No se pudo terminar`.

    ### Ejemplo de invocación
    ```bash
    /home/learner/lab/aso-procesos/scripts/p31-e19-terminar-un-proceso-de-prueba-por-pid.sh PID
    ```
    (Usa una ruta existente o un PID válido en lugar de los marcadores.)
  tips:
  - No utilices `killall` ni `pkill` si la especificación exige terminar solamente el PID indicado.
  tasks:
  - id: funcionamiento
    description: Comprueba casos de éxito y resultados.
    points: 14
    checks:
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        sleep 30 &
        pid=$!
        trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; rm -rf "$td"' EXIT
        [ -x /home/learner/lab/aso-procesos/scripts/p31-e19-terminar-un-proceso-de-prueba-por-pid.sh ] || exit 1
        set +e
        /home/learner/lab/aso-procesos/scripts/p31-e19-terminar-un-proceso-de-prueba-por-pid.sh "$pid" </dev/null >"$td/out" 2>"$td/err"
        rc=$?
        [ "$rc" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s 'TERMINADO
        ')
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        wait "$pid" 2>/dev/null || true
        ! kill -0 "$pid" 2>/dev/null || exit 1
        exit 0
