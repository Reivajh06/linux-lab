schema_version: 1
id: aso-p31-20-ejercicios-bash-2026
version: '1.1'
title: 'ASO - Práctica 3.1: procesos en Linux (20 ejercicios)'
folder: ASO Prácticas · 20 ejercicios
description: |-
  Basados en la Práctica 3.1 de ULPGC (2026/2027). Comandos generales: `ps` (opciones `-e`, `-f`, `-o`, `--sort`, `--no-headers`), `top` (uso no interactivo `-b -n 1`), `pgrep`, `pidof`, `pstree`, `kill`, `killall`, `pkill`, `head`, `grep`, `cut`, `sort`, `uniq`, `wc` y tuberías. Conceptos Bash: argumentos, bucles, comprobaciones, expresiones regulares, códigos de salida, procesos padre/hijo, PID/PPID, estados S, R, Z, T, CPU, memoria, señales y trabajos en segundo plano.

  IMPORTANTE: En los ejercicios 1-14 y 20 se utiliza el fichero `/home/learner/lab/aso-procesos/datos/procesos.psv` (volcado simplificado de `ps` **con separador `|` y SIN cabecera**) para que las evaluaciones sean estables. Sus campos son: 1 PID, 2 USUARIO, 3 PPID, 4 ESTADO, 5 %CPU, 6 %MEM, 7 TIEMPO_CPU, 8 TIEMPO_TRANSCURRIDO, 9 COMANDO, 10 TTY, 11 LÍNEA_COMPLETA. En los ejercicios 15-19 consulta procesos reales, pero nunca termines uno que no haya sido lanzado expresamente para la actividad. La tabla de cuentas de práctica está en `/home/learner/lab/aso-procesos/datos/cuentas.passwd`.

  Cada ejercicio especifica qué comandos y qué conceptos Bash practicar. Escribe tú los scripts; el entorno solo prepara datos y herramientas simuladas. Las tareas de evaluación usan `tasks` y comandos de comprobación de sintaxis compatible con el importador. En todos los casos separa stdout y stderr, y usa los códigos de salida indicados.
setup:
- script: |
    install -d -o learner -g learner /home/learner/lab/aso-procesos
    install -d -o learner -g learner /home/learner/lab/aso-procesos/scripts
    install -d -o learner -g learner /home/learner/lab/aso-procesos/datos
    printf '%s\n' '100|root|1|S|0.0|1.2|00:01:10|05:10:00|systemd|?|/usr/lib/systemd/systemd' '210|root|100|S|0.1|0.7|00:00:10|02:00:00|sshd|?|/usr/sbin/sshd -D' '310|ana|210|S+|0.0|0.4|00:00:12|01:30:00|bash|pts/0|-bash' '315|ana|310|R+|7.5|1.1|00:03:30|00:45:00|python3|pts/0|python3 demo.py' '316|ana|310|S|0.0|0.1|00:00:01|00:05:00|sleep|pts/0|sleep 100' '320|bruno|210|S+|0.0|0.4|00:00:05|00:35:00|bash|pts/1|-bash' '325|bruno|320|R|15.1|6.5|00:20:00|00:24:00|gcc|pts/1|gcc main.c' '330|bruno|320|S|0.0|0.2|00:00:00|00:20:00|grep|pts/1|grep bash' '340|ana|310|R|3.0|2.0|00:05:15|00:20:00|java|pts/0|java -jar app.jar' '350|carla|210|S|0.0|0.3|00:00:30|00:40:00|bash|pts/2|-bash' '355|carla|350|S|0.0|0.8|00:00:07|00:30:00|vim|pts/2|vim notas.txt' '400|root|100|S|0.0|0.9|00:00:20|00:50:00|httpd|?|/usr/sbin/httpd -DFOREGROUND' '401|apache|400|S|0.2|1.3|00:00:42|00:49:00|httpd|?|/usr/sbin/httpd -DFOREGROUND' '402|apache|400|S|0.1|1.2|00:00:34|00:48:00|httpd|?|/usr/sbin/httpd -DFOREGROUND' '450|root|100|S|0.0|0.2|00:00:25|00:55:00|cron|?|/usr/sbin/cron -f' '500|ana|310|Z|0.0|0.0|00:00:00|00:01:00|child|pts/0|[child] <defunct>' '510|bruno|320|S|0.1|0.1|00:00:08|00:12:00|tail|pts/1|tail -f debug.log' '520|root|100|Ssl|0.0|0.5|00:00:06|00:20:00|dbus-daemon|?|/usr/bin/dbus-daemon' > /home/learner/lab/aso-procesos/datos/procesos.psv
    printf '%s\n' root:x:0:0::/home/root:/bin/bash ana:x:1001:1001::/home/ana:/bin/bash bruno:x:1002:1002::/home/bruno:/bin/bash carla:x:1003:1003::/home/carla:/bin/bash apache:x:48:48::/home/apache:/bin/bash sinprocesos:x:1900:1001::/home/sinprocesos:/bin/bash > /home/learner/lab/aso-procesos/datos/cuentas.passwd
    chown learner:learner /home/learner/lab/aso-procesos/datos/procesos.psv /home/learner/lab/aso-procesos/datos/cuentas.passwd
exercises:
- id: p31-e01-procesos-de-un-usuario-en-un-volcado
  title: 01. Procesos de un usuario en un volcado
  description: |
    Recibe USUARIO. Procesa `/home/learner/lab/aso-procesos/datos/procesos.psv` y muestra una línea `PID COMANDO` por cada proceso de ese usuario, en orden ascendente de PID. Si el usuario no aparece, stdout vacío y éxito.

    ### Comandos a practicar
    - **Comandos:** `grep -F`, `cut -d'|'`, `sort -n`.
    - **Bash y conceptos:** `$#`, `if`, tuberías y comillas.

    ### Script a entregar
    - **Ruta:** `/home/learner/lab/aso-procesos/scripts/p31-e01-procesos-de-un-usuario-en-un-volcado.sh`.
    - **Uso:** `p31-e01-procesos-de-un-usuario-en-un-volcado.sh USUARIO`.
    - Debe comenzar con `#!/bin/bash` y tener permiso de ejecución.

    ### Entradas, salidas y errores
    - **Salida correcta:** stdout según el enunciado, stderr vacío, código 0.
    - **Errores:** stdout vacío; el mensaje se imprime en stderr, con salto de línea.
      - **Código 1:** `Uso: USUARIO`.

    ### Ejemplo de invocación
    ```bash
    /home/learner/lab/aso-procesos/scripts/p31-e01-procesos-de-un-usuario-en-un-volcado.sh ana
    ```
  tips:
  - Filtra por el segundo campo de forma exacta, no por subcadenas que puedan aparecer en otros 
    campos.
  tasks:
  - id: funcionamiento
    description: Comprueba casos de éxito y resultados.
    points: 14
    checks:
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        [ -x /home/learner/lab/aso-procesos/scripts/p31-e01-procesos-de-un-usuario-en-un-volcado.sh ] || exit 1
        set +e
        /home/learner/lab/aso-procesos/scripts/p31-e01-procesos-de-un-usuario-en-un-volcado.sh ana </dev/null >"$td/out" 2>"$td/err"
        rc=$?
        [ "$rc" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s '310 bash
        315 python3
        316 sleep
        340 java
        500 child
        ')
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        exit 0
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        [ -x /home/learner/lab/aso-procesos/scripts/p31-e01-procesos-de-un-usuario-en-un-volcado.sh ] || exit 1
        set +e
        /home/learner/lab/aso-procesos/scripts/p31-e01-procesos-de-un-usuario-en-un-volcado.sh nadie </dev/null >"$td/out" 2>"$td/err"
        rc=$?
        [ "$rc" -eq 0 ] || exit 1
        [ ! -s "$td/out" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        exit 0
  - id: validaciones
    description: Comprueba argumentos, errores y códigos de salida.
    points: 6
    checks:
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        [ -x /home/learner/lab/aso-procesos/scripts/p31-e01-procesos-de-un-usuario-en-un-volcado.sh ] || exit 1
        set +e
        /home/learner/lab/aso-procesos/scripts/p31-e01-procesos-de-un-usuario-en-un-volcado.sh </dev/null >"$td/out" 2>"$td/err"
        rc=$?
        [ "$rc" -eq 1 ] || exit 1
        [ ! -s "$td/out" ] || exit 1
        actual=$(cat "$td/err")
        expected=$(printf %s 'Uso: USUARIO
        ')
        [ "$actual" = "$expected" ] || exit 1
        exit 0
