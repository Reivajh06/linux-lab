- id: p31-e20-practica-completa-gid-y-minimo-de-procesos
  title: 20. Práctica completa GID y mínimo de procesos
  description: |
    Adaptación de la actividad de laboratorio: recibe GID y MINIMO (enteros no negativos). Lee `/home/learner/lab/aso-procesos/datos/cuentas.passwd` para obtener las cuentas con ese GID primario y cuenta en `/home/learner/lab/aso-procesos/datos/procesos.psv` cuántos procesos tiene cada una. Muestra `USUARIO CANTIDAD` (orden alfabético) solo si CANTIDAD >= MINIMO **y CANTIDAD > 0**. Si ninguna cuenta cumple, imprime `Sin resultados` por stdout. No consultes los procesos reales del contenedor en este ejercicio.

    ### Comandos a practicar
    - **Comandos:** `cut`, `grep -Fxc`, `sort`, `wc`.
    - **Bash y conceptos:** `while IFS=: read`, `if`, `(( ))`, validación de dos enteros.

