- id: p31-e15-consultar-pid-ppid-y-comando-con-ps-real
  title: 15. Consultar PID, PPID y comando con ps real
  description: |
    Recibe un PID numérico existente. Obtén de `ps` sus columnas PID, PPID y nombre de comando (comm), sin cabecera, y muéstralas en una sola línea separadas por espacios simples. Si el PID no existe: stderr `Proceso no encontrado` y código 3.

    ### Comandos a practicar
    - **Comandos:** `ps -p PID -o pid= -o ppid= -o comm=`.
    - **Bash y conceptos:** captura con `$(...)`, `read`, `if !` y códigos de salida.

