- id: p32-e02-seleccionar-target-por-defecto
  title: 02. Seleccionar target por defecto
  description: |
    Recibe TARGET, que solo puede ser `graphical.target` o `multi-user.target`. Ejecuta `systemctl set-default TARGET`, muestra `OK` si termina bien y conserva el target en la simulación. No uses `isolate` ni cambies el target activo.

    ### Comandos a practicar
    - **Comandos:** `systemctl set-default`.
    - **Bash y conceptos:** `case`, `if !`, redirección de errores.

    ### Script a entregar
    - **Ruta:** `/home/learner/lab/aso-servicios/scripts/p32-e02-seleccionar-target-por-defecto.sh`.
    - **Uso:** `p32-e02-seleccionar-target-por-defecto.sh TARGET`.
    - Debe comenzar con `#!/bin/bash` y tener permiso de ejecución.

    ### Entradas, salidas y errores
    - **Salida correcta:** stdout según el enunciado, stderr vacío, código 0.
    - **Errores:** stdout vacío; el mensaje se imprime en stderr, con salto de línea.
      - **Código 1:** `Uso: TARGET`.
      - **Código 2:** `Target no valido`.

    ### Ejemplo de invocación
    ```bash
    /home/learner/lab/aso-servicios/scripts/p32-e02-seleccionar-target-por-defecto.sh graphical.target
    ```
  tips: []
  tasks:
  - id: funcionamiento
    description: Comprueba casos de éxito y resultados.
    points: 14
    checks:
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        mkdir -p "$td/estado"
        cp -a /home/learner/lab/aso-servicios/estado-base/. "$td/estado/" || exit 1
        export ASO_SYSTEMD_STATE_DIR="$td/estado"
        export PATH=/home/learner/lab/aso-servicios/bin:"$PATH"
        [ -x /home/learner/lab/aso-servicios/scripts/p32-e02-seleccionar-target-por-defecto.sh ] || exit 1
        set +e
        /home/learner/lab/aso-servicios/scripts/p32-e02-seleccionar-target-por-defecto.sh graphical.target </dev/null >"$td/out" 2>"$td/err"
        rc=$?
        [ "$rc" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s 'OK
        ')
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        [ "$(cat "$td/estado/default-target")" = graphical.target ] || exit 1
        grep -Fxq "set-default graphical.target" "$td/estado/acciones.log"
        exit 0
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        mkdir -p "$td/estado"
        cp -a /home/learner/lab/aso-servicios/estado-base/. "$td/estado/" || exit 1
        export ASO_SYSTEMD_STATE_DIR="$td/estado"
        export PATH=/home/learner/lab/aso-servicios/bin:"$PATH"
        [ -x /home/learner/lab/aso-servicios/scripts/p32-e02-seleccionar-target-por-defecto.sh ] || exit 1
        set +e
        /home/learner/lab/aso-servicios/scripts/p32-e02-seleccionar-target-por-defecto.sh multi-user.target </dev/null >"$td/out" 2>"$td/err"
        rc=$?
        [ "$rc" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s 'OK
        ')
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        [ "$(cat "$td/estado/default-target")" = multi-user.target ] || exit 1
        exit 0
  - id: validaciones
    description: Comprueba argumentos, errores y códigos de salida.
    points: 6
    checks:
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        mkdir -p "$td/estado"
