        [ -x /home/learner/lab/aso-servicios/scripts/p32-e01-consultar-el-target-por-defecto.sh ] || exit 1
        set +e
        /home/learner/lab/aso-servicios/scripts/p32-e01-consultar-el-target-por-defecto.sh x </dev/null >"$td/out" 2>"$td/err"
        rc=$?
        [ "$rc" -eq 1 ] || exit 1
        [ ! -s "$td/out" ] || exit 1
        actual=$(cat "$td/err")
