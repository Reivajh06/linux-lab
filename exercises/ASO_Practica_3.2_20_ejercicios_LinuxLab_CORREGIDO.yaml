        /home/learner/lab/aso-servicios/scripts/p32-e02-seleccionar-target-por-defecto.sh </dev/null >"$td/out" 2>"$td/err"
        rc=$?
        [ "$rc" -eq 1 ] || exit 1
        [ ! -s "$td/out" ] || exit 1
        actual=$(cat "$td/err")
        expected=$(printf %s 'Uso: TARGET
        ')
        [ "$actual" = "$expected" ] || exit 1
