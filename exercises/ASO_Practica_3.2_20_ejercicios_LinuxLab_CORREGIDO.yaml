- id: p32-e03-comprobar-si-un-servicio-esta-activo
  title: 03. Comprobar si un servicio está activo
  description: |
    Recibe SERVICIO, limitado a `httpd`, `sshd` o `cron`. Consulta `systemctl is-active`. Si está activo imprime `ACTIVO`; si está inactivo imprime `INACTIVO`. Ambos son resultados correctos, exit 0. Otros nombres son error.

    ### Comandos a practicar
    - **Comandos:** `systemctl is-active`.
    - **Bash y conceptos:** `if/else`, códigos de salida de systemctl.

    ### Script a entregar
    - **Ruta:** `/home/learner/lab/aso-servicios/scripts/p32-e03-comprobar-si-un-servicio-esta-activo.sh`.
    - **Uso:** `p32-e03-comprobar-si-un-servicio-esta-activo.sh SERVICIO`.
    - Debe comenzar con `#!/bin/bash` y tener permiso de ejecución.

    ### Entradas, salidas y errores
    - **Salida correcta:** stdout según el enunciado, stderr vacío, código 0.
    - **Errores:** stdout vacío; el mensaje se imprime en stderr, con salto de línea.
      - **Código 1:** `Uso: SERVICIO`.
      - **Código 2:** `Servicio no valido`.

    ### Ejemplo de invocación
    ```bash
    /home/learner/lab/aso-servicios/scripts/p32-e03-comprobar-si-un-servicio-esta-activo.sh httpd
    ```
  tips: []
  tasks:
  - id: funcionamiento
    description: Comprueba casos de éxito y resultados.
    points: 14
    checks:
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        mkdir -p "$td/estado"
        cp -a /home/learner/lab/aso-servicios/estado-base/. "$td/estado/" || exit 1
        export ASO_SYSTEMD_STATE_DIR="$td/estado"
        export PATH=/home/learner/lab/aso-servicios/bin:"$PATH"
        [ -x /home/learner/lab/aso-servicios/scripts/p32-e03-comprobar-si-un-servicio-esta-activo.sh ] || exit 1
        set +e
        /home/learner/lab/aso-servicios/scripts/p32-e03-comprobar-si-un-servicio-esta-activo.sh httpd </dev/null >"$td/out" 2>"$td/err"
        rc=$?
        [ "$rc" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s 'INACTIVO
        ')
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        exit 0
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        mkdir -p "$td/estado"
        cp -a /home/learner/lab/aso-servicios/estado-base/. "$td/estado/" || exit 1
        export ASO_SYSTEMD_STATE_DIR="$td/estado"
        export PATH=/home/learner/lab/aso-servicios/bin:"$PATH"
        [ -x /home/learner/lab/aso-servicios/scripts/p32-e03-comprobar-si-un-servicio-esta-activo.sh ] || exit 1
        set +e
        /home/learner/lab/aso-servicios/scripts/p32-e03-comprobar-si-un-servicio-esta-activo.sh sshd </dev/null >"$td/out" 2>"$td/err"
        rc=$?
        [ "$rc" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s 'ACTIVO
        ')
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        exit 0
    - type: command
      user: learner
