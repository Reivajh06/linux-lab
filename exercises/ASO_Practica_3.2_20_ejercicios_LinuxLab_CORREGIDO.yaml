schema_version: 1
id: aso-p32-20-ejercicios-bash-2026
version: '1.1'
title: 'ASO - Práctica 3.2: servicios, systemd y recursos (20 ejercicios)'
folder: ASO Prácticas · 20 ejercicios
description: |-
  Basado en la Práctica 3.2 de ULPGC (2026/2027). Comandos generales: `systemctl` (`get-default`, `set-default`, `is-active`, `is-enabled`, `start`, `stop`, `restart`, `reload`, `enable --now`, `list-units`, `list-unit-files`, `daemon-reload`, `show`, `set-property`, `revert`), `dnf list installed`, `curl`, `firewall-cmd`, `grep`, `cut`, `sort`, `printf`, `mkdir`, `cat` y `vi` para la edición manual. Conceptos: systemd, targets, unidades `.service`, `[Unit]`, `[Service]`, `[Install]`, drop-ins, dependencias, `Restart`, `RestartSec`, `ExecStart`, `CPUQuota`, `CPUWeight`, `MemoryMin`, `MemoryMax`, límites temporales/permanentes, stdout/stderr, funciones y validación Bash.

  Esta plataforma puede no ejecutar `systemd` como PID 1. Para realizar actividades seguras y **evaluables sin tocar servicios reales**, la preparación incluye simuladores de `systemctl`, `dnf`, `firewall-cmd` y `curl` en `/home/learner/lab/aso-servicios/bin`. **Antes de probar los scripts en la terminal**, ejecuta: `export PATH="/home/learner/lab/aso-servicios/bin:$PATH"`. No llames a los comandos por su ruta absoluta ni uses sudo en las simulaciones. Estado inicial en `/home/learner/lab/aso-servicios/estado-base`; los evaluadores crean una copia independiente del estado para cada caso. Los ejercicios 15-18 y 20 crean configuraciones locales en directorios temporales, nunca en `/etc/systemd` del contenedor.

  Las órdenes que modifican servicios, paquetes, firewall o cgroups se simulan. Los ficheros `.service` y `.conf` sí se crean de verdad en la carpeta de laboratorio. En una máquina Fedora con systemd real, las órdenes de clase funcionarían sobre servicios reales, con los privilegios adecuados.

  Cada ejercicio especifica qué comandos y qué conceptos Bash practicar. Escribe tú los scripts; el entorno solo prepara datos y herramientas simuladas. Las tareas de evaluación usan `tasks` y comandos de comprobación de sintaxis compatible con el importador. En todos los casos separa stdout y stderr, y usa los códigos de salida indicados.
setup:
- script: |
    install -d -o learner -g learner /home/learner/lab/aso-servicios
    install -d -o learner -g learner /home/learner/lab/aso-servicios/scripts
    install -d -o learner -g learner /home/learner/lab/aso-servicios/bin
    install -d -o learner -g learner /home/learner/lab/aso-servicios/estado-base
    install -d -o learner -g learner /home/learner/lab/aso-servicios/datos
    printf '%s\n' '#!/bin/bash' 'set -u' 's=${ASO_SYSTEMD_STATE_DIR:-/home/learner/lab/aso-servicios/estado-base}' 'cmd=${1:-}; (($#>0)) && shift' 'log(){ printf '"'"'%s\n'"'"' "$*" >> "$s/acciones.log"; }' 'svc(){ case "$1" in httpd|sshd|cron|httpd.service|sshd.service|cron.service) service=${1%.service};; *) return 1;; esac; }' 'case "$cmd" in' ' get-default) (($#==0)) || exit 2; cat "$s/default-target";;' ' set-default) (($#==1)) || exit 2; case "$1" in graphical.target|multi-user.target) printf '"'"'%s\n'"'"' "$1" > "$s/default-target"; log set-default "$1";; *) exit 2;; esac;;' ' is-active|is-enabled)' '   (($#==1)) && svc "$1" || exit 4' '   case "$cmd" in is-active) value=$(cat "$s/$service.active");; is-enabled) value=$(cat "$s/$service.enabled");; esac' '   printf '"'"'%s\n'"'"' "$value"' '   [[ "$value" == active || "$value" == enabled ]] || exit 3' '   ;;' ' start|stop|restart|reload|enable|disable)' '   if [[ "$cmd" == enable && ${1:-} == --now ]]; then' '     shift' '     (($#==1)) && svc "$1" || exit 4' '     printf '"'"'enabled\n'"'"' > "$s/$service.enabled"' '     printf '"'"'active\n'"'"' > "$s/$service.active"' '     log '"'"'enable --now'"'"' "$service"' '     exit 0' '   fi' '   (($#==1)) && svc "$1" || exit 4' '   log "$cmd" "$service"' '   case "$cmd" in' '     start|restart) printf '"'"'active\n'"'"' > "$s/$service.active";;' '     stop) printf '"'"'inactive\n'"'"' > "$s/$service.active";;' '     enable) printf '"'"'enabled\n'"'"' > "$s/$service.enabled";;' '     disable) printf '"'"'disabled\n'"'"' > "$s/$service.enabled";;' '     reload) [[ "$(cat "$s/$service.active")" == active ]] || exit 3;;' '   esac' '   ;;' ' list-units)' '   [[ " $* " == *'"'"' --type=service '"'"'* ]] || exit 2' '   for service in cron httpd sshd; do' '     v=$(cat "$s/$service.active")' '     if [[ " $* " == *'"'"' --state=inactive '"'"'* && "$v" != inactive ]]; then continue; fi' '     if [[ " $* " == *'"'"' --state=active '"'"'* && "$v" != active ]]; then continue; fi' '     if [[ " $* " != *'"'"' --all '"'"'* && "$v" == inactive && " $* " != *'"'"' --state=inactive '"'"'* ]]; then continue; fi' '     printf '"'"'%s.service %s\n'"'"' "$service" "$v"' '   done' '   ;;' ' list-unit-files)' '   [[ " $* " == *'"'"' --type=service '"'"'* ]] || exit 2' '   for service in cron httpd sshd; do' '     v=$(cat "$s/$service.enabled")' '     if [[ " $* " == *'"'"' --state=enabled '"'"'* && "$v" != enabled ]]; then continue; fi' '     printf '"'"'%s.service %s\n'"'"' "$service" "$v"' '   done' '   ;;' ' daemon-reload) (($#==0)) || exit 2; log daemon-reload;;' ' set-property)' '   mode=permanent' '   if [[ ${1:-} == --runtime ]]; then mode=runtime; shift; fi' '   (($#>=2)) && svc "$1" || exit 4' '   shift' '   log set-property "$mode" "$service" "$@"' '   printf '"'"'%s\n'"'"' "$@" > "$s/$service.properties"' '   ;;' ' show)' '   (($#==1)) && svc "$1" || exit 4' '   if [[ -s "$s/$service.properties" ]]; then cat "$s/$service.properties"; fi' '   ;;' ' status)' '   (($#==1)) && svc "$1" || exit 4' '   printf '"'"'%s.service - simulated service\nActive: %s\n'"'"' "$service" "$(cat "$s/$service.active")"' '   ;;' ' revert)' '   (($#==1)) && svc "$1" || exit 4' '   rm -f "$s/$service.properties"' '   log revert "$service"' '   ;;' ' *) exit 2;;' esac > /home/learner/lab/aso-servicios/bin/systemctl
    chmod 0755 /home/learner/lab/aso-servicios/bin/systemctl
    printf '%s\n' '#!/bin/bash' 's=${ASO_SYSTEMD_STATE_DIR:-/home/learner/lab/aso-servicios/estado-base}' '[[ "$*" == '"'"'list installed httpd'"'"' ]] || exit 2' '[[ "$(cat "$s/httpd.installed")" == 1 ]] || exit 1' 'printf '"'"'Installed Packages\nhttpd.x86_64 2.4.0 mock\n'"'"'' > /home/learner/lab/aso-servicios/bin/dnf
    chmod 0755 /home/learner/lab/aso-servicios/bin/dnf
    printf '%s\n' '#!/bin/bash' 's=${ASO_SYSTEMD_STATE_DIR:-/home/learner/lab/aso-servicios/estado-base}' 'case "$*" in' ' '"'"'--list-services'"'"') cat "$s/firewall.current";;' ' '"'"'--add-service=http'"'"') printf '"'"'ssh http\n'"'"' > "$s/firewall.current"; printf '"'"'%s\n'"'"' '"'"'firewall --add-service=http'"'"' >> "$s/acciones.log";;' ' '"'"'--permanent --add-service=http'"'"') printf '"'"'ssh http\n'"'"' > "$s/firewall.permanent"; printf '"'"'%s\n'"'"' '"'"'firewall --permanent --add-service=http'"'"' >> "$s/acciones.log";;' ' '"'"'--reload'"'"') cp "$s/firewall.permanent" "$s/firewall.current"; printf '"'"'%s\n'"'"' '"'"'firewall --reload'"'"' >> "$s/acciones.log";;' ' *) exit 2;;' esac > /home/learner/lab/aso-servicios/bin/firewall-cmd
    chmod 0755 /home/learner/lab/aso-servicios/bin/firewall-cmd
    printf '%s\n' '#!/bin/bash' 's=${ASO_SYSTEMD_STATE_DIR:-/home/learner/lab/aso-servicios/estado-base}' '[[ "$*" == *localhost* ]] || exit 2' '[[ "$(cat "$s/httpd.active")" == active && "$(cat "$s/web_ok")" == 1 ]] || exit 7' 'printf '"'"'%s\n'"'"' '"'"'<html><body>Enhorabuena, tu configuracion es correcta.</body></html>'"'"'' > /home/learner/lab/aso-servicios/bin/curl
    chmod 0755 /home/learner/lab/aso-servicios/bin/curl
    printf '%s\n' multi-user.target > /home/learner/lab/aso-servicios/estado-base/default-target
    printf '%s\n' inactive > /home/learner/lab/aso-servicios/estado-base/httpd.active
    printf '%s\n' disabled > /home/learner/lab/aso-servicios/estado-base/httpd.enabled
    printf '%s\n' active > /home/learner/lab/aso-servicios/estado-base/sshd.active
    printf '%s\n' enabled > /home/learner/lab/aso-servicios/estado-base/sshd.enabled
    printf '%s\n' active > /home/learner/lab/aso-servicios/estado-base/cron.active
    printf '%s\n' enabled > /home/learner/lab/aso-servicios/estado-base/cron.enabled
    printf '%s\n' 1 > /home/learner/lab/aso-servicios/estado-base/httpd.installed
    printf '%s\n' ssh > /home/learner/lab/aso-servicios/estado-base/firewall.current
    printf '%s\n' ssh > /home/learner/lab/aso-servicios/estado-base/firewall.permanent
    printf '%s\n' 1 > /home/learner/lab/aso-servicios/estado-base/web_ok
    : > /home/learner/lab/aso-servicios/estado-base/acciones.log
    chown -R learner:learner /home/learner/lab/aso-servicios
exercises:
- id: p32-e01-consultar-el-target-por-defecto
  title: 01. Consultar el target por defecto
  description: |
    Sin argumentos, muestra exactamente el target configurado como predeterminado (`multi-user.target` al empezar). Debes consultar `systemctl get-default`, no deducirlo de un texto fijo.

    ### Comandos a practicar
    - **Comandos:** `systemctl get-default`.
    - **Bash y conceptos:** `$(...)`, `if` y salida estándar.

    ### Script a entregar
    - **Ruta:** `/home/learner/lab/aso-servicios/scripts/p32-e01-consultar-el-target-por-defecto.sh`.
    - **Uso:** `p32-e01-consultar-el-target-por-defecto.sh (sin argumentos)`.
    - Debe comenzar con `#!/bin/bash` y tener permiso de ejecución.

    ### Entradas, salidas y errores
    - **Salida correcta:** stdout según el enunciado, stderr vacío, código 0.
    - **Errores:** stdout vacío; el mensaje se imprime en stderr, con salto de línea.
      - **Código 1:** `Uso: (sin argumentos)`.

    ### Ejemplo de invocación
    ```bash
    /home/learner/lab/aso-servicios/scripts/p32-e01-consultar-el-target-por-defecto.sh
    ```
  tips: []
  tasks:
  - id: funcionamiento
    description: Comprueba casos de éxito y resultados.
    points: 14
    checks:
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        mkdir -p "$td/estado"
        cp -a /home/learner/lab/aso-servicios/estado-base/. "$td/estado/" || exit 1
        export ASO_SYSTEMD_STATE_DIR="$td/estado"
        export PATH=/home/learner/lab/aso-servicios/bin:"$PATH"
        [ -x /home/learner/lab/aso-servicios/scripts/p32-e01-consultar-el-target-por-defecto.sh ] || exit 1
        set +e
        /home/learner/lab/aso-servicios/scripts/p32-e01-consultar-el-target-por-defecto.sh </dev/null >"$td/out" 2>"$td/err"
        rc=$?
        [ "$rc" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s 'multi-user.target
        ')
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        exit 0
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        mkdir -p "$td/estado"
        cp -a /home/learner/lab/aso-servicios/estado-base/. "$td/estado/" || exit 1
        export ASO_SYSTEMD_STATE_DIR="$td/estado"
        export PATH=/home/learner/lab/aso-servicios/bin:"$PATH"
        printf "graphical.target\n" > "$td/estado/default-target"
        [ -x /home/learner/lab/aso-servicios/scripts/p32-e01-consultar-el-target-por-defecto.sh ] || exit 1
        set +e
        /home/learner/lab/aso-servicios/scripts/p32-e01-consultar-el-target-por-defecto.sh </dev/null >"$td/out" 2>"$td/err"
        rc=$?
        [ "$rc" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s 'graphical.target
        ')
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        exit 0
  - id: validaciones
    description: Comprueba argumentos, errores y códigos de salida.
    points: 6
    checks:
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        mkdir -p "$td/estado"
        cp -a /home/learner/lab/aso-servicios/estado-base/. "$td/estado/" || exit 1
        export ASO_SYSTEMD_STATE_DIR="$td/estado"
