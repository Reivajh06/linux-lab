- id: p22-e09-buscar-hogares
  title: 09. Seleccionar cuentas por directorio personal
  description: |
    Recibe una **ruta absoluta de directorio existente**. Lee `/home/learner/lab/aso-fundamentos/bash-21-22/datos/hogares.txt`, donde cada registro es `nombre:ruta-personal`, y muestra los nombres de usuarios cuyo directorio personal esté **dentro de** la ruta indicada (por ejemplo, `/home/ana` está dentro de `/home`). Muestra cada nombre en el orden de los datos y termina con `Total: N`.

    Si no hay ninguno, imprime `Ninguno` y `Total: 0`. Este ejercicio adapta la búsqueda de domicilios bajo un directorio de la práctica 2.2 y practica `read` con `IFS=:`. Comprueba cantidad, ruta absoluta y directorio existente, en ese orden.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `redirección <`.
    - **Bash / conceptos:** `while IFS=: read -r`, `[[ ... == ... ]]`, `(( ... ))`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p22-e09-buscar-hogares.sh`
    - **Uso:** `p22-e09-buscar-hogares.sh DIRECTORIO`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Exactamente una ruta de directorio.
    - La ruta debe comenzar por / y ser absoluta.
    - Debe existir el directorio.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Produce el resultado especificado y deja stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Uso: DIRECTORIO`.
    - **absoluta:** código `2`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Ruta no absoluta`.
    - **directorio:** código `3`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Directorio no valido`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p22-e09-buscar-hogares.sh /home
    ```
    Salida estándar esperada:
    ```text
    ana
    cora
    elena
    Total: 3
    ```
    Código de salida: `0`.
  tips:
