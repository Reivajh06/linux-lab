    - 1: `Uso: [MINIMO MAXIMO]` para cualquier cantidad distinta de 0 o 2.
    - 2: `Rango no valido` si uno de los valores no es entero sin signo.
    - 3: `Minimo mayor que maximo` si el intervalo está invertido.

