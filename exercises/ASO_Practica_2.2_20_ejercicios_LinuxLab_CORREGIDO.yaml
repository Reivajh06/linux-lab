- id: p22-e11-contar-lineas-con-read-desde-stdin
  title: 11. Contar líneas con read desde stdin
  description: |
    Sin argumentos, lee la entrada estándar línea a línea mediante `while IFS= read -r`. Cuenta todas las líneas completas (incluidas las vacías) y muestra `Total: N`. Para facilitar pruebas, el programa debe terminar al llegar a EOF.

    ### Comandos y conceptos a practicar
