- id: p22-e08-guardar-descriptores
  title: 08. Leer por el descriptor 3 y guardar por el 4
  description: |
    Recibe `FICHERO NOMBRE`, con NOMBRE de **3 a 12** letras minúsculas. Lee las líneas de FICHERO y escribe en `/home/learner/lab/aso-fundamentos/bash-21-22/salidas/NOMBRE.txt` los registros numerados como `Registro 1: texto`, `Registro 2: texto`, ... y al final `Total: N`.

    El fichero de salida debe **sobrescribirse**, no añadirse. El script muestra únicamente `Guardado` en stdout. Practica los descriptores de la práctica 2.2: `exec 3<"$fichero"`, `read -u3`, `exec 4>"$salida"`, `>&4`, y el cierre de descriptores. Valida los argumentos antes de abrir el fichero de salida.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `redirección >`.
    - **Bash / conceptos:** `exec 3<`, `exec 4>`, `read -u3`, `>&4`, `while`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p22-e08-guardar-descriptores.sh`
    - **Uso:** `p22-e08-guardar-descriptores.sh FICHERO NOMBRE`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Exactamente dos argumentos.
    - FICHERO debe ser regular.
    - NOMBRE tiene de 3 a 12 letras minúsculas.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Produce el resultado especificado y deja stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Uso: FICHERO NOMBRE`.
    - **fichero:** código `2`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Fichero no valido`.
    - **nombre:** código `3`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Nombre invalido`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p22-e08-guardar-descriptores.sh /home/learner/lab/aso-fundamentos/bash-21-22/datos/lineas.txt informe
    ```
    Salida estándar esperada:
    ```text
    Guardado
    ```
    Código de salida: `0`.
  tips:
  - '`>` vacía el contenido previo si el fichero ya existía.'
  - Cierra `3` y `4` después de terminar de leer y escribir.
