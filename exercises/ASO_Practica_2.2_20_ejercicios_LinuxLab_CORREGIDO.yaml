- id: p22-e04-contar-archivos
  title: 04. Contar líneas en varios ficheros con for y $@
  description: |
    Recibe **uno o más nombres de fichero**. Recorre `"$@"` con `for`. Por cada fichero regular muestra `RUTA: NUMERO`, donde NUMERO es el número de líneas. Soporta rutas con espacios.

    Si hay algún argumento que no sea fichero regular, escribe `Fichero omitido: RUTA` en stderr, continúa con los demás y finaliza con código 2 (si no hay errores, con 0). La falta de argumentos termina con código 1. Prueba `/home/learner/lab/aso-fundamentos/bash-21-22/datos/lineas.txt`, `/home/learner/lab/aso-fundamentos/bash-21-22/datos/notas cortas.txt` y `/home/learner/lab/aso-fundamentos/bash-21-22/datos/vacio.txt`. Es la práctica de `"$@"` y `continue` de la 2.2.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `wc -l`.
    - **Bash / conceptos:** `for`, `"$@"`, `continue`, `stderr`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p22-e04-contar-archivos.sh`
    - **Uso:** `p22-e04-contar-archivos.sh FICHEROS...`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Al menos un argumento.
    - Cuando hay rutas no regulares, se omiten y se informa en stderr.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Produce el resultado especificado y deja stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Uso: FICHEROS...`.
    - **omitido:** código `2`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Fichero omitido`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p22-e04-contar-archivos.sh /home/learner/lab/aso-fundamentos/bash-21-22/datos/lineas.txt '/home/learner/lab/aso-fundamentos/bash-21-22/datos/notas cortas.txt'
    ```
    Salida estándar esperada:
    ```text
    /home/learner/lab/aso-fundamentos/bash-21-22/datos/lineas.txt: 6
    /home/learner/lab/aso-fundamentos/bash-21-22/datos/notas cortas.txt: 2
    ```
    Código de salida: `0`.
  tips:
  - Usa `for fichero in "$@"` y entrecomilla las rutas.
  - Para mostrar solo el número sin el nombre usa `wc -l < "$fichero"`.
  sources: []
  supplemental: Datos ficticios preparados solo para practicar en Linux Lab; no se crea el script 
    del estudiante.
