- id: p22-e03-uid-gid-igual
  title: 03. Comparar UID y GID con opción -d
  description: |
    Recibe `FICHERO [-d]`. Recorre los registros con `read` e `IFS=:`. De forma predeterminada imprime los usuarios cuyo **UID es igual a su GID**; con `-d`, los usuarios con identificadores distintos. Por cada coincidencia imprime `nombre:uid:gid`, y finaliza con `Total: N`. Si no hay coincidencias, escribe `Ninguno` y luego `Total: 0`.

    Es una adaptación, sobre datos controlados, de la primera actividad de laboratorio de la práctica 2.2. Usa `/home/learner/lab/aso-fundamentos/bash-21-22/datos/registros.txt` y `/home/learner/lab/aso-fundamentos/bash-21-22/datos/registros-corto.txt`.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `redirección <`.
    - **Bash / conceptos:** `read`, `IFS=:`, `while`, `if`, `(( ... ))`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p22-e03-uid-gid-igual.sh`
    - **Uso:** `p22-e03-uid-gid-igual.sh FICHERO [-d]`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Se admiten uno o dos argumentos.
    - Si se indica una opción, debe ser exactamente -d.
    - La primera ruta debe ser un fichero regular.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Produce el resultado especificado y deja stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Uso: FICHERO [-d]`.
    - **opcion:** código `2`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Opcion invalida`.
    - **fichero:** código `3`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Fichero no valido`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p22-e03-uid-gid-igual.sh /home/learner/lab/aso-fundamentos/bash-21-22/datos/registros.txt
    ```
    Salida estándar esperada:
    ```text
    ana:1100:1100
    cora:1102:1102
    elena:1104:1104
    Total: 3
    ```
    Código de salida: `0`.
  tips:
  - Usa `if` y comparaciones numéricas `((uid == gid))`.
  - El contador final debe permanecer disponible después del bucle.
  sources: []
  supplemental: Datos ficticios preparados solo para practicar en Linux Lab; no se crea el script 
    del estudiante.
  tasks:
  - id: comparacion
    description: Muestra coincidencias e invierte el filtro.
    points: 12
    checks:
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
