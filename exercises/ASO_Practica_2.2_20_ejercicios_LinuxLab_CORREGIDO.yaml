- id: p22-e07-intercalar-ficheros
  title: 07. Entrelazar las líneas de dos ficheros
  description: |
    Recibe `FICHERO1 FICHERO2`. Muestra la primera línea del primero, luego la primera del segundo, después la segunda del primero, la segunda del segundo, etc. Si un fichero termina antes, continúa con las líneas que queden del otro. No añadas etiquetas ni líneas vacías.

    Corresponde al ejercicio autónomo de la práctica 2.2. Puedes usar dos descriptores con `exec 3< ...`, `exec 4< ...` y `read -u3` / `read -u4`, o una solución equivalente con herramientas básicas. Prueba `/home/learner/lab/aso-fundamentos/bash-21-22/datos/lista-a.txt`, `/home/learner/lab/aso-fundamentos/bash-21-22/datos/lista-b.txt` y `/home/learner/lab/aso-fundamentos/bash-21-22/datos/vacio.txt`.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `redirección <`.
    - **Bash / conceptos:** `exec 3<`, `exec 4<`, `read -u3`, `read -u4`, `while`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p22-e07-intercalar-ficheros.sh`
    - **Uso:** `p22-e07-intercalar-ficheros.sh FICHERO1 FICHERO2`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Se necesitan exactamente dos ficheros.
    - Los dos argumentos deben ser ficheros regulares.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Produce el resultado especificado y deja stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Uso: FICHERO1 FICHERO2`.
    - **fichero:** código `2`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Ficheros no validos`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p22-e07-intercalar-ficheros.sh /home/learner/lab/aso-fundamentos/bash-21-22/datos/lista-a.txt /home/learner/lab/aso-fundamentos/bash-21-22/datos/lista-b.txt
    ```
    Salida estándar esperada:
    ```text
    A1
    B1
    A2
    B2
    A3
    A4
    ```
    Código de salida: `0`.
  tips:
  - Al terminar uno, sigue leyendo el otro hasta EOF.
  - Piensa en el caso de uno de los ficheros vacío.
