- id: p22-e10-diferencias-carpetas
  title: 10. Ficheros exclusivos de dos directorios
  description: |
    Recibe dos directorios distintos. Muestra las **rutas absolutas** de los ficheros regulares que están directamente en uno de ellos y cuyo nombre **no existe como fichero regular** en el otro. Ordena alfabéticamente todas las rutas de salida, sin repetirlas. No desciendas por subdirectorios ni incluyas entradas ocultas.

    Es una adaptación de la comparación de directorios de la práctica 2.2. Usa comodines, bucles `for`, `[[ -f ... ]]`, `sort` y, si lo necesitas, `basename`. Los directorios de ejemplo están en `/home/learner/lab/aso-fundamentos/bash-21-22/carpetas/a`, `/home/learner/lab/aso-fundamentos/bash-21-22/carpetas/b` y `/home/learner/lab/aso-fundamentos/bash-21-22/carpetas/c`.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `comodín *`, `sort`, `basename`.
    - **Bash / conceptos:** `for`, `[[ -f ... ]]`, `if`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p22-e10-diferencias-carpetas.sh`
    - **Uso:** `p22-e10-diferencias-carpetas.sh DIRECTORIO1 DIRECTORIO2`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Exactamente dos directorios.
    - Los dos argumentos son directorios existentes.
    - Los directorios no pueden ser la misma ruta.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Produce el resultado especificado y deja stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Uso: DIRECTORIO1 DIRECTORIO2`.
    - **directorio:** código `2`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Directorio no valido`.
    - **iguales:** código `3`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Directorios iguales`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p22-e10-diferencias-carpetas.sh /home/learner/lab/aso-fundamentos/bash-21-22/carpetas/a /home/learner/lab/aso-fundamentos/bash-21-22/carpetas/b
    ```
    Salida estándar esperada:
    ```text
    /home/learner/lab/aso-fundamentos/bash-21-22/carpetas/a/notas clase.txt
    /home/learner/lab/aso-fundamentos/bash-21-22/carpetas/a/uno.txt
    /home/learner/lab/aso-fundamentos/bash-21-22/carpetas/b/dos.txt
    ```
    Código de salida: `0`.
  tips:
  - '`"$directorio"/*` permite iterar entradas directas, no descendientes.'
  - No intentes procesar una coincidencia del comodín si no existe un fichero.
  sources: []
  supplemental: Datos ficticios preparados solo para practicar en Linux Lab; no se crea el script 
    del estudiante.
