exercises:
- id: p22-e01-leer-registros
  title: 01. Recorrer passwd con read e IFS
  description: |
    Lee un fichero de texto con el formato de `/etc/passwd`, indicado como único argumento. Por cada registro imprime `nombre:uid:gid` (campos 1, 3 y 4, separados por `:`) y, al final, `Total: N`. Si el fichero está vacío, imprime solo `Total: 0`.

    En esta actividad se quiere practicar el bucle `while IFS=: read nombre clave uid gid ...; do ... done < FICHERO`, como en la práctica 2.2. No es necesario instalar ni modificar usuarios. Archivos de prueba: `/home/learner/lab/aso-fundamentos/bash-21-22/datos/registros.txt` y `/home/learner/lab/aso-fundamentos/bash-21-22/datos/vacio.txt`.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `redirección <`.
    - **Bash / conceptos:** `while IFS=: read -r`, `(( ... ))`, `variables`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p22-e01-leer-registros.sh`
    - **Uso:** `p22-e01-leer-registros.sh FICHERO`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Exactamente una ruta de fichero.
    - Debe existir un fichero regular.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Produce el resultado especificado y deja stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Uso: FICHERO`.
    - **fichero:** código `2`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Fichero no valido`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p22-e01-leer-registros.sh /home/learner/lab/aso-fundamentos/bash-21-22/datos/registros.txt
    ```
    Salida estándar esperada:
    ```text
    ana:1100:1100
    beto:1101:2100
    cora:1102:1102
    dani:1103:2100
    elena:1104:1104
    fede:1110:2110
    Total: 6
    ```
    Código de salida: `0`.
  tips:
  - Redirige el fichero al `while` completo para conservar el contador en el shell principal.
  - '`IFS=:` separa campos por los dos puntos.'
  sources: []
  supplemental: Datos ficticios preparados solo para practicar en Linux Lab; no se crea el script 
    del estudiante.
  tasks:
  - id: lectura
    description: Lee registros, cuenta elementos y soporta fichero vacío.
    points: 14
    checks:
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set +e
        /home/learner/lab/aso-fundamentos/scripts/p22-e01-leer-registros.sh /home/learner/lab/aso-fundamentos/bash-21-22/datos/registros.txt </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s 'ana:1100:1100
        beto:1101:2100
        cora:1102:1102
        dani:1103:2100
        elena:1104:1104
        fede:1110:2110
        Total: 6
        ')
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        exit 0
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set +e
        /home/learner/lab/aso-fundamentos/scripts/p22-e01-leer-registros.sh /home/learner/lab/aso-fundamentos/bash-21-22/datos/registros-corto.txt </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s 'lola:1201:1201
        paco:1202:1400
        Total: 2
        ')
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        exit 0
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set +e
        /home/learner/lab/aso-fundamentos/scripts/p22-e01-leer-registros.sh /home/learner/lab/aso-fundamentos/bash-21-22/datos/vacio.txt </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 0 ] || exit 1
        actual=$(cat "$td/out")
        expected=$(printf %s 'Total: 0
        ')
        [ "$actual" = "$expected" ] || exit 1
        [ ! -s "$td/err" ] || exit 1
        exit 0
  - id: errores
    description: Comprueba número de argumentos y existencia.
    points: 6
    checks:
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set +e
        /home/learner/lab/aso-fundamentos/scripts/p22-e01-leer-registros.sh </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 1 ] || exit 1
        [ ! -s "$td/out" ] || exit 1
        actual=$(cat "$td/err")
        expected=$(printf %s 'Uso: FICHERO')
        [ "$actual" = "$expected" ] || exit 1
        exit 0
    - type: command
      user: learner
      timeout: 15
      script: |
        td=$(mktemp -d) || exit 1
        trap 'rm -rf "$td"' EXIT
        set +e
        /home/learner/lab/aso-fundamentos/scripts/p22-e01-leer-registros.sh /home/learner/lab/aso-fundamentos/bash-21-22/datos </dev/null >"$td/out" 2>"$td/err"
        status=$?
        [ "$status" -eq 2 ] || exit 1
        [ ! -s "$td/out" ] || exit 1
        actual=$(cat "$td/err")
        expected=$(printf %s 'Fichero no valido')
        [ "$actual" = "$expected" ] || exit 1
        exit 0
- id: p22-e02-vector-campos
  title: 02. Elegir un campo de cada registro con un vector
  description: |
    Recibe `FICHERO CAMPO` y muestra el campo elegido (de **1 a 7**) de cada registro tipo passwd, anteponiendo `Registro N: ` con un número N creciente desde 1. Ejemplo: `Registro 1: ana`.

    Practica `while IFS=: read -a vector`, el acceso con `${vector[indice]}` y que los vectores comienzan en 0. Usa `/home/learner/lab/aso-fundamentos/bash-21-22/datos/registros.txt` o `/home/learner/lab/aso-fundamentos/bash-21-22/datos/registros-corto.txt`. Valida en este orden la cantidad, el fichero, el formato de CAMPO y el rango.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `redirección <`.
    - **Bash / conceptos:** `read -a`, `IFS=:`, `${vector[indice]}`, `while`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p22-e02-vector-campos.sh`
    - **Uso:** `p22-e02-vector-campos.sh FICHERO CAMPO`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Exactamente dos argumentos.
    - FICHERO debe ser regular.
    - CAMPO debe ser numérico.
    - CAMPO debe estar entre 1 y 7.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Produce el resultado especificado y deja stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Uso: FICHERO CAMPO`.
    - **fichero:** código `2`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Fichero no valido`.
    - **numero:** código `3`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Campo no numerico`.
    - **rango:** código `4`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Campo fuera de rango`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p22-e02-vector-campos.sh /home/learner/lab/aso-fundamentos/bash-21-22/datos/registros.txt 1
    ```
    Salida estándar esperada:
    ```text
    Registro 1: ana
    Registro 2: beto
    Registro 3: cora
    Registro 4: dani
    Registro 5: elena
    Registro 6: fede
    ```
    Código de salida: `0`.
  tips:
  - El campo 1 se encuentra en el índice 0 del vector.
  - No pierdas el contador introduciendo el while en una tubería.
  sources: []
  supplemental: Datos ficticios preparados solo para practicar en Linux Lab; no se crea el script 
    del estudiante.
  tasks:
