    - **Uso:** `p22-e19-seleccionar-una-linea-por-numero-usando-rea.sh FICHERO N`
    - Empieza con `#!/bin/bash`, guarda el script tú mismo y hazlo ejecutable (`chmod +x`).

    ### Validaciones y resultados
    - 0: imprime solo la línea N si existe.
    - 1: `Uso: FICHERO N`.
    - 2: `Numero no valido` si N no es entero decimal positivo.
    - 3: `Fichero no valido`.

    ### Ejemplo
    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p22-e19-seleccionar-una-linea-por-numero-usando-rea.sh /home/learner/lab/aso-fundamentos/bash-21-22/datos/lineas.txt 2
