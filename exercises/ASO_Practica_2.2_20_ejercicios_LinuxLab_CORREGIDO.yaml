- id: p22-e19-seleccionar-una-linea-por-numero-usando-rea
  title: 19. Seleccionar una línea por número usando read
  description: |
    Recibe FICHERO N. Recorre el fichero usando `while IFS= read -r` y muestra exclusivamente la línea número N (contando desde uno). Si N es mayor que el número de líneas, stdout estará vacío y el código será 0. Rechaza formatos no numéricos y cero.

    ### Comandos y conceptos a practicar
    - **Comandos:** `cat`, `head`, `tail` (para contrastar).
    - **Bash / conceptos:** `read -r`, `while`, `(( ))`, `break`.

