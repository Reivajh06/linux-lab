- id: p22-e20-filtrar-usuarios-por-rango-de-uid
  title: 20. Filtrar usuarios por rango de UID
  description: |
    Recibe cero o dos argumentos MINIMO MAXIMO. Lee `registros.txt` como `/etc/passwd`, muestra los **nombres** de usuarios cuyo UID esté incluido en el rango, preservando el orden del fichero, y termina con `Total: N`. Sin argumentos, lee `UID_MIN` y `UID_MAX` del fichero `login-valores.txt` preparado (imitación de `/etc/login.defs`). Es una adaptación directa del segundo ejercicio autónomo de 2.2.

    ### Comandos y conceptos a practicar
    - **Comandos:** `grep`, `cut`.
    - **Bash / conceptos:** `while IFS=: read`, `read`, `if`, `(( ))`, validación de `$#`.

    ### Entrega
