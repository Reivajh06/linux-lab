- id: p22-e06-lineas-pares-impares
  title: 06. Seleccionar líneas pares o impares con case
  description: |
    Recibe exactamente `OPCION FICHERO`. Con `-p` muestra las líneas de posición **par** (2, 4, 6...). Con `-i` muestra las líneas de posición **impar** (1, 3, 5...). Conserva el contenido y el orden de las líneas; para un fichero vacío no imprime nada.

    Usa `case` para elegir la opción y `while IFS= read -r linea` con un contador. Ejercicio basado en el apartado autónomo de la práctica 2.2. Prueba `/home/learner/lab/aso-fundamentos/bash-21-22/datos/lineas.txt`.

    ### Comandos y conceptos a practicar
    - **Comandos principales:** `redirección <`.
    - **Bash / conceptos:** `case`, `while IFS= read -r`, `((indice % 2))`.

    ### Script solicitado
    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p22-e06-lineas-pares-impares.sh`
    - **Uso:** `p22-e06-lineas-pares-impares.sh -p|-i FICHERO`
    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.

    ### Requisitos de entrada
    - Dos argumentos obligatorios.
    - El primer argumento debe ser -p o -i.
    - El segundo argumento debe ser fichero regular.

    ### Resultados y códigos de salida
    - **correcto:** código `0`, salida `stdout`. Produce el resultado especificado y deja stderr vacío.
    - **argumentos:** código `1`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Uso: -p|-i FICHERO`.
    - **opcion:** código `2`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Opcion invalida`.
    - **fichero:** código `3`, salida `stderr`. Imprime el mensaje indicado en stderr; no emite mensajes adicionales. Mensaje: `Fichero no valido`.

    ### Ejemplo de ejecución

    ```bash
    /home/learner/lab/aso-fundamentos/scripts/p22-e06-lineas-pares-impares.sh -i /home/learner/lab/aso-fundamentos/bash-21-22/datos/lineas.txt
    ```
    Salida estándar esperada:
    ```text
    uno
    tres
    cinco
    ```
    Código de salida: `0`.
  tips:
  - En una estructura `case`, las ramas terminan con `;;`.
  - El resto de dividir el número de línea entre 2 permite reconocer la paridad.
