- id: p21-e04-sumar-funcion
  title: '[2.1] Sumar con una función y sustitución de comandos'
  description: 'Recibe dos números enteros **no negativos de 0 a 9999**. Define una
    función Bash `sumar` que muestre la suma por stdout, utilízala y escribe `Resultado:
    SUMA` en una sola línea.


    Este ejercicio reproduce el razonamiento sobre `return` y los resultados de funciones
    de la práctica 2.1: no uses el código de retorno para guardar la suma, ya que
    puede superar 255. Usa `$(( ))` y, preferiblemente, `$(sumar ...)`.


    ### Comandos y conceptos a practicar

    - **Comandos principales:** `printf`, `echo`.

    - **Bash / conceptos:** `funciones`, `$(( ... ))`, `$(...)`, `return`.

    - **Ampliación opcional (no evaluada):** Si tienes Python instalado, comprueba
    **aparte** que `python3 -c "print(7+8)"` devuelve `15`. No lo uses para resolver
    el script Bash ni es necesario para aprobar.


    ### Script solicitado

    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p21-e04-sumar-funcion.sh`

    - **Uso:** `p21-e04-sumar-funcion.sh A B`

    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash`
    y hazlo ejecutable con `chmod +x`.


    ### Requisitos de entrada

    - Exactamente dos valores.

    - Ambos deben ser cadenas de dígitos.

    - Los valores deben estar entre 0 y 9999.


    ### Resultados y códigos de salida

    - **correcto:** código `0`, salida `stdout`. Produce el resultado especificado
    y deja stderr vacío.

    - **argumentos:** código `1`, salida `stderr`. Imprime el mensaje indicado en
    stderr; no emite mensajes adicionales. Mensaje: `Uso: A B`.

    - **numero:** código `2`, salida `stderr`. Imprime el mensaje indicado en stderr;
    no emite mensajes adicionales. Mensaje: `Argumentos no numericos`.

    - **rango:** código `3`, salida `stderr`. Imprime el mensaje indicado en stderr;
    no emite mensajes adicionales. Mensaje: `Valor fuera de rango`.


    ### Ejemplo de ejecución


    ```bash

    /home/learner/lab/aso-fundamentos/scripts/p21-e04-sumar-funcion.sh 250 10

    ```

    Salida estándar esperada:

    ```text

    Resultado: 260

    ```

    Código de salida: `0`.

