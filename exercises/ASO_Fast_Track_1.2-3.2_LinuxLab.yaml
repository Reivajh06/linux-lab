- id: p13-e11-crear-usuario
  title: '[1.3] Crear usuario y añadirlo a un grupo secundario'
  description: 'Script de administración (root). Recibe un nombre de usuario nuevo
    y el de un grupo existente. Si el usuario no existe, créalo con `useradd -m -U
    -s /bin/bash` (directorio personal y grupo privado propio), y después añádelo
    al grupo indicado como **secundario** usando `usermod -aG` o `gpasswd -a`. Muestra
    `Usuario creado: NOMBRE`.


    NOMBRE admite una letra inicial y después minúsculas, dígitos o `_`, con longitud
    total entre 1 y 20. No establezcas contraseñas ni modifiques cuentas existentes.
    Se han preparado los grupos `aso_taller_equipo` y `aso_taller_comun`.


    ### Comandos y conceptos a practicar

    - **Comandos principales:** `useradd -m -U -s`, `usermod -aG`, `id`.

    - **Bash / conceptos:** `if`, `[[ ... =~ ... ]]`, `exit`.


    ### Script solicitado

    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p13-e11-crear-usuario.sh`

    - **Uso:** `p13-e11-crear-usuario.sh USUARIO GRUPO`

    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash`
    y hazlo ejecutable con `chmod +x`.


    ### Requisitos de entrada

    - Exactamente dos argumentos.

    - Nombre de usuario válido, máximo 20 caracteres.

    - El grupo secundario debe existir.

    - El usuario no debe existir todavía.


    ### Resultados y códigos de salida

