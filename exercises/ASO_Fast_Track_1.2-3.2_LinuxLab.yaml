- id: p13-e04-chmod-octal
  title: '[1.3] Cambiar permisos con chmod octal'
  description: 'Recibe un modo octal de **tres dígitos** (por ejemplo `600`, `640`,
    `755`) y la ruta de un fichero regular. Asigna exactamente esos permisos usando
    `chmod`. Imprime `Permisos cambiados` cuando termina bien.


    Trabaja con `/home/learner/lab/aso-fundamentos/permisos/archivo-octal.txt`. Rechaza
    caracteres fuera de 0-7 y cualquier fichero inexistente.


    ### Comandos y conceptos a practicar

    - **Comandos principales:** `chmod`.

    - **Bash / conceptos:** `[[ ... =~ ... ]]`, `if`, `códigos de salida`.


    ### Script solicitado

    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p13-e04-chmod-octal.sh`

    - **Uso:** `p13-e04-chmod-octal.sh MODO FICHERO`

    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash`
    y hazlo ejecutable con `chmod +x`.


    ### Requisitos de entrada

    - Dos argumentos.

    - Modo compuesto exactamente por tres dígitos de 0 a 7.

    - Fichero regular existente.


    ### Resultados y códigos de salida

    - **correcto:** código `0`, salida `stdout`. Resultado indicado; stderr vacío.

    - **argumentos:** código `1`, salida `stderr`. Mensaje de error y stdout vacío.
    Mensaje: `Uso: MODO FICHERO`.

    - **modo:** código `2`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje:
    `Modo octal invalido`.

    - **no-fichero:** código `3`, salida `stderr`. Mensaje de error y stdout vacío.
    Mensaje: `Fichero no valido`.


    ### Ejemplo de ejecución


    ```bash

    /home/learner/lab/aso-fundamentos/scripts/p13-e04-chmod-octal.sh 600 /home/learner/lab/aso-fundamentos/permisos/archivo-octal.txt

    ```

    Salida estándar esperada:

    ```text

    Permisos cambiados

    ```

    Código de salida: `0`.

