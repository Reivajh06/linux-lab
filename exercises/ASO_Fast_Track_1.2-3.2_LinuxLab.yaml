- id: p12-e11-contar-repetidos
  title: '[1.2] Contar repeticiones con uniq -c'
  description: "Recibe un fichero con una palabra por línea. Muestra una línea por\
    \ palabra, ordenadas alfabéticamente, precedida por su frecuencia **en el formato\
    \ estándar de `uniq -c`** (incluidos sus espacios de alineación).\n\nPractica\
    \ `sort | uniq -c` con los ficheros de frutas y colores.\n\n### Comandos y conceptos\
    \ a practicar\n- **Comandos principales:** `sort`, `uniq -c`, `|`.\n- **Bash /\
    \ conceptos:** `if`, `[[ -f ... ]]`.\n\n### Script solicitado\n- **Ruta obligatoria:**\
    \ `/home/learner/lab/aso-fundamentos/scripts/p12-e11-contar-repetidos.sh`\n- **Uso:**\
    \ `p12-e11-contar-repetidos.sh FICHERO`\n- Crea tú el fichero (no lo proporciona\
    \ la preparación), empieza con `#!/bin/bash` y hazlo ejecutable con `chmod +x`.\n\
    \n### Requisitos de entrada\n- Exactamente un argumento.\n- El fichero debe ser\
    \ regular.\n\n### Resultados y códigos de salida\n- **correcto:** código `0`,\
    \ salida `stdout`. Resultado indicado; stderr vacío.\n- **argumentos:** código\
    \ `1`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje: `Se espera un\
    \ fichero`.\n- **no-fichero:** código `2`, salida `stderr`. Mensaje de error y\
    \ stdout vacío. Mensaje: `Fichero no valido`.\n\n### Ejemplo de ejecución\n\n\
    ```bash\n/home/learner/lab/aso-fundamentos/scripts/p12-e11-contar-repetidos.sh\
    \ /home/learner/lab/aso-fundamentos/datos/frutas.txt\n```\nSalida estándar esperada:\n\
    ```text\n      1 kiwi\n      2 manzana\n      3 pera\n      2 uva\n```\nCódigo\
    \ de salida: `0`.\n"
