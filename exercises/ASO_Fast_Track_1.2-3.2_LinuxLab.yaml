- id: p22-e05-contar-varios-shells
  title: '[2.2] Contar shells variables usando shift'
  description: 'Recibe **uno o más nombres de shell** (sin ruta), como `bash`, `sh`
    o `nologin`. Para cada argumento válido, en el orden recibido, escribe `NOMBRE:
    NUMERO` con el número de entradas de `/home/learner/lab/aso-fundamentos/bash-21-22/datos/registros.txt`
    cuyo último componente de shell coincide exactamente con ese nombre.


    Los nombres válidos tienen solo letras minúsculas. Si hay uno inválido, escribe
    `Shell invalido: VALOR` en stderr y continúa con los demás; el código final debe
    ser 2. Si todos son válidos, devuelve 0. Con cero argumentos, emite `Uso: SHELLS...`
    y código 1. Practica `while (( $# > 0 ))`, `$1`, `shift` y `case` o expresiones
    regulares de la práctica 2.2.


    ### Comandos y conceptos a practicar

    - **Comandos principales:** `cut -d: -f7`, `grep -c`, `|`.

    - **Bash / conceptos:** `while`, `$#`, `shift`, `case`.


    ### Script solicitado

    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p22-e05-contar-varios-shells.sh`

    - **Uso:** `p22-e05-contar-varios-shells.sh SHELLS...`

    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash`
    y hazlo ejecutable con `chmod +x`.


    ### Requisitos de entrada

    - Debes facilitar al menos un nombre de shell.

    - Los nombres con otros caracteres se omiten con un error.


    ### Resultados y códigos de salida

    - **correcto:** código `0`, salida `stdout`. Produce el resultado especificado
    y deja stderr vacío.

    - **argumentos:** código `1`, salida `stderr`. Imprime el mensaje indicado en
    stderr; no emite mensajes adicionales. Mensaje: `Uso: SHELLS...`.

    - **invalido:** código `2`, salida `stderr`. Imprime el mensaje indicado en stderr;
    no emite mensajes adicionales. Mensaje: `Shell invalido`.


    ### Ejemplo de ejecución


    ```bash

    /home/learner/lab/aso-fundamentos/scripts/p22-e05-contar-varios-shells.sh bash
    sh

    ```

    Salida estándar esperada:

    ```text

    bash: 3

    sh: 2

    ```

    Código de salida: `0`.

    '
  input_requirements: []
  output_requirements: []
  examples: []
  evaluations:
  - id: varios
    description: Maneja argumentos variables y valores repetidos.
    points: 12
    checks:
    - script: 'td=$(mktemp -d) || exit 1

        trap ''rm -rf "$td"'' EXIT

        set +e

        /home/learner/lab/aso-fundamentos/scripts/p22-e05-contar-varios-shells.sh
