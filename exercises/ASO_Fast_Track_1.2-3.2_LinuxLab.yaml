- id: p31-e16-localizar-procesos-con-pgrep
  title: '[3.1] Localizar procesos con pgrep'
  description: "Recibe un nombre de comando y muestra los PID, uno por línea y ordenados\
    \ numéricamente, que devuelva `pgrep -x` (nombre exacto). Si no hay coincidencias,\
    \ stdout vacío y código 0. Para practicar, prueba `pgrep -x bash` o `pgrep -x\
    \ sleep`.\n\n### Comandos a practicar\n- **Comandos:** `pgrep -x`, `sort -n`.\n\
    - **Bash y conceptos:** `if`, salida de comandos y manejo de coincidencia vacía.\n\
    \n### Script a entregar\n- **Ruta:** `/home/learner/lab/aso-procesos/scripts/p31-e16-localizar-procesos-con-pgrep.sh`.\n\
    - **Uso:** `p31-e16-localizar-procesos-con-pgrep.sh COMANDO`.\n- Debe comenzar\
    \ con `#!/bin/bash` y tener permiso de ejecución.\n\n### Entradas, salidas y errores\n\
    - **Salida correcta:** stdout según el enunciado, stderr vacío, código 0.\n- **Errores:**\
    \ stdout vacío; el mensaje se imprime en stderr, con salto de línea.\n  - **Código\
    \ 1:** `Uso: COMANDO`.\n\nPara evitar resultados cambiantes, la evaluación comprueba\
    \ el caso sin coincidencias y también una búsqueda de un proceso `sleep` creado\
    \ de forma aislada.\n\n### Ejemplo de invocación\n```bash\n/home/learner/lab/aso-procesos/scripts/p31-e16-localizar-procesos-con-pgrep.sh\
    \ proceso_que_no_existe_xxx\n```\n"
