        status=$?

        [ "$status" -eq 0 ] || exit 1

        actual=$(cat "$td/out")

        expected=$(printf %s ''bash: 3

        sh: 2

        '')

        [ "$actual" = "$expected" ] || exit 1

        [ ! -s "$td/err" ] || exit 1

        exit 0

        '
      user: learner
      timeout: 15
      type: command
      expected_exit: 0
    - script: 'td=$(mktemp -d) || exit 1

