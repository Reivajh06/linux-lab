schema_version: 1
id: aso-fast-track-12-32
version: '1.0'
title: ASO Fast Track · Prácticas 1.2 → 3.2
description: 'Fase de aprendizaje rápido que recorre las prácticas 1.2 a 3.2 de ASO
  con 4 ejercicios clave de cada una (24 en total), seleccionados de las colecciones
  de 20 ejercicios.


  - **1.2** Filtros y tuberías: `cut`, `sort`, `uniq -c`, `grep` con expresiones regulares.

  - **1.3** Permisos y cuentas: `chmod` octal y simbólico, `useradd`/`groupadd`, directorios
  compartidos con SGID.

  - **2.1** Scripts en Bash: `if`, funciones, sustitución de comandos, bucles `while`.

  - **2.2** Lectura y argumentos: `read` con `IFS`, vectores, `shift`, descriptores
  de fichero.

  - **3.1** Procesos: `ps`, ordenaciones por CPU, procesos hijos, `pgrep`.

  - **3.2** Servicios: `systemctl`, ficheros de unidad `.service` y drop-ins.


  Cada título indica entre corchetes la práctica de origen. Los datos de práctica
  se crean en `/home/learner/lab/` al iniciar el entorno. Cuando domines esta fase,
  continúa con las colecciones completas de cada práctica.'
folder: ASO Prácticas · 20 ejercicios
