- id: p12-e03-contar-shell
  title: '[1.2] Contar usuarios según su shell'
  description: 'Recibe un fichero con formato `/etc/passwd` y una ruta de shell (por
    ejemplo `/bin/bash`). Muestra únicamente cuántas cuentas tienen **exactamente**
    ese shell en el campo 7; imprime `0` si ninguna lo utiliza.


    Puedes separar el campo con `cut` y contar las coincidencias con `grep -Fxc`.


    ### Comandos y conceptos a practicar

    - **Comandos principales:** `cut -d: -f7`, `grep -Fxc`, `|`.

    - **Bash / conceptos:** `if`, `"$1"`, `"$2"`.


    ### Script solicitado

    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p12-e03-contar-shell.sh`

    - **Uso:** `p12-e03-contar-shell.sh FICHERO SHELL`

    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash`
    y hazlo ejecutable con `chmod +x`.


    ### Requisitos de entrada

    - Se esperan exactamente dos argumentos.

    - El primer argumento es un fichero regular.

    - La ruta del shell empieza por `/` y no está vacía.


    ### Resultados y códigos de salida

    - **correcto:** código `0`, salida `stdout`. Resultado indicado; stderr vacío.

    - **argumentos:** código `1`, salida `stderr`. Mensaje de error y stdout vacío.
    Mensaje: `Uso: FICHERO SHELL`.

    - **no-fichero:** código `2`, salida `stderr`. Mensaje de error y stdout vacío.
    Mensaje: `Fichero no valido`.

    - **shell:** código `3`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje:
