        set +e

        /home/learner/lab/aso-fundamentos/scripts/p22-e05-contar-varios-shells.sh
        nologin zsh </dev/null >"$td/out" 2>"$td/err"

        status=$?

        [ "$status" -eq 0 ] || exit 1

        actual=$(cat "$td/out")

        expected=$(printf %s ''nologin: 1

        zsh: 0

        '')

        [ "$actual" = "$expected" ] || exit 1

        [ ! -s "$td/err" ] || exit 1

        exit 0

        '
