- id: p12-e09-expresiones-regulares
  title: '[1.2] Buscar palabras con expresiones regulares'
  description: 'Recibe un fichero de palabras (una palabra por línea) y una de estas
    opciones:


    - `vocal`: palabras que empiezan por a, e, i, o, u.

    - `cinco`: palabras de exactamente cinco letras.

    - `sin-vocal`: palabras sin a, e, i, o, u.


    Solo hay palabras inglesas en minúsculas en el fichero de prueba. Muestra las
    palabras que cumplan el patrón **en el orden original**. Aplica expresiones regulares
    con `grep -E` y condicionales de Bash. Si ninguna palabra coincide, la salida
    será vacía y el código 0.


    ### Comandos y conceptos a practicar

    - **Comandos principales:** `grep -E`, `grep -vE`.

    - **Bash / conceptos:** `case`, `if`, `expresiones regulares`.


    ### Script solicitado

    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p12-e09-expresiones-regulares.sh`

    - **Uso:** `p12-e09-expresiones-regulares.sh FICHERO TIPO`

    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash`
    y hazlo ejecutable con `chmod +x`.


    ### Requisitos de entrada

    - Exactamente dos argumentos.

    - Fichero regular.

    - TIPO es vocal, cinco o sin-vocal.


    ### Resultados y códigos de salida

    - **correcto:** código `0`, salida `stdout`. Resultado indicado; stderr vacío.

    - **argumentos:** código `1`, salida `stderr`. Mensaje de error y stdout vacío.
    Mensaje: `Uso: FICHERO TIPO`.

    - **no-fichero:** código `2`, salida `stderr`. Mensaje de error y stdout vacío.
    Mensaje: `Fichero no valido`.

    - **tipo:** código `3`, salida `stderr`. Mensaje de error y stdout vacío. Mensaje:
    `Tipo desconocido`.


    ### Ejemplo de ejecución


    ```bash

    /home/learner/lab/aso-fundamentos/scripts/p12-e09-expresiones-regulares.sh /home/learner/lab/aso-fundamentos/datos/palabras.txt
    vocal

    ```

    Salida estándar esperada:

    ```text

    apple

    orange

    idea

    ash

    education

    action

    election

    ending

    aeiou

    ```

    Código de salida: `0`.

    '
