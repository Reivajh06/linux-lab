- id: p22-e02-vector-campos
  title: '[2.2] Elegir un campo de cada registro con un vector'
  description: 'Recibe `FICHERO CAMPO` y muestra el campo elegido (de **1 a 7**) de
    cada registro tipo passwd, anteponiendo `Registro N: ` con un número N creciente
    desde 1. Ejemplo: `Registro 1: ana`.


    Practica `while IFS=: read -a vector`, el acceso con `${vector[indice]}` y que
    los vectores comienzan en 0. Usa `/home/learner/lab/aso-fundamentos/bash-21-22/datos/registros.txt`
    o `/home/learner/lab/aso-fundamentos/bash-21-22/datos/registros-corto.txt`. Valida
    en este orden la cantidad, el fichero, el formato de CAMPO y el rango.


    ### Comandos y conceptos a practicar

    - **Comandos principales:** `redirección <`.

    - **Bash / conceptos:** `read -a`, `IFS=:`, `${vector[indice]}`, `while`.


    ### Script solicitado

    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p22-e02-vector-campos.sh`

    - **Uso:** `p22-e02-vector-campos.sh FICHERO CAMPO`

    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash`
    y hazlo ejecutable con `chmod +x`.


    ### Requisitos de entrada

    - Exactamente dos argumentos.

    - FICHERO debe ser regular.

    - CAMPO debe ser numérico.

    - CAMPO debe estar entre 1 y 7.


    ### Resultados y códigos de salida

    - **correcto:** código `0`, salida `stdout`. Produce el resultado especificado
    y deja stderr vacío.

    - **argumentos:** código `1`, salida `stderr`. Imprime el mensaje indicado en
    stderr; no emite mensajes adicionales. Mensaje: `Uso: FICHERO CAMPO`.

    - **fichero:** código `2`, salida `stderr`. Imprime el mensaje indicado en stderr;
    no emite mensajes adicionales. Mensaje: `Fichero no valido`.

    - **numero:** código `3`, salida `stderr`. Imprime el mensaje indicado en stderr;
    no emite mensajes adicionales. Mensaje: `Campo no numerico`.

    - **rango:** código `4`, salida `stderr`. Imprime el mensaje indicado en stderr;
    no emite mensajes adicionales. Mensaje: `Campo fuera de rango`.


    ### Ejemplo de ejecución


    ```bash

    /home/learner/lab/aso-fundamentos/scripts/p22-e02-vector-campos.sh /home/learner/lab/aso-fundamentos/bash-21-22/datos/registros.txt
    1

    ```

    Salida estándar esperada:

    ```text

    Registro 1: ana

