- id: p22-e01-leer-registros
  title: '[2.2] Recorrer passwd con read e IFS'
  description: 'Lee un fichero de texto con el formato de `/etc/passwd`, indicado
    como único argumento. Por cada registro imprime `nombre:uid:gid` (campos 1, 3
    y 4, separados por `:`) y, al final, `Total: N`. Si el fichero está vacío, imprime
    solo `Total: 0`.


    En esta actividad se quiere practicar el bucle `while IFS=: read nombre clave
    uid gid ...; do ... done < FICHERO`, como en la práctica 2.2. No es necesario
    instalar ni modificar usuarios. Archivos de prueba: `/home/learner/lab/aso-fundamentos/bash-21-22/datos/registros.txt`
    y `/home/learner/lab/aso-fundamentos/bash-21-22/datos/vacio.txt`.


    ### Comandos y conceptos a practicar

    - **Comandos principales:** `redirección <`.

    - **Bash / conceptos:** `while IFS=: read -r`, `(( ... ))`, `variables`.


    ### Script solicitado

    - **Ruta obligatoria:** `/home/learner/lab/aso-fundamentos/scripts/p22-e01-leer-registros.sh`

    - **Uso:** `p22-e01-leer-registros.sh FICHERO`

    - Crea tú el fichero (no lo proporciona la preparación), empieza con `#!/bin/bash`
    y hazlo ejecutable con `chmod +x`.


    ### Requisitos de entrada

    - Exactamente una ruta de fichero.

    - Debe existir un fichero regular.


    ### Resultados y códigos de salida

    - **correcto:** código `0`, salida `stdout`. Produce el resultado especificado
    y deja stderr vacío.

    - **argumentos:** código `1`, salida `stderr`. Imprime el mensaje indicado en
    stderr; no emite mensajes adicionales. Mensaje: `Uso: FICHERO`.

    - **fichero:** código `2`, salida `stderr`. Imprime el mensaje indicado en stderr;
    no emite mensajes adicionales. Mensaje: `Fichero no valido`.


    ### Ejemplo de ejecución


    ```bash

    /home/learner/lab/aso-fundamentos/scripts/p22-e01-leer-registros.sh /home/learner/lab/aso-fundamentos/bash-21-22/datos/registros.txt

