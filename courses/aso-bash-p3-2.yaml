    description: Mensaje en stderr; stdout vacío.
    exit_code: 5
    stream: stderr
    message: la unidad no tiene ExecStart
  - id: permiso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 6
    stream: stderr
    message: hay que ser root
  examples:
