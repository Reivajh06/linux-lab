    stdout: 'ExecStart=/usr/sbin/atd -f $OPTS -d

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p32/exec-debug.sh a
    stdout: ''
    stderr: 'uso: exec-debug.sh UNIDAD OPCION

      '
    exit_code: 1
  - command: /home/learner/aso/p32/exec-debug.sh no.service -d
    stdout: ''
    stderr: 'la unidad no existe

      '
    exit_code: 4
  - command: /home/learner/aso/p32/exec-debug.sh multi-user.target -d
    stdout: ''
    stderr: 'la unidad no tiene ExecStart

      '
    exit_code: 5
  - command: /home/learner/aso/p32/exec-debug.sh atd.service -d
    stdout: ''
    stderr: 'hay que ser root

      '
    exit_code: 6
  evaluations:
  - id: crea
    description: Escribe el vaciado y el comando nuevo.
    points: 6
    checks:
