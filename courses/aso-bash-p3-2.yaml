- id: limites
  title: Los cgroups de este contenedor
  description: 'Apartado 6. Los límites de este entorno son `cgroups` reales: Linux
    Lab los aplica al contenedor. Lee `memory.max`, `pids.max` y `cpu.max` de `/sys/fs/cgroup`
    y muestra:


    ```text

    memoria: 2048 MiB      (o sin límite)

    procesos: 256          (o sin límite)

    cpu: 200%              (o sin límite)

    ```


    **Comandos a practicar:** `/sys/fs/cgroup/memory.max`, `pids.max`, `cpu.max`


    **Estructuras de Bash:** `read cuota periodo < fichero`, función, `$(( ))`


    **Detalle importante:** Un valor `max` significa sin límite. `cpu.max` contiene
    `CUOTA PERIODO`: el porcentaje es `CUOTA*100/PERIODO`. Es lo que `CPUQuota=25%`
    o `MemoryMax=300M` configuran en un servicio.'
  script:
    path: /home/learner/aso/p32/limites.sh
    usage: limites.sh
  input_requirements:
  - description: No recibe argumentos.
    error: uso
  output_requirements:
  - id: correcto
    description: Las tres líneas.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
