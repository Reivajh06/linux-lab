- id: revertir
  title: Deshacer drop-ins
  description: 'Apartado 5.2. Elimina el drop-in `NOMBRE.conf` de una unidad o, sin
    nombre, todos sus `.conf`. Si el directorio queda vacío, lo elimina también. Muestra
    `eliminados: N`. Se evalúa como root.


    **Comandos a practicar:** `rm`, `rmdir`, `shopt -s nullglob`


    **Estructuras de Bash:** vector `f=("$dir"/*.conf)`, `${#f[@]}`, `(( ))`


    **Detalle importante:** Borrar un fichero solo cambia el disco: en un sistema
    real hay que ejecutar `systemctl daemon-reload`, y también reiniciar si afecta
    al comando de inicio.'
  script:
    path: /home/learner/aso/p32/revertir.sh
    usage: revertir.sh UNIDAD [NOMBRE]
  input_requirements:
  - description: Recibe una unidad y un nombre opcional.
    error: uso
  - description: Se ejecuta como root.
    error: permiso
  output_requirements:
