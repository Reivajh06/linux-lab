- id: actividad
  title: Actividad de laboratorio
  description: 'Apartado 7, puntos 3 a 5, aplicados a la unidad indicada (`httpd.service`
    en la máquina virtual; aquí, `atd.service`). Crea tres drop-ins en `/etc/systemd/system/UNIDAD.d/`:


    - `description.conf`: la descripción pasa a ser `My Apache HTTP Server`.

    - `restart-policy.conf`: se reinicia ante un fallo, 10 segundos después.

    - `memoria.conf`: mínimo garantizado de 1 GB y máximo de 2 GB.


    Termina mostrando `3 drop-ins en DIRECTORIO`. Se evalúa como root.


    **Comandos a practicar:** `Description=`, `Restart=on-failure`, `RestartSec=`,
    `MemoryMin=`, `MemoryMax=`, `man 5 systemd.resource-control`


    **Estructuras de Bash:** función `escribe()`, `printf ''%s\n''`


    **Detalle importante:** `Description` va en `[Unit]`; el resto, en `[Service]`.
    Un fichero por motivo permite deshacer cada cambio borrando solo ese fichero.'
  script:
    path: /home/learner/aso/p32/actividad.sh
    usage: actividad.sh UNIDAD
  input_requirements:
  - description: Recibe exactamente una unidad.
    error: uso
  - description: Se ejecuta como root.
    error: permiso
  - description: La unidad existe.
    error: unidad
  output_requirements:
  - id: correcto
    description: La línea de confirmación.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: actividad.sh UNIDAD'
  - id: permiso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 3
    stream: stderr
    message: hay que ser root
  - id: unidad
    description: Mensaje en stderr; stdout vacío.
    exit_code: 4
    stream: stderr
    message: la unidad no existe
  examples:
  - command: /home/learner/aso/p32/actividad.sh atd.service
    stdout: '3 drop-ins en /etc/systemd/system/atd.service.d

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p32/actividad.sh
    stdout: ''
    stderr: 'uso: actividad.sh UNIDAD

      '
    exit_code: 1
  - command: /home/learner/aso/p32/actividad.sh atd.service
    stdout: ''
    stderr: 'hay que ser root

      '
    exit_code: 3
  - command: /home/learner/aso/p32/actividad.sh no.service
    stdout: ''
    stderr: 'la unidad no existe

      '
    exit_code: 4
  evaluations:
  - id: ficheros
    description: Crea los tres drop-ins.
    points: 6
    checks:
    - type: run
      args:
      - atd.service
      cwd: /home/learner
      user: root
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 3 drop-ins en /etc/systemd/system/atd.service.d
      stderr:
        match: empty
      prepare: rm -rf /etc/systemd/system/atd.service.d
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - 'S=/home/learner/aso/p32/actividad.sh

        D=/home/learner/aso/p32

        [ "$(ls /etc/systemd/system/atd.service.d | wc -l)" = 3 ] && systemd-delta
        --no-pager --type=extended | grep -q /etc/systemd/system/atd.service.d/memoria.conf'
      cwd: /home/learner
      user: root
      timeout: 10
      requirement: correcto
  - id: descripcion
    description: Cambia la descripción.
    points: 6
    checks:
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - 'S=/home/learner/aso/p32/actividad.sh

        D=/home/learner/aso/p32

        grep -qx ''\[Unit\]'' /etc/systemd/system/atd.service.d/description.conf &&
        grep -qx ''Description=My Apache HTTP Server'' /etc/systemd/system/atd.service.d/description.conf'
      cwd: /home/learner
      user: root
      timeout: 10
      requirement: correcto
  - id: reinicio
    description: Política de reinicio.
    points: 6
    checks:
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - 'S=/home/learner/aso/p32/actividad.sh

        D=/home/learner/aso/p32

        grep -qx ''\[Service\]'' /etc/systemd/system/atd.service.d/restart-policy.conf
        && grep -qx ''Restart=on-failure'' /etc/systemd/system/atd.service.d/restart-policy.conf
        && grep -qx ''RestartSec=10'' /etc/systemd/system/atd.service.d/restart-policy.conf'
