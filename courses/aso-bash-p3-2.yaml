- id: exec-debug
  title: Sustituir ExecStart
  description: 'Apartado 5.2. Crea el drop-in `execstart-debug.conf` de una unidad
    para añadir una opción a su comando de inicio. Lee el `ExecStart` del fichero
    original y escribe:


    ```ini

    [Service]

    ExecStart=

    ExecStart=COMANDO-ORIGINAL OPCION

    ```


    Termina mostrando la nueva línea `ExecStart=...`. Se evalúa como root.


    **Comandos a practicar:** `grep ^ExecStart=`, `cut -d= -f2-`, `systemd-delta`


    **Estructuras de Bash:** agrupación con redirección, `printf`


    **Detalle importante:** `ExecStart` tiene una peculiaridad: para sustituirlo hay
    que **vaciarlo primero** con `ExecStart=`, o `systemd` lo tomaría como un segundo
    comando. Este cambio además exige `daemon-reload` y reiniciar el servicio.'
