schema_version: 1
id: aso-bash-p3-2
version: '1.0'
title: ASO Bash 3.2 · Servicios, drop-ins, vi y recursos
folder: ASO Bash
description: "Trabaja con los **ficheros de unidad reales** de Fedora en `/usr/lib/systemd/system`\
  \ y `/etc/systemd/system`, con `systemctl --root=/`, con ficheros *drop-in*, con\
  \ `vi` en modo no interactivo y con los límites `cgroup` que el contenedor tiene\
  \ aplicados.\n    Este contenedor no arranca `systemd` como PID 1, por lo que `systemctl\
  \ start/stop/status/show`, `systemd-run`, `systemd-cgls`, Apache y `firewall-cmd`\
  \ necesitan una máquina virtual: esa parte de la hoja no se evalúa aquí.\n    En\
  \ lugar de simular esos comandos, los ejercicios usan lo que sí es real: `list-unit-files`,\
  \ `is-enabled`, `enable`, `disable`, `get-default` y `systemd-delta`. Como `httpd`\
  \ no está instalado, los drop-ins se aplican a `atd.service`.\n\nCada ejercicio\
  \ es un **script de Bash** en `/home/learner/aso/p32/`: empieza por `#!/bin/bash`,\
  \ hazlo ejecutable con `chmod u+x`, envía los resultados a stdout y los errores\
  \ a stderr, y usa un código de salida distinto para cada error. Los ejercicios trabajan\
  \ con ficheros y procesos reales del sistema (`/etc/passwd`, `/etc/group`, `/proc`,\
  \ `/usr/share/dict/words`...): la salida esperada se calcula al evaluar, así que\
  \ no vale escribir el resultado a mano."
setup:
- script: 'set -e

    install -d -o learner -g learner /home/learner/aso/p32

    '
  user: root
  timeout: 60
exercises:
- id: targets
  title: Niveles de ejecución y target por defecto
  description: 'Apartado 1.1. Sin argumentos, muestra una línea `N TARGET` para cada
    nivel del 0 al 6, leyendo los enlaces reales `runlevelN.target`. Con `-d` muestra
    solo el target por defecto.


    **Comandos a practicar:** `readlink`, `systemctl get-default`


    **Estructuras de Bash:** `for n in {0..6}`, `case`


    **Detalle importante:** Los niveles 2, 3 y 4 apuntan al mismo `multi-user.target`:
    los números solo se conservan por compatibilidad.'
  script:
    path: /home/learner/aso/p32/targets.sh
    usage: targets.sh [-d]
  input_requirements:
  - description: Recibe como mucho la opción -d.
    error: uso
  output_requirements:
  - id: correcto
    description: La tabla, o el target por defecto.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: targets.sh [-d]'
  examples:
  - command: /home/learner/aso/p32/targets.sh
    stdout: '0 poweroff.target

      1 rescue.target

      2 multi-user.target

      3 multi-user.target

      4 multi-user.target

      5 graphical.target

      6 reboot.target

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p32/targets.sh -d
    stdout: 'graphical.target

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p32/targets.sh -x
    stdout: ''
    stderr: 'uso: targets.sh [-d]

      '
    exit_code: 1
  evaluations:
  - id: tabla
    description: Lee los enlaces.
    points: 6
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: '0 poweroff.target

          1 rescue.target

          2 multi-user.target

          3 multi-user.target

          4 multi-user.target

          5 graphical.target

          6 reboot.target'
      stderr:
        match: empty
  - id: defecto
    description: Lee el target por defecto.
    points: 6
    checks:
    - type: run
      args:
      - -d
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: systemctl get-default
      stderr:
        match: empty
      prepare: rm -rf /run/systemd/system
  - id: error-uso
    description: 'Rechaza la entrada: Recibe como mucho la opción -d.'
    points: 2
    checks:
    - type: run
      args:
      - -x
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: targets.sh [-d]'
    - type: run
      args:
      - -d
      - -d
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: targets.sh [-d]'
  tips: []
  setup: []
  sources: []
  supplemental: Se ejecuta contra los ficheros reales del sistema Fedora del laboratorio;
    la salida esperada se calcula en vivo al evaluar.
- id: ubicacion
  title: Qué fichero de unidad manda
  description: 'Apartado 1.2. Muestra la ruta del fichero de unidad que tiene prioridad,
    buscando en este orden: `/etc/systemd/system`, `/run/systemd/system` y `/usr/lib/systemd/system`.


    **Comandos a practicar:** `/etc/systemd/system`, `/run/systemd/system`, `/usr/lib/systemd/system`


    **Estructuras de Bash:** `for d in a b c`, `-e`, `exit` dentro del bucle


    **Detalle importante:** La configuración del administrador en `/etc` gana a la
    del tiempo de ejecución en `/run`, y esta a la de los paquetes en `/usr/lib`.
    Por eso los paquetes no pisan tus cambios al actualizarse. En este contenedor
    no dejes creado `/run/systemd/system`: su existencia hace creer a `systemctl`
    que `systemd` está en marcha.'
  script:
    path: /home/learner/aso/p32/ubicacion.sh
    usage: ubicacion.sh UNIDAD
  input_requirements:
  - description: Recibe exactamente una unidad.
    error: uso
  - description: La unidad existe en alguno de los directorios.
    error: unidad
  output_requirements:
  - id: correcto
    description: La ruta efectiva.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: ubicacion.sh UNIDAD'
  - id: unidad
    description: Mensaje en stderr; stdout vacío.
    exit_code: 4
    stream: stderr
    message: la unidad no existe
  examples:
  - command: /home/learner/aso/p32/ubicacion.sh atd.service
    stdout: '/usr/lib/systemd/system/atd.service

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p32/ubicacion.sh
    stdout: ''
    stderr: 'uso: ubicacion.sh UNIDAD

      '
    exit_code: 1
  - command: /home/learner/aso/p32/ubicacion.sh noexiste.service
    stdout: ''
    stderr: 'la unidad no existe

      '
    exit_code: 4
  evaluations:
  - id: prioridad
    description: Respeta el orden de prioridad.
    points: 6
    checks:
    - type: run
      args:
      - atd.service
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: /usr/lib/systemd/system/atd.service
      stderr:
        match: empty
      prepare: rm -f /etc/systemd/system/atd.service; rm -rf /run/systemd/system
    - type: run
      args:
      - atd.service
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: /run/systemd/system/atd.service
      stderr:
        match: empty
      prepare: rm -f /etc/systemd/system/atd.service; rm -rf /run/systemd/system;
        mkdir -p /run/systemd/system; cp /usr/lib/systemd/system/atd.service /run/systemd/system/
    - type: run
      args:
      - atd.service
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: /etc/systemd/system/atd.service
      stderr:
        match: empty
      prepare: rm -f /etc/systemd/system/atd.service; rm -rf /run/systemd/system;
        mkdir -p /run/systemd/system; cp /usr/lib/systemd/system/atd.service /run/systemd/system/;
        cp /usr/lib/systemd/system/atd.service /etc/systemd/system/
    - type: run
      args:
      - crond.service
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: /usr/lib/systemd/system/crond.service
      stderr:
        match: empty
      prepare: rm -f /etc/systemd/system/atd.service; rm -rf /run/systemd/system
  - id: error-uso
    description: 'Rechaza la entrada: Recibe exactamente una unidad.'
    points: 2
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: ubicacion.sh UNIDAD'
  - id: error-unidad
    description: 'Rechaza la entrada: La unidad existe en alguno de los directorios.'
    points: 2
    checks:
    - type: run
      args:
      - noexiste.service
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: unidad
      stderr:
        match: exact
        value: la unidad no existe
  tips: []
  setup: []
  sources: []
  supplemental: Se ejecuta contra los ficheros reales del sistema Fedora del laboratorio;
    la salida esperada se calcula en vivo al evaluar.
- id: propiedad
  title: Leer una propiedad de un fichero de unidad
  description: 'Apartado 5.1. Muestra el valor de una propiedad dentro de una sección
    de un fichero de `/usr/lib/systemd/system`. La misma clave en otra sección no
    cuenta. Si aparece varias veces en la sección, gana la última.


    **Comandos a practicar:** `/usr/lib/systemd/system/*.service`, `less`


    **Estructuras de Bash:** `while IFS= read -r linea`, `case "$linea" in`, una variable
    de estado `dentro`, `${linea#*=}`


    **Detalle importante:** Una línea `[Sección]` cambia de sección. El valor puede
    contener `=`: quita solo hasta el **primer** `=` con `${linea#*=}`.'
  script:
    path: /home/learner/aso/p32/propiedad.sh
    usage: propiedad.sh UNIDAD SECCION CLAVE
  input_requirements:
  - description: Recibe unidad, sección y clave.
    error: uso
  - description: La unidad existe.
    error: unidad
  - description: La clave existe en esa sección.
    error: clave
  output_requirements:
  - id: correcto
    description: El valor de la propiedad.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: propiedad.sh UNIDAD SECCION CLAVE'
  - id: unidad
    description: Mensaje en stderr; stdout vacío.
    exit_code: 4
    stream: stderr
    message: la unidad no existe
  - id: clave
    description: Mensaje en stderr; stdout vacío.
    exit_code: 5
    stream: stderr
    message: la propiedad no existe en esa sección
  examples:
  - command: /home/learner/aso/p32/propiedad.sh atd.service Service ExecStart
    stdout: '/usr/sbin/atd -f $OPTS

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p32/propiedad.sh a b
    stdout: ''
    stderr: 'uso: propiedad.sh UNIDAD SECCION CLAVE

      '
    exit_code: 1
  - command: /home/learner/aso/p32/propiedad.sh no.service Unit Description
    stdout: ''
    stderr: 'la unidad no existe

      '
    exit_code: 4
  - command: /home/learner/aso/p32/propiedad.sh atd.service Unit ExecStart
    stdout: ''
    stderr: 'la propiedad no existe en esa sección

      '
    exit_code: 5
  evaluations:
  - id: reales
    description: Lee unidades reales.
    points: 6
    checks:
    - type: run
      args:
      - atd.service
      - Unit
      - Description
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: awk -v s='[Unit]' -v k=Description '/^\[/{c=($0==s)} c && index($0,k"=")==1{v=substr($0,length(k)+2)}
          END{print v}' /usr/lib/systemd/system/atd.service
      stderr:
        match: empty
    - type: run
      args:
      - atd.service
      - Service
      - ExecStart
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: awk -v s='[Service]' -v k=ExecStart '/^\[/{c=($0==s)} c && index($0,k"=")==1{v=substr($0,length(k)+2)}
          END{print v}' /usr/lib/systemd/system/atd.service
      stderr:
        match: empty
    - type: run
      args:
      - atd.service
      - Install
      - WantedBy
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: awk -v s='[Install]' -v k=WantedBy '/^\[/{c=($0==s)} c && index($0,k"=")==1{v=substr($0,length(k)+2)}
          END{print v}' /usr/lib/systemd/system/atd.service
      stderr:
        match: empty
    - type: run
      args:
      - crond.service
      - Service
      - ExecStart
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: awk -v s='[Service]' -v k=ExecStart '/^\[/{c=($0==s)} c && index($0,k"=")==1{v=substr($0,length(k)+2)}
          END{print v}' /usr/lib/systemd/system/crond.service
      stderr:
        match: empty
  - id: error-uso
    description: 'Rechaza la entrada: Recibe unidad, sección y clave.'
    points: 2
    checks:
    - type: run
      args:
      - a
      - b
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: propiedad.sh UNIDAD SECCION CLAVE'
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: propiedad.sh UNIDAD SECCION CLAVE'
  - id: error-unidad
    description: 'Rechaza la entrada: La unidad existe.'
    points: 2
    checks:
    - type: run
      args:
      - no.service
      - Unit
      - Description
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: unidad
      stderr:
        match: exact
        value: la unidad no existe
  - id: error-clave
    description: 'Rechaza la entrada: La clave existe en esa sección.'
    points: 2
    checks:
    - type: run
      args:
      - atd.service
      - Unit
      - ExecStart
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: clave
      stderr:
        match: exact
        value: la propiedad no existe en esa sección
    - type: run
      args:
      - atd.service
      - Nada
      - Description
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: clave
      stderr:
        match: exact
        value: la propiedad no existe en esa sección
  tips: []
  setup: []
  sources: []
  supplemental: Se ejecuta contra los ficheros reales del sistema Fedora del laboratorio;
    la salida esperada se calcula en vivo al evaluar.
- id: servicios
  title: Servicios por estado
  description: 'Apartado 4. Lista solo el nombre de los ficheros de unidad de tipo
    servicio que están en el estado indicado: `enabled`, `disabled` o `static`.


    **Comandos a practicar:** `systemctl --root=/ list-unit-files --type=service --state=
    --no-legend --no-pager`, `cut` o `awk`


    **Estructuras de Bash:** `case`, tuberías


    **Detalle importante:** `--root=/` trabaja sobre los ficheros sin hablar con `systemd`,
    por eso funciona aquí. `--no-legend` quita cabecera y pie, y `--no-pager` evita
    el paginador.'
  script:
    path: /home/learner/aso/p32/servicios.sh
    usage: servicios.sh ESTADO
  input_requirements:
  - description: Recibe exactamente un estado.
    error: uso
  - description: El estado es enabled, disabled o static.
    error: estado
  output_requirements:
  - id: correcto
    description: Un nombre por línea.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: servicios.sh ESTADO'
  - id: estado
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: estado no válido
  examples:
  - command: /home/learner/aso/p32/servicios.sh enabled | head -n 3
    stdout: 'atd.service

      authselect-apply-changes.service

      crond.service

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p32/servicios.sh
    stdout: ''
    stderr: 'uso: servicios.sh ESTADO

      '
    exit_code: 1
  - command: /home/learner/aso/p32/servicios.sh activo
    stdout: ''
    stderr: 'estado no válido

      '
    exit_code: 2
  evaluations:
  - id: estados
    description: Lista cada estado.
    points: 6
    checks:
    - type: run
      args:
      - enabled
      cwd: /home/learner
      user: learner
      timeout: 30
      requirement: correcto
      stdout:
        match: lines
        from_command: systemctl --root=/ list-unit-files --type=service --state=enabled
          --no-legend --no-pager | awk '{print $1}'
      stderr:
        match: empty
    - type: run
      args:
      - disabled
      cwd: /home/learner
      user: learner
      timeout: 30
      requirement: correcto
      stdout:
        match: lines
        from_command: systemctl --root=/ list-unit-files --type=service --state=disabled
          --no-legend --no-pager | awk '{print $1}'
      stderr:
        match: empty
    - type: run
      args:
      - static
      cwd: /home/learner
      user: learner
      timeout: 30
      requirement: correcto
      stdout:
        match: lines
        from_command: systemctl --root=/ list-unit-files --type=service --state=static
          --no-legend --no-pager | awk '{print $1}'
      stderr:
        match: empty
  - id: error-uso
    description: 'Rechaza la entrada: Recibe exactamente un estado.'
    points: 2
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: servicios.sh ESTADO'
  - id: error-estado
    description: 'Rechaza la entrada: El estado es enabled, disabled o static.'
    points: 2
    checks:
    - type: run
      args:
      - activo
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: estado
      stderr:
        match: exact
        value: estado no válido
  tips: []
  setup: []
  sources: []
  supplemental: Se ejecuta contra los ficheros reales del sistema Fedora del laboratorio;
    la salida esperada se calcula en vivo al evaluar.
- id: wants
  title: Enlaces de los servicios habilitados
  description: 'Apartado 3.2. Habilitar crea un enlace en `/etc/systemd/system/TARGET.wants/`.
    Recorre esos directorios y muestra `TARGET: SERVICIO` por cada enlace a un `.service`,
    ordenado.


    **Comandos a practicar:** `ls`, `sort`


    **Estructuras de Bash:** `for d in /etc/systemd/system/*.wants`, `${d##*/}`, `${x%.wants}`,
    bucle anidado, `-L`


    **Detalle importante:** Quita ruta y sufijo con expansiones: `${d##*/}` elimina
    hasta la última barra y `${d%.wants}` elimina el final. Encadena `done | sort`.'
  script:
    path: /home/learner/aso/p32/wants.sh
    usage: wants.sh
  input_requirements:
  - description: No recibe argumentos.
    error: uso
  output_requirements:
  - id: correcto
    description: Una línea por enlace.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: wants.sh'
  examples:
  - command: /home/learner/aso/p32/wants.sh | head -n 3
    stdout: 'basic.target: rpmdb-rebuild.service

      factory-reset.target: systemd-tpm2-clear.service

      getty.target: getty@tty1.service

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p32/wants.sh x
    stdout: ''
    stderr: 'uso: wants.sh

      '
    exit_code: 1
  evaluations:
  - id: enlaces
    description: Coincide con los enlaces reales.
    points: 6
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: 'find /etc/systemd/system -mindepth 2 -maxdepth 2 -path ''*.wants/*.service''
          -printf ''%h: %f\n'' | sed ''s|^.*/||; s|\.wants: |: |'' | sort'
      stderr:
        match: empty
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: contains
        value: 'multi-user.target: atd.service'
      stderr:
        match: empty
  - id: error-uso
    description: 'Rechaza la entrada: No recibe argumentos.'
    points: 2
    checks:
    - type: run
      args:
      - x
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: wants.sh'
  tips: []
  setup: []
  sources: []
  supplemental: Se ejecuta contra los ficheros reales del sistema Fedora del laboratorio;
    la salida esperada se calcula en vivo al evaluar.
- id: conmuta
  title: Habilitar y deshabilitar
  description: 'Apartado 3.2. Habilita o deshabilita una unidad con `systemctl --root=/`
    sin mostrar los mensajes del comando, y muestra `UNIDAD: ESTADO` con el estado
    final de `is-enabled`. Se evalúa como root.


    **Comandos a practicar:** `systemctl --root=/ enable`, `disable`, `is-enabled`


    **Estructuras de Bash:** `case`, `$EUID`, `$(...)`


    **Detalle importante:** Activar y habilitar son operaciones distintas. `is-enabled`
    devuelve 1 si la unidad está deshabilitada, pero imprime igualmente el estado:
    captura la salida, no el código.'
  script:
    path: /home/learner/aso/p32/conmuta.sh
    usage: conmuta.sh enable|disable UNIDAD
  input_requirements:
  - description: Recibe acción y unidad.
    error: uso
  - description: La acción es enable o disable.
    error: accion
  - description: Se ejecuta como root.
    error: permiso
  - description: La unidad existe.
    error: unidad
  output_requirements:
  - id: correcto
    description: Una línea con el estado final.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: conmuta.sh enable|disable UNIDAD'
  - id: accion
