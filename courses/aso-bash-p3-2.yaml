    description: La línea con el recuento.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: revertir.sh UNIDAD [NOMBRE]'
  - id: permiso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 3
    stream: stderr
    message: hay que ser root
  examples:
