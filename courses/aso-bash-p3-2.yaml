- id: vi-sustituye
  title: Sustituir con vi desde un script
  description: 'Apartado 2.1. Aplica `:%s/ORIGEN/DESTINO/g` a un fichero usando `vi`
    en modo no interactivo, guarda y muestra `líneas con ORIGEN: N`, contando antes
    de editar. Si no hay coincidencias, el fichero no cambia y la cuenta es 0. `ORIGEN`
    y `DESTINO` son rutas o textos que pueden contener `/`.


    **Comandos a practicar:** `vi -es -c ''...'' -c x`, `:%s`, `grep -c`


    **Estructuras de Bash:** `#` como delimitador, sustitución de comandos


    **Detalle importante:** La `g` sustituye todas las apariciones de cada línea y
    el `%`, en todas las líneas. Cualquier carácter sirve de delimitador: `%s#/bin/#/sbin/#g`.
    El indicador `e` evita el error de `vi` cuando no hay coincidencias.'
