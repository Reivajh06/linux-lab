- id: demonios
  title: Servicios con nombre de demonio
  description: 'Apartado 1. Muchos demonios tienen un nombre terminado en `d`. Lista
    por orden alfabético los ficheros `.service` de `/usr/lib/systemd/system` cuyo
    nombre, sin la extensión, termina en `d`. Excluye las plantillas (`nombre@.service`).
    Con `-c` muestra solo cuántos son.


    **Comandos a practicar:** `/usr/lib/systemd/system`, `sort`, `wc -l`


    **Estructuras de Bash:** `for f in .../*.service`, `${f##*/}`, `[[ =~ ]]`


    **Detalle importante:** `[[ $n =~ d\.service$ ]]`: el punto se escapa porque en
    una expresión regular significa «cualquier carácter». `crond.service` cumple;
    `getty@.service` no.'
  script:
    path: /home/learner/aso/p32/demonios.sh
    usage: demonios.sh [-c]
  input_requirements:
  - description: Recibe como mucho la opción -c.
    error: uso
  output_requirements:
  - id: correcto
    description: Los nombres, o el recuento.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: demonios.sh [-c]'
  examples:
  - command: /home/learner/aso/p32/demonios.sh -c
    stdout: '25

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p32/demonios.sh -x
    stdout: ''
    stderr: 'uso: demonios.sh [-c]

      '
    exit_code: 1
  evaluations:
  - id: lista
    description: Filtra los nombres reales.
    points: 6
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: find /usr/lib/systemd/system -maxdepth 1 -name '*d.service'
          -printf '%f\n' | LC_ALL=C sort
      stderr:
        match: empty
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: contains
        value: crond.service
      stderr:
        match: empty
  - id: cuenta
    description: Cuenta con -c.
    points: 6
    checks:
    - type: run
      args:
      - -c
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: find /usr/lib/systemd/system -maxdepth 1 -name '*d.service'
          | wc -l
      stderr:
        match: empty
  - id: error-uso
    description: 'Rechaza la entrada: Recibe como mucho la opción -c.'
    points: 2
