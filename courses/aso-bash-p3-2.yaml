- id: reparto-cpu
  title: Reparto de CPU con CPUWeight
  description: 'Apartado 6.2. Dados dos valores de `CPUWeight`, muestra qué porcentaje
    entero (truncado) de CPU recibe cada servicio si compiten. El segundo es opcional
    y vale 100, el valor por defecto de `CPUWeight`.


    **Comandos a practicar:** `CPUWeight=`


    **Estructuras de Bash:** `${2:-100}`, `$(( ))`, `for`


    **Detalle importante:** La hoja reduce la prioridad a la mitad con `CPUWeight=50`:
    frente a otro servicio con 100 recibe 1/3 de la CPU. El rango válido va de 1 a
    10000.'
  script:
    path: /home/learner/aso/p32/reparto-cpu.sh
    usage: reparto-cpu.sh PESO1 [PESO2]
  input_requirements:
  - description: Recibe uno o dos pesos.
