- id: dropin
  title: Crear un fichero drop-in
  description: 'Apartado 5. Crea `/etc/systemd/system/UNIDAD.d/NOMBRE.conf` con la
    cabecera de la sección y una línea por cada propiedad, sustituyendo el fichero
    si ya existía. Termina mostrando la ruta. Se evalúa como root.


    **Comandos a practicar:** `mkdir -p`, `systemd-delta`, `man 5 systemd.service`


    **Estructuras de Bash:** `shift 3`, `for p in "$@"`, agrupación `{ ...; } > fichero`


    **Detalle importante:** El directorio se llama `atd.service.d`. Valida todas las
    propiedades **antes** de escribir para no dejar un fichero a medias. `systemd-delta`
    lista la unidad como `[EXTENDED]`. Tras un cambio real haría falta `systemctl
    daemon-reload`.'
  script:
    path: /home/learner/aso/p32/dropin.sh
    usage: dropin.sh UNIDAD NOMBRE SECCION CLAVE=VALOR...
  input_requirements:
  - description: Recibe unidad, nombre, sección y al menos una propiedad.
    error: uso
  - description: La sección es Unit, Service o Install.
    error: seccion
  - description: Cada propiedad tiene la forma Clave=valor.
    error: propiedad
  - description: La unidad existe.
    error: unidad
  - description: Se ejecuta como root.
    error: permiso
  output_requirements:
  - id: correcto
    description: La ruta creada.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: dropin.sh UNIDAD NOMBRE SECCION CLAVE=VALOR...'
  - id: seccion
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: sección no válida
  - id: propiedad
    description: Mensaje en stderr; stdout vacío.
    exit_code: 3
    stream: stderr
    message: propiedad no válida
  - id: unidad
    description: Mensaje en stderr; stdout vacío.
    exit_code: 4
    stream: stderr
    message: la unidad no existe
  - id: permiso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 5
    stream: stderr
    message: hay que ser root
  examples:
  - command: /home/learner/aso/p32/dropin.sh atd.service restart-policy Service Restart=on-failure
      RestartSec=20
    stdout: '/etc/systemd/system/atd.service.d/restart-policy.conf

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p32/dropin.sh atd.service x Service
    stdout: ''
    stderr: 'uso: dropin.sh UNIDAD NOMBRE SECCION CLAVE=VALOR...

      '
    exit_code: 1
  - command: /home/learner/aso/p32/dropin.sh atd.service x Nada A=1
    stdout: ''
    stderr: 'sección no válida

      '
    exit_code: 2
  - command: /home/learner/aso/p32/dropin.sh atd.service x Service sinigual
    stdout: ''
    stderr: 'propiedad no válida

      '
    exit_code: 3
  - command: /home/learner/aso/p32/dropin.sh no.service x Service A=1
    stdout: ''
    stderr: 'la unidad no existe

      '
    exit_code: 4
  - command: /home/learner/aso/p32/dropin.sh atd.service x Service A=1
    stdout: ''
    stderr: 'hay que ser root

      '
    exit_code: 5
  evaluations:
  - id: crea
    description: Crea el drop-in con el formato correcto.
    points: 6
    checks:
    - type: run
      args:
      - atd.service
      - restart-policy
      - Service
      - Restart=on-failure
      - RestartSec=20
      cwd: /home/learner
      user: root
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: /etc/systemd/system/atd.service.d/restart-policy.conf
      stderr:
        match: empty
      prepare: rm -rf /etc/systemd/system/atd.service.d
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - 'S=/home/learner/aso/p32/dropin.sh

        D=/home/learner/aso/p32

        [ "$(cat /etc/systemd/system/atd.service.d/restart-policy.conf)" = "[Service]

        Restart=on-failure

