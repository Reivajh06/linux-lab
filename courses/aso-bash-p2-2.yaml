schema_version: 1
id: aso-bash-p2-2
version: '1.0'
title: ASO Bash 2.2 · Lectura de ficheros, vectores, argumentos y canales
description: "Lee `/etc/passwd` y otros ficheros reales línea a línea: `while IFS=:\
  \ read`, `case`, `read -a`, `shift`, `\"$@\"`, `continue`, y canales propios con\
  \ `exec`, `read -u` y `>&4`.\n    Incluye los scripts guía, las dos actividades\
  \ de laboratorio y los siete ejercicios autónomos de la Práctica 2.2.\n\nCada ejercicio\
  \ es un **script de Bash** en `/home/learner/aso/p22/`: empieza por `#!/bin/bash`,\
  \ hazlo ejecutable con `chmod u+x`, envía los resultados a stdout y los errores\
  \ a stderr, y usa un código de salida distinto para cada error. Los ejercicios trabajan\
  \ con ficheros y procesos reales del sistema (`/etc/passwd`, `/etc/group`, `/proc`,\
  \ `/usr/share/dict/words`...): la salida esperada se calcula al evaluar, así que\
  \ no vale escribir el resultado a mano."
setup:
- script: 'set -e

    install -d -o learner -g learner /home/learner/aso/p22

    id usuario1 >/dev/null 2>&1 || useradd -m -s /bin/bash -c ''Usuario 1'' usuario1

    id usuario2 >/dev/null 2>&1 || useradd -m -s /bin/bash -c ''Usuario 2'' usuario2

    '
  user: root
  timeout: 60
exercises:
- id: registro
  title: Un campo de cada registro con case
  description: 'Script guía del apartado 1. Muestra `Registro N: VALOR` para cada
    línea de `/etc/passwd` y termina con `Total de registros: N`. Lee cada línea en
    **variables con nombre** y elige el campo con `case`.


    **Comandos a practicar:** `/etc/passwd`


    **Estructuras de Bash:** `while IFS=: read nombre clave uid gid gecos directorio
    shell; do ... done < /etc/passwd`, `case`, `;;`, `esac`


    **Detalle importante:** Redirige al bloque `while`. Si usas `cat /etc/passwd |
    while ...`, el bucle corre en un sub-shell y el total saldría 0 al terminar la
    tubería.'
  script:
    path: /home/learner/aso/p22/registro.sh
    usage: registro.sh CAMPO
  input_requirements:
  - description: Recibe exactamente un campo.
    error: uso
  - description: El campo es un entero positivo.
    error: formato
  - description: El campo está entre 1 y 7.
    error: rango
  output_requirements:
  - id: correcto
    description: Una línea por registro y el total.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: registro.sh campo'
  - id: formato
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: el campo debe ser un entero positivo
  - id: rango
    description: Mensaje en stderr; stdout vacío.
    exit_code: 3
    stream: stderr
    message: el campo está fuera del rango de valores aceptado
  examples:
  - command: /home/learner/aso/p22/registro.sh 1 | tail -n 3
    stdout: 'Registro 24: p22x

      Registro 25: p22sh

      Total de registros: 25

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p22/registro.sh
    stdout: ''
    stderr: 'uso: registro.sh campo

      '
    exit_code: 1
  - command: /home/learner/aso/p22/registro.sh x
    stdout: ''
    stderr: 'el campo debe ser un entero positivo

      '
    exit_code: 2
  - command: /home/learner/aso/p22/registro.sh 0
    stdout: ''
    stderr: 'el campo está fuera del rango de valores aceptado

      '
    exit_code: 3
  evaluations:
  - id: campos
    description: Muestra el campo y el total correcto.
    points: 6
    checks:
    - type: run
      args:
      - '1'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: 'awk -F: ''{print "Registro " NR ": " $1} END{print "Total de
          registros: " NR}'' /etc/passwd'
      stderr:
        match: empty
    - type: run
      args:
      - '3'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: 'awk -F: ''{print "Registro " NR ": " $3} END{print "Total de
          registros: " NR}'' /etc/passwd'
      stderr:
        match: empty
    - type: run
      args:
      - '5'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: 'awk -F: ''{print "Registro " NR ": " $5} END{print "Total de
          registros: " NR}'' /etc/passwd'
      stderr:
        match: empty
    - type: run
      args:
      - '7'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: 'awk -F: ''{print "Registro " NR ": " $7} END{print "Total de
          registros: " NR}'' /etc/passwd'
      stderr:
        match: empty
  - id: error-uso
    description: 'Rechaza la entrada: Recibe exactamente un campo.'
    points: 2
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: registro.sh campo'
    - type: run
      args:
      - '1'
      - '2'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: registro.sh campo'
  - id: error-formato
    description: 'Rechaza la entrada: El campo es un entero positivo.'
    points: 2
    checks:
    - type: run
      args:
      - x
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: formato
      stderr:
        match: exact
        value: el campo debe ser un entero positivo
  - id: error-rango
    description: 'Rechaza la entrada: El campo está entre 1 y 7.'
    points: 2
    checks:
    - type: run
      args:
      - '0'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: rango
      stderr:
        match: exact
        value: el campo está fuera del rango de valores aceptado
    - type: run
      args:
      - '8'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: rango
      stderr:
        match: exact
        value: el campo está fuera del rango de valores aceptado
  tips: []
  setup: []
  sources:
  - document_hash: afea333146e988d86123c549c02cd1db9401df46157267bbdda835a2946e3f86
    title: Práctica-2.2
    pages:
    - 1
