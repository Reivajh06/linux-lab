- id: rango-uid
  title: 'Autónomo 2: usuarios por rango de UID'
  description: 'Muestra `NOMBRE UID` de los usuarios cuyo UID está en el rango, ambos
    incluidos, y al final `Usuarios: N` o `Ningún usuario cumple la condición`. Recibe
    cero o dos argumentos: sin argumentos, el rango sale de `UID_MIN` y `UID_MAX`
    de `/etc/login.defs`.


    **Comandos a practicar:** `grep ^UID_MIN`, `tr -s`, `cut`


    **Estructuras de Bash:** `(( ))`, `if/else`, sustitución de comandos


    **Detalle importante:** Ancla con `^UID_MIN`: `/etc/login.defs` tiene también
    `SUB_UID_MIN` y `SYS_UID_MIN`, y comentarios. `UID_MIN` y su valor están separados
    por varios espacios.'
  script:
    path: /home/learner/aso/p22/rango-uid.sh
    usage: rango-uid.sh [MIN MAX]
  input_requirements:
  - description: Recibe cero o dos argumentos.
    error: uso
  - description: Los límites son números.
    error: formato
  - description: El mínimo no supera al máximo.
    error: rango
  output_requirements:
  - id: correcto
    description: Los usuarios y la línea final.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: rango-uid.sh [MIN MAX]'
  - id: formato
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: los límites deben ser números
  - id: rango
    description: Mensaje en stderr; stdout vacío.
    exit_code: 3
    stream: stderr
    message: el mínimo supera al máximo
  examples:
  - command: /home/learner/aso/p22/rango-uid.sh
    stdout: 'learner 1000

      usuario1 1001

      usuario2 1002

      p22x 1003

      p22sh 1004

      Usuarios: 5

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p22/rango-uid.sh 3 3
    stdout: 'adm 3

      Usuarios: 1

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p22/rango-uid.sh 1
    stdout: ''
    stderr: 'uso: rango-uid.sh [MIN MAX]

      '
    exit_code: 1
  - command: /home/learner/aso/p22/rango-uid.sh a 5
    stdout: ''
    stderr: 'los límites deben ser números

      '
    exit_code: 2
  - command: /home/learner/aso/p22/rango-uid.sh 9 1
    stdout: ''
    stderr: 'el mínimo supera al máximo

      '
    exit_code: 3
  evaluations:
  - id: defecto
    description: Lee el rango de /etc/login.defs.
    points: 6
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: 'awk -F: -v a=$(awk ''$1=="UID_MIN"{print $2}'' /etc/login.defs)
          -v b=$(awk ''$1=="UID_MAX"{print $2}'' /etc/login.defs) ''$3>=a && $3<=b{print
          $1 " " $3; n++} END{print (n ? "Usuarios: " n : "Ningún usuario cumple la
          condición")}'' /etc/passwd'
      stderr:
        match: empty
  - id: explicito
