  supplemental: Se ejecuta contra los ficheros reales del sistema Fedora del laboratorio;
    la salida esperada se calcula en vivo al evaluar.
- id: columnas
  title: Varios campos con vectores
  description: 'Apartados 2 y 3. Recibe una lista de campos y muestra por cada línea
    `Registro N:` seguido de cada campo separado por tabuladores, en el orden pedido
    y admitiendo repetidos. Termina con `Total de registros: N`. Valida **todos**
    los campos antes de leer el fichero.


    **Comandos a practicar:** `echo -e`, o `printf`


    **Estructuras de Bash:** `IFS=: read -a vector`, `${vector[$((campo-1))]}`, `for
    campo in "$@"`, concatenación


    **Detalle importante:** Los vectores empiezan en 0, y `${vector[1]}` necesita
    las llaves: `$vector[1]` imprime el primer elemento seguido del texto `[1]`.'
  script:
    path: /home/learner/aso/p22/columnas.sh
    usage: columnas.sh CAMPO...
  input_requirements:
  - description: Recibe al menos un campo.
    error: uso
  - description: Todos los campos son enteros positivos.
    error: formato
  - description: Todos los campos están entre 1 y 7.
    error: rango
  output_requirements:
  - id: correcto
    description: Una línea por registro y el total.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: columnas.sh campos...'
  - id: formato
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: x no es un entero positivo
  - id: rango
    description: Mensaje en stderr; stdout vacío.
    exit_code: 3
    stream: stderr
    message: 9 está fuera del rango de valores aceptado
  examples:
  - command: /home/learner/aso/p22/columnas.sh 7 1 | head -n 2
    stdout: "Registro 1:\t/bin/bash\troot\nRegistro 2:\t/usr/sbin/nologin\tbin\n"
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p22/columnas.sh
    stdout: ''
    stderr: 'uso: columnas.sh campos...

      '
    exit_code: 1
  - command: /home/learner/aso/p22/columnas.sh 1 x
    stdout: ''
    stderr: 'x no es un entero positivo

      '
    exit_code: 2
  - command: /home/learner/aso/p22/columnas.sh 1 9
    stdout: ''
    stderr: '9 está fuera del rango de valores aceptado

      '
    exit_code: 3
  evaluations:
  - id: campos
    description: Admite desorden y repetidos.
    points: 6
    checks:
    - type: run
      args:
      - '1'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: 'awk -F: ''{printf "Registro %d:", NR; printf "\t%s", $1; print
          ""} END{print "Total de registros: " NR}'' /etc/passwd'
      stderr:
        match: empty
    - type: run
      args:
      - '7'
      - '1'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: 'awk -F: ''{printf "Registro %d:", NR; printf "\t%s", $7; printf
          "\t%s", $1; print ""} END{print "Total de registros: " NR}'' /etc/passwd'
      stderr:
        match: empty
    - type: run
      args:
      - '1'
      - '5'
      - '1'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: 'awk -F: ''{printf "Registro %d:", NR; printf "\t%s", $1; printf
          "\t%s", $5; printf "\t%s", $1; print ""} END{print "Total de registros:
          " NR}'' /etc/passwd'
      stderr:
        match: empty
  - id: error-uso
    description: 'Rechaza la entrada: Recibe al menos un campo.'
    points: 2
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: columnas.sh campos...'
  - id: error-formato
    description: 'Rechaza la entrada: Todos los campos son enteros positivos.'
    points: 2
    checks:
    - type: run
      args:
      - '1'
      - x
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: formato
      stderr:
        match: exact
        value: x no es un entero positivo
  - id: error-rango
    description: 'Rechaza la entrada: Todos los campos están entre 1 y 7.'
    points: 2
    checks:
    - type: run
      args:
      - '1'
      - '9'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: rango
      stderr:
        match: exact
        value: 9 está fuera del rango de valores aceptado
  tips: []
  setup: []
  sources:
  - document_hash: afea333146e988d86123c549c02cd1db9401df46157267bbdda835a2946e3f86
    title: Práctica-2.2
    pages:
    - 3
    - 4
    - 6
    - 7
  supplemental: Se ejecuta contra los ficheros reales del sistema Fedora del laboratorio;
    la salida esperada se calcula en vivo al evaluar.
- id: canales
  title: Canales propios con exec
  description: 'Apartado 4. Escribe en `SALIDA` las líneas `Registro N: VALOR` y el
    total, usando el canal 3 para leer `/etc/passwd` y el 4 para escribir. Por defecto
    el fichero se sobrescribe; con `-a` se añade al final. Por pantalla muestra solo
    `N registros escritos`.


    **Comandos a practicar:** `exec 3<`, `exec 4>`, `exec 4>>`, `exec 3<&-`, `exec
    4>&-`


    **Estructuras de Bash:** `read -u3`, `>&4`, `shift`


    **Detalle importante:** `exec 4>fichero` vacía el fichero al abrirlo. El cierre
    es `4>&-` tanto si se abrió con `>` como con `>>`. El descriptor recuerda la posición
    de lectura entre un `read -u3` y el siguiente.'
  script:
    path: /home/learner/aso/p22/canales.sh
    usage: canales.sh [-a] SALIDA CAMPO
  input_requirements:
  - description: Recibe salida y campo, con -a opcional delante.
    error: uso
  - description: El campo es un número entre 1 y 7.
    error: campo
  - description: La salida se puede abrir.
    error: salida
  output_requirements:
  - id: correcto
    description: La línea de confirmación; el fichero contiene los registros.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: canales.sh [-a] SALIDA CAMPO'
  - id: campo
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: campo no válido
  - id: salida
    description: Mensaje en stderr; stdout vacío.
    exit_code: 4
    stream: stderr
    message: no se puede abrir la salida
  examples:
  - command: /home/learner/aso/p22/canales.sh /home/learner/aso/p22/salida.txt 1
    stdout: '25 registros escritos

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p22/canales.sh x
    stdout: ''
    stderr: 'uso: canales.sh [-a] SALIDA CAMPO

      '
    exit_code: 1
  - command: /home/learner/aso/p22/canales.sh /home/learner/aso/p22/salida.txt 9
    stdout: ''
    stderr: 'campo no válido

      '
    exit_code: 2
  - command: /home/learner/aso/p22/canales.sh /proc/nada/x 1
    stdout: ''
    stderr: 'no se puede abrir la salida

      '
    exit_code: 4
  evaluations:
  - id: sobrescribe
    description: Sobrescribe por defecto.
    points: 6
    checks:
    - type: run
      args:
      - /home/learner/aso/p22/salida.txt
      - '1'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: echo "$(wc -l < /etc/passwd) registros escritos"
      stderr:
        match: empty
      prepare: 'echo viejo > /home/learner/aso/p22/salida.txt; chown learner: /home/learner/aso/p22/salida.txt'
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - 'S=/home/learner/aso/p22/canales.sh

        D=/home/learner/aso/p22

        [ "$(cat $D/salida.txt)" = "$(awk -F: ''{print "Registro " NR ": " $1} END{print
        "Total de registros: " NR}'' /etc/passwd)" ]'
      cwd: /home/learner
      user: root
      timeout: 10
      requirement: correcto
  - id: anade
    description: Añade con -a.
    points: 6
    checks:
    - type: run
      args:
      - -a
      - /home/learner/aso/p22/salida.txt
      - '1'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: echo "$(wc -l < /etc/passwd) registros escritos"
      stderr:
        match: empty
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - 'S=/home/learner/aso/p22/canales.sh

        D=/home/learner/aso/p22

        [ "$(wc -l < $D/salida.txt)" = "$(( ($(wc -l < /etc/passwd)+1)*2 ))" ]'
      cwd: /home/learner
      user: root
      timeout: 10
      requirement: correcto
  - id: error-uso
    description: 'Rechaza la entrada: Recibe salida y campo, con -a opcional delante.'
    points: 2
    checks:
    - type: run
      args:
      - x
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: canales.sh [-a] SALIDA CAMPO'
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: canales.sh [-a] SALIDA CAMPO'
    - type: run
      args:
      - -a
      - x
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: canales.sh [-a] SALIDA CAMPO'
  - id: error-campo
    description: 'Rechaza la entrada: El campo es un número entre 1 y 7.'
    points: 2
    checks:
    - type: run
      args:
      - /home/learner/aso/p22/salida.txt
      - '9'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: campo
      stderr:
        match: exact
        value: campo no válido
    - type: run
      args:
      - /home/learner/aso/p22/salida.txt
      - x
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: campo
      stderr:
        match: exact
        value: campo no válido
  - id: error-salida
    description: 'Rechaza la entrada: La salida se puede abrir.'
    points: 2
    checks:
    - type: run
      args:
      - /proc/nada/x
      - '1'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: salida
      stderr:
        match: exact
        value: no se puede abrir la salida
  tips: []
  setup: []
  sources:
  - document_hash: afea333146e988d86123c549c02cd1db9401df46157267bbdda835a2946e3f86
    title: Práctica-2.2
    pages:
    - 7
    - 8
    - 9
  supplemental: Se ejecuta contra los ficheros reales del sistema Fedora del laboratorio;
    la salida esperada se calcula en vivo al evaluar.
- id: uid-gid
  title: 'Actividad 1: UID y GID'
  description: "Actividad de laboratorio 1. Muestra `NOMBRE UID GID` de los usuarios\
    \ cuyo UID coincide con su GID o, con la opción `-d`, de aquellos en los que difieren.\
    \ Al final muestra `Usuarios: N` o, si no hay ninguno, `Ningún usuario cumple\
    \ la condición`.\n    Acepta un fichero opcional con el mismo formato; por defecto\
    \ usa `/etc/passwd`. `/dev/null` es un fichero válido y vacío.\n\n**Comandos a\
    \ practicar:** `/etc/passwd`, `/dev/null`\n\n**Estructuras de Bash:** `shift`,\
    \ `while IFS=: read`, `(( ))`, contador\n\n**Detalle importante:** Procesa la\
    \ opción y quítala con `shift`: así `$1` pasa a ser el fichero en ambos casos."
  script:
    path: /home/learner/aso/p22/uid-gid.sh
    usage: uid-gid.sh [-d] [FICHERO]
  input_requirements:
  - description: Recibe como mucho -d y un fichero.
    error: uso
  - description: El fichero existe y se puede leer.
    error: fichero
  output_requirements:
  - id: correcto
    description: Los usuarios y la línea final.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: uid-gid.sh [-d] [FICHERO]'
  - id: fichero
    description: Mensaje en stderr; stdout vacío.
    exit_code: 4
    stream: stderr
    message: no se puede leer el fichero
  examples:
  - command: /home/learner/aso/p22/uid-gid.sh | tail -n 3
    stdout: 'p22x 1003 1003

      p22sh 1004 1004

      Usuarios: 16

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p22/uid-gid.sh /dev/null
    stdout: 'Ningún usuario cumple la condición

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p22/uid-gid.sh a b
    stdout: ''
    stderr: 'uso: uid-gid.sh [-d] [FICHERO]

      '
    exit_code: 1
  - command: /home/learner/aso/p22/uid-gid.sh /etc/nada
    stdout: ''
    stderr: 'no se puede leer el fichero

      '
    exit_code: 4
  evaluations:
  - id: iguales
    description: UID igual a GID.
    points: 6
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: 'awk -F: ''$3==$4{print $1 " " $3 " " $4; n++} END{print (n
          ? "Usuarios: " n : "Ningún usuario cumple la condición")}'' /etc/passwd'
      stderr:
        match: empty
  - id: distintos
    description: UID distinto de GID.
    points: 6
    checks:
    - type: run
      args:
      - -d
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: 'awk -F: ''$3!=$4{print $1 " " $3 " " $4; n++} END{print (n
          ? "Usuarios: " n : "Ningún usuario cumple la condición")}'' /etc/passwd'
      stderr:
        match: empty
  - id: ninguno
    description: Mensaje específico si no hay ninguno.
    points: 6
    checks:
    - type: run
      args:
      - /dev/null
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: Ningún usuario cumple la condición
      stderr:
        match: empty
    - type: run
      args:
      - -d
      - /dev/null
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: Ningún usuario cumple la condición
      stderr:
        match: empty
  - id: error-uso
    description: 'Rechaza la entrada: Recibe como mucho -d y un fichero.'
    points: 2
    checks:
    - type: run
      args:
      - a
      - b
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
