- id: parte-linea
  title: Partir una línea con read
  description: 'Apartado 1. Lee **una línea de la entrada estándar** y la parte en
    tres variables. Muestra `a=...`, `b=...` y `resto=...`. El separador opcional
    sustituye a `IFS` solo para esa lectura.


    **Comandos a practicar:** `read`


    **Estructuras de Bash:** `IFS=/ read a b resto`, `${1:-...}`, `if ! read ...;
    then`


    **Detalle importante:** Si sobran campos, la última variable se queda con el resto
    de la línea. Si faltan, las últimas quedan vacías. `read` devuelve error cuando
    ya no hay nada que leer.'
  script:
    path: /home/learner/aso/p22/parte-linea.sh
    usage: parte-linea.sh [SEPARADOR]
  input_requirements:
  - description: Recibe como mucho un separador.
    error: uso
  - description: Hay al menos una línea en la entrada.
    error: entrada
  output_requirements:
  - id: correcto
    description: Las tres líneas.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: parte-linea.sh [SEPARADOR]'
  - id: entrada
    description: Mensaje en stderr; stdout vacío.
    exit_code: 4
    stream: stderr
    message: no hay nada que leer
  examples:
  - command: /home/learner/aso/p22/parte-linea.sh < /etc/passwd
    stdout: 'a=root:x:0:0:Super

      b=User:/root:/bin/bash

      resto=

