    directorio personal está bajo él, y al final `Usuarios: N` o `Ningún usuario cumple
    la condición`.


    **Comandos a practicar:** `/etc/passwd`


    **Estructuras de Bash:** `[[ $1 != /* ]]`, `[[ $home == "$dir"/* ]]`, `${1%/}`


    **Detalle importante:** La parte entrecomillada del patrón es literal y la `*`
    no. `/home2/x` no está bajo `/home`: compara con `"$dir"/*`. `${1%/}` quita la
    barra final, para aceptar también `/home/`.'
