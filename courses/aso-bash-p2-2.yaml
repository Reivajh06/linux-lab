  description: 'Muestra alternando una línea de cada fichero. Cuando uno se termina,
    continúa con las líneas restantes del más largo.


    **Comandos a practicar:** `exec 3<`, `exec 4<`


    **Estructuras de Bash:** `read -u3`, `read -u4`, banderas de fin, `while`


    **Detalle importante:** Este ejercicio es el motivo de tener canales propios:
    con una sola redirección al `while` no puedes leer de dos ficheros a la vez, porque
    cada `read` necesita su descriptor y su posición.'
