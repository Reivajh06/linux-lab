- id: pares
  title: 'Autónomo 4: líneas pares o impares'
  description: 'Muestra las líneas pares (`-p`) o impares (`-i`) de un fichero, sin
    alterarlas: conserva espacios iniciales y barras invertidas, e incluye una última
    línea aunque no acabe en salto de línea.


    **Comandos a practicar:** `/etc/passwd`, `printf ''%s\n''`


    **Estructuras de Bash:** `while IFS= read -r linea || [[ -n $linea ]]`, `((n%2))`,
    `case`


    **Detalle importante:** `IFS=` conserva los espacios iniciales, `-r` conserva
    las barras y `|| [[ -n $linea ]]` procesa la última línea sin `\n`: `read` devuelve
    error, pero la variable sí tiene el texto.'
  script:
    path: /home/learner/aso/p22/pares.sh
    usage: pares.sh -p|-i FICHERO
  input_requirements:
