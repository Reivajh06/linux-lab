    **Estructuras de Bash:** `${shell##*/}`, doble bucle o `grep -c`, `continue`


    **Detalle importante:** `/bin/bash` y `/usr/bin/bash` tienen ambos el nombre `bash`,
    y `sh` no es `bash`: compara el último componente de la ruta, no busques una subcadena.'
