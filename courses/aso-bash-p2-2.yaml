  description: 'Muestra los intérpretes asignados a usuarios que no aparecen en `/etc/shells`.
    Por defecto los muestra todos en orden de `/etc/passwd`, aunque se repitan. Con
    `-u` muestra cada uno una vez, ordenados.


    **Comandos a practicar:** `grep -Fx`, `sort -u`


    **Estructuras de Bash:** `while IFS=: read`, tuberías sobre un bucle, función


    **Detalle importante:** `grep -Fxq` compara la línea **entera** y de forma literal:
    `/bin/sh` no debe aceptarse por estar contenido en otra línea. Se puede encadenar
    `done < /etc/passwd | sort -u`.'
