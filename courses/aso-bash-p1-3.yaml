- id: politica
  title: Política de contraseñas con chage
  description: 'Aplica a un usuario la vigencia máxima, los días de aviso, el periodo
    de gracia y, si se indica, la fecha de caducidad de la cuenta (`AAAA-MM-DD`).
    Sin fecha, la cuenta no caduca nunca. Termina con `política aplicada a USUARIO`.


    **Comandos a practicar:** `chage -M -W -I -E`, `chage -l`


    **Estructuras de Bash:** `${5:--1}`, validación en bucle, `[[ =~ ]]`


    **Detalle importante:** No confundas caducidad de la **contraseña** (`-M`) con
    caducidad de la **cuenta** (`-E`). El periodo de «inactividad» (`-I`) es en realidad
    una gracia tras caducar la contraseña; `-E -1` quita la caducidad.'
  script:
    path: /home/learner/aso/p13/politica.sh
    usage: politica.sh USUARIO MAX AVISO GRACIA [FECHA]
  input_requirements:
  - description: Recibe cuatro o cinco argumentos.
    error: uso
  - description: MAX, AVISO y GRACIA son números.
    error: numero
  - description: La fecha tiene formato AAAA-MM-DD.
    error: fecha
  - description: El usuario existe.
    error: usuario
  - description: Se ejecuta como root.
    error: permiso
  output_requirements:
  - id: correcto
    description: El mensaje de confirmación.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: politica.sh USUARIO MAX AVISO GRACIA [FECHA]'
  - id: numero
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: los días deben ser números
  - id: fecha
    description: Mensaje en stderr; stdout vacío.
    exit_code: 3
    stream: stderr
    message: la fecha no tiene el formato AAAA-MM-DD
  - id: usuario
    description: Mensaje en stderr; stdout vacío.
    exit_code: 4
    stream: stderr
    message: el usuario no existe
  - id: permiso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 5
    stream: stderr
    message: hay que ser root
  examples:
  - command: /home/learner/aso/p13/politica.sh p13p 60 4 2 2026-12-15
    stdout: 'política aplicada a p13p

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p13/politica.sh p13p 1 2
    stdout: ''
    stderr: 'uso: politica.sh USUARIO MAX AVISO GRACIA [FECHA]

      '
    exit_code: 1
  - command: /home/learner/aso/p13/politica.sh p13p x 4 2
    stdout: ''
    stderr: 'los días deben ser números

      '
    exit_code: 2
  - command: /home/learner/aso/p13/politica.sh p13p 60 4 2 15/12/2026
    stdout: ''
    stderr: 'la fecha no tiene el formato AAAA-MM-DD

      '
    exit_code: 3
  - command: /home/learner/aso/p13/politica.sh nadie 60 4 2
    stdout: ''
    stderr: 'el usuario no existe

      '
    exit_code: 4
  - command: /home/learner/aso/p13/politica.sh p13p 60 4 2
    stdout: ''
    stderr: 'hay que ser root

      '
    exit_code: 5
  evaluations:
  - id: con-fecha
    description: Aplica la política con fecha.
    points: 6
    checks:
    - type: run
      args:
      - p13p
      - '60'
      - '4'
      - '2'
      - '2026-12-15'
      cwd: /home/learner
      user: root
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: política aplicada a p13p
      stderr:
        match: empty
      prepare: id p13p >/dev/null 2>&1 || useradd -m p13p; chage -M 99999 -W 7 -I
        -1 -E -1 p13p
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - 'S=/home/learner/aso/p13/politica.sh

        D=/home/learner/aso/p13

        IFS=: read -r u c l mi ma av in ca r <<< "$(getent shadow p13p)"; [ "$ma:$av:$in:$ca"
        = 60:4:2:20802 ]'
      cwd: /home/learner
      user: root
      timeout: 10
      requirement: correcto
  - id: sin-fecha
