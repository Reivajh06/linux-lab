- id: info-fichero
  title: Ficha de un fichero
  description: 'Muestra la propiedad y los permisos de una ruta, siguiendo enlaces:


    ```text

    tipo: directorio        (fichero, directorio u otro)

    propietario: root

    grupo: root

    permisos: 1777          (lo que da stat -c %a)

    especial: sticky        (suid, sgid, sticky o ninguno; si hay varios, separados
    por comas en ese orden)

    ```


    **Comandos a practicar:** `stat -L -c`


    **Estructuras de Bash:** `if/elif`, operadores de ficheros `-f -d`, `-u -g -k`


    **Detalle importante:** `/usr/bin/passwd` lleva SUID porque debe escribir en `/etc/shadow`,
    y `/tmp` lleva sticky bit para que cada cual solo borre lo suyo. `test` tiene
    operadores para ambos: `-u`, `-g`, `-k`.'
  script:
    path: /home/learner/aso/p13/info-fichero.sh
    usage: info-fichero.sh RUTA
  input_requirements:
  - description: Recibe exactamente una ruta.
    error: uso
  - description: La ruta existe.
    error: ruta
  output_requirements:
  - id: correcto
    description: Las cinco líneas de la ficha.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: info-fichero.sh RUTA'
  - id: ruta
    description: Mensaje en stderr; stdout vacío.
    exit_code: 4
    stream: stderr
    message: la ruta no existe
  examples:
  - command: /home/learner/aso/p13/info-fichero.sh /tmp
    stdout: 'tipo: directorio

      propietario: root

      grupo: root

      permisos: 1777

      especial: sticky

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p13/info-fichero.sh /usr/bin/passwd
    stdout: 'tipo: fichero

      propietario: root

      grupo: root

      permisos: 4755

      especial: suid

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p13/info-fichero.sh
    stdout: ''
    stderr: 'uso: info-fichero.sh RUTA

      '
    exit_code: 1
  - command: /home/learner/aso/p13/info-fichero.sh /nada
    stdout: ''
    stderr: 'la ruta no existe

      '
    exit_code: 4
  evaluations:
  - id: reales
    description: Describe rutas reales.
    points: 6
    checks:
    - type: run
      args:
      - /tmp
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'tipo: directorio

          propietario: root

          grupo: root

          permisos: 1777

          especial: sticky'
      stderr:
        match: empty
    - type: run
      args:
      - /usr/bin/passwd
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'tipo: fichero

          propietario: root

          grupo: root

          permisos: 4755

          especial: suid'
      stderr:
        match: empty
    - type: run
      args:
      - /etc/passwd
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'tipo: fichero

          propietario: root

          grupo: root

          permisos: 644

          especial: ninguno'
      stderr:
        match: empty
    - type: run
      args:
      - /dev/null
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'tipo: otro

          propietario: root

          grupo: root

          permisos: 666

          especial: ninguno'
      stderr:
        match: empty
    - type: run
      args:
      - /srv/p13sgid
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'tipo: directorio

          propietario: root

          grupo: root

          permisos: 2775

          especial: sgid'
      stderr:
        match: empty
      prepare: mkdir -p /srv/p13sgid; chmod 2775 /srv/p13sgid
  - id: error-uso
    description: 'Rechaza la entrada: Recibe exactamente una ruta.'
    points: 2
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: info-fichero.sh RUTA'
  - id: error-ruta
    description: 'Rechaza la entrada: La ruta existe.'
    points: 2
    checks:
    - type: run
      args:
      - /nada
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: ruta
      stderr:
        match: exact
        value: la ruta no existe
  tips: []
  setup: []
  sources:
  - document_hash: 4fff130b55f626b24695f78465d28f7e99e4bdf394ba2cc4b4dad720f750eea4
    title: Práctica-1.3
