schema_version: 1
id: aso-bash-p1-3
version: '1.0'
title: ASO Bash 1.3 · Permisos, usuarios y grupos
description: "Scripts que leen y administran el sistema de cuentas real: `/etc/passwd`,\
  \ `/etc/shadow`, `/etc/group`, `/etc/gshadow`, `stat`, `chmod`, `useradd`, `chage`,\
  \ `gpasswd`.\n    Los ejercicios de administración se evalúan **como root** y comprueban\
  \ el estado que dejan en el sistema; en la terminal, ejecútalos con `sudo`. Terminan\
  \ con la actividad completa de laboratorio.\n\nCada ejercicio es un **script de\
  \ Bash** en `/home/learner/aso/p13/`: empieza por `#!/bin/bash`, hazlo ejecutable\
  \ con `chmod u+x`, envía los resultados a stdout y los errores a stderr, y usa un\
  \ código de salida distinto para cada error. Los ejercicios trabajan con ficheros\
  \ y procesos reales del sistema (`/etc/passwd`, `/etc/group`, `/proc`, `/usr/share/dict/words`...):\
  \ la salida esperada se calcula al evaluar, así que no vale escribir el resultado\
  \ a mano."
setup:
- script: 'set -e

    install -d -o learner -g learner /home/learner/aso/p13

    id usuario1 >/dev/null 2>&1 || useradd -m -s /bin/bash -c ''Usuario 1'' usuario1

    id usuario2 >/dev/null 2>&1 || useradd -m -s /bin/bash -c ''Usuario 2'' usuario2

    '
  user: root
  timeout: 60
exercises:
- id: permisos-octal
  title: De rwx a octal
  description: "Convierte una cadena de nueve caracteres de permisos, como la de `ls\
    \ -l`, a octal de cuatro dígitos: `rwxrw-r--` da `0764`.\n    Reconoce los especiales:\
    \ `s`/`S` en usuario y grupo, y `t`/`T` en otros. `rwsr-xr-x` da `4755` y `rwxr-xr-T`\
    \ da `1754`.\n\n**Comandos a practicar:** `stat -c %A`, `stat -c %a` para comprobar\n\
    \n**Estructuras de Bash:** `for ((i=0;i<9;i+=3))`, `${cadena:pos:largo}`, `case`,\
    \ `$(( ))`, `printf %d`\n\n**Detalle importante:** La minúscula (`s`, `t`) indica\
    \ que además hay permiso de ejecución; la mayúscula (`S`, `T`), que no. Lectura=4,\
    \ escritura=2, ejecución=1."
  script:
    path: /home/learner/aso/p13/permisos-octal.sh
    usage: permisos-octal.sh PERMISOS
  input_requirements:
  - description: Recibe exactamente una cadena.
    error: uso
  - description: La cadena tiene el formato de permisos.
    error: formato
  output_requirements:
  - id: correcto
    description: El valor de cuatro dígitos.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: permisos-octal.sh PERMISOS'
  - id: formato
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: cadena de permisos no válida
  examples:
  - command: /home/learner/aso/p13/permisos-octal.sh rwxrw-r--
    stdout: '0764

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p13/permisos-octal.sh rwsr-xr-x
    stdout: '4755

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p13/permisos-octal.sh
    stdout: ''
    stderr: 'uso: permisos-octal.sh PERMISOS

      '
    exit_code: 1
  - command: /home/learner/aso/p13/permisos-octal.sh rwxrw-r-
    stdout: ''
    stderr: 'cadena de permisos no válida

      '
    exit_code: 2
  evaluations:
  - id: cadenas
    description: Convierte permisos básicos y especiales.
    points: 6
    checks:
    - type: run
      args:
      - rwxrw-r--
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: '0764'
      stderr:
        match: empty
    - type: run
      args:
      - rw-r--r--
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: '0644'
      stderr:
        match: empty
    - type: run
      args:
      - '---------'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: '0000'
      stderr:
        match: empty
    - type: run
      args:
      - rwsr-xr-x
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: '4755'
      stderr:
        match: empty
    - type: run
      args:
      - rwxrwxrwt
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: '1777'
      stderr:
        match: empty
    - type: run
      args:
      - rwSr--r--
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: '4644'
      stderr:
        match: empty
    - type: run
      args:
      - rwxr-sr-x
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: '2755'
      stderr:
        match: empty
    - type: run
      args:
      - rwxr-xr-T
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: '1754'
      stderr:
        match: empty
  - id: reales
    description: Coincide con stat en ficheros reales.
    points: 6
    checks:
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - "S=/home/learner/aso/p13/permisos-octal.sh\nD=/home/learner/aso/p13\nfor f\
        \ in /tmp /usr/bin/passwd /etc/passwd /usr/bin/sudo /etc/shadow; do\n  s=$(stat\
        \ -c %A \"$f\"); want=$(printf '%04d' \"$(stat -c %a \"$f\")\")\n  [ \"$($S\
        \ \"${s:1}\")\" = \"$want\" ] || exit 1\ndone"
      cwd: /home/learner
      user: root
      timeout: 10
      requirement: correcto
  - id: error-uso
    description: 'Rechaza la entrada: Recibe exactamente una cadena.'
    points: 2
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: permisos-octal.sh PERMISOS'
  - id: error-formato
    description: 'Rechaza la entrada: La cadena tiene el formato de permisos.'
    points: 2
    checks:
    - type: run
      args:
      - rwxrw-r-
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: formato
      stderr:
        match: exact
        value: cadena de permisos no válida
    - type: run
      args:
      - rwxrw-r--x
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: formato
      stderr:
        match: exact
        value: cadena de permisos no válida
    - type: run
