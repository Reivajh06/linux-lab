- id: umask-permisos
  title: Qué permisos deja una máscara
  description: 'Dada una máscara de tres dígitos octales, muestra los permisos de
    los ficheros y directorios nuevos:


    ```text

    fichero: 644

    directorio: 755

    ```


    **Comandos a practicar:** `umask`, `printf %03o`


    **Estructuras de Bash:** aritmética octal `8#$m`, operadores `&` y `~`


    **Detalle importante:** La práctica lo escribe como «666 – umask», pero en realidad
    se **eliminan bits**: con `033` un fichero queda en `644`, no en `633`.'
  script:
    path: /home/learner/aso/p13/umask-permisos.sh
    usage: umask-permisos.sh MASCARA
  input_requirements:
  - description: Recibe exactamente una máscara.
    error: uso
  - description: La máscara tiene tres dígitos octales.
    error: formato
  output_requirements:
  - id: correcto
    description: Las dos líneas de permisos.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: umask-permisos.sh MASCARA'
  - id: formato
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: máscara no válida
  examples:
  - command: /home/learner/aso/p13/umask-permisos.sh 022
    stdout: 'fichero: 644

      directorio: 755

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p13/umask-permisos.sh 033
    stdout: 'fichero: 644

      directorio: 744

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p13/umask-permisos.sh
    stdout: ''
    stderr: 'uso: umask-permisos.sh MASCARA

      '
    exit_code: 1
  - command: /home/learner/aso/p13/umask-permisos.sh 22
    stdout: ''
    stderr: 'máscara no válida

      '
    exit_code: 2
  evaluations:
  - id: mascaras
    description: Calcula bien, también sin restar.
    points: 6
    checks:
    - type: run
      args:
      - '022'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'fichero: 644

          directorio: 755'
      stderr:
        match: empty
    - type: run
      args:
      - '077'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'fichero: 600

          directorio: 700'
      stderr:
        match: empty
    - type: run
      args:
      - '033'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'fichero: 644

          directorio: 744'
      stderr:
        match: empty
    - type: run
      args:
      - '000'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'fichero: 666

          directorio: 777'
      stderr:
        match: empty
  - id: real
    description: Coincide con el comportamiento real de umask.
    points: 6
    checks:
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - "S=/home/learner/aso/p13/umask-permisos.sh\nD=/home/learner/aso/p13\nfor m\
        \ in 027 002 137; do\n  t=$(mktemp -d); (umask \"$m\"; touch \"$t/f\"; mkdir\
        \ \"$t/d\")\n  want=\"fichero: $(stat -c %a \"$t/f\")\ndirectorio: $(stat\
        \ -c %a \"$t/d\")\"\n  [ \"$($S \"$m\")\" = \"$want\" ] || exit 1\n  rm -rf\
        \ \"$t\"\ndone"
      cwd: /home/learner
      user: root
      timeout: 10
      requirement: correcto
  - id: error-uso
    description: 'Rechaza la entrada: Recibe exactamente una máscara.'
    points: 2
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: umask-permisos.sh MASCARA'
  - id: error-formato
    description: 'Rechaza la entrada: La máscara tiene tres dígitos octales.'
    points: 2
    checks:
    - type: run
      args:
      - '22'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: formato
      stderr:
        match: exact
        value: máscara no válida
    - type: run
      args:
      - 088
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: formato
      stderr:
        match: exact
        value: máscara no válida
    - type: run
      args:
      - abc
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: formato
      stderr:
        match: exact
        value: máscara no válida
