          creado: p13b'
      stderr:
        match: empty
      prepare: for u in p13a p13b p13c; do userdel -r $u 2>/dev/null; done; true
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - "S=/home/learner/aso/p13/alta-usuarios.sh\nD=/home/learner/aso/p13\nfor u\
        \ in p13a p13b; do\n  [ \"$(getent passwd $u | cut -d: -f7)\" = /bin/bash\
        \ ] && [ -d /home/$u ] || exit 1\n  case \"$(getent shadow $u | cut -d: -f2)\"\
        \ in ''|'!'*|'*'*) exit 1;; esac\ndone"
      cwd: /home/learner
