- id: miembros-grupo
  title: Primarios y secundarios de un grupo
  description: 'Muestra los miembros de un grupo en dos líneas, cada lista ordenada
    y separada por espacios (`-` si está vacía):


    ```text

    primarios: p13g1 p13g2      (su grupo primario es este, según /etc/passwd)

    secundarios: p13g0 p13g3    (lista de /etc/group)

    ```


    **Comandos a practicar:** `grep`, `cut`, `tr`, `sort`, `xargs`


    **Estructuras de Bash:** `IFS=: read`, `while read` con redirección, `+=`


    **Detalle importante:** La lista de `/etc/group` **no incluye** a quienes tienen
    ese grupo como primario. Hay que cruzarla con el GID de `/etc/passwd`.'
  script:
    path: /home/learner/aso/p13/miembros-grupo.sh
    usage: miembros-grupo.sh GRUPO
  input_requirements:
  - description: Recibe exactamente un grupo.
    error: uso
  - description: El grupo existe.
    error: grupo
  output_requirements:
  - id: correcto
    description: Las dos líneas.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: miembros-grupo.sh GRUPO'
  - id: grupo
    description: Mensaje en stderr; stdout vacío.
    exit_code: 4
    stream: stderr
    message: el grupo no existe
  examples:
  - command: /home/learner/aso/p13/miembros-grupo.sh p13g
    stdout: 'primarios: p13g1 p13g2

      secundarios: p13g0 p13g3

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p13/miembros-grupo.sh
    stdout: ''
    stderr: 'uso: miembros-grupo.sh GRUPO

      '
    exit_code: 1
  - command: /home/learner/aso/p13/miembros-grupo.sh nadie
    stdout: ''
    stderr: 'el grupo no existe

      '
    exit_code: 4
  evaluations:
  - id: grupos
    description: Cruza /etc/group y /etc/passwd.
    points: 6
    checks:
    - type: run
      args:
      - p13g
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'primarios: p13g1 p13g2

          secundarios: p13g0 p13g3'
      stderr:
        match: empty
      prepare: 'getent group p13g >/dev/null || groupadd p13g

        id p13g1 >/dev/null 2>&1 || useradd -M -g p13g p13g1

        id p13g2 >/dev/null 2>&1 || useradd -M -g p13g p13g2

        id p13g3 >/dev/null 2>&1 || useradd -M p13g3

        id p13g0 >/dev/null 2>&1 || useradd -M p13g0

        gpasswd -M p13g3,p13g0 p13g >/dev/null'
    - type: run
      args:
      - root
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: 'printf ''primarios: %s\nsecundarios: -\n'' "$(awk -F: ''$4==0{print
          $1}'' /etc/passwd | sort | xargs)"'
      stderr:
        match: empty
    - type: run
      args:
      - wheel
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'primarios: -

          secundarios: -'
      stderr:
        match: empty
      prepare: gpasswd -M '' wheel >/dev/null
  - id: error-uso
    description: 'Rechaza la entrada: Recibe exactamente un grupo.'
    points: 2
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: miembros-grupo.sh GRUPO'
  - id: error-grupo
    description: 'Rechaza la entrada: El grupo existe.'
    points: 2
    checks:
    - type: run
      args:
      - nadie
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: grupo
      stderr:
        match: exact
        value: el grupo no existe
    - type: run
      args:
      - whee
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: grupo
      stderr:
        match: exact
        value: el grupo no existe
