- id: alta-usuarios
  title: Alta de usuarios en lote
  description: "Crea cuentas con directorio personal y shell `/bin/bash` y les asigna\
    \ la misma contraseña sin interacción. Valida **todos** los nombres (`^[a-z_][a-z0-9_-]*$`)\
    \ antes de crear ninguna cuenta.\n    Por cada cuenta creada muestra `creado:\
    \ NOMBRE`. Si ya existe, escribe `ya existe: NOMBRE` en stderr, continúa y termina\
    \ con el código 4.\n\n**Comandos a practicar:** `useradd -m -s`, `chpasswd`, `id`\n\
    \n**Estructuras de Bash:** `shift`, `for n in \"$@\"`, doble bucle\n\n**Detalle\
    \ importante:** `passwd` es interactivo; en un script usa `echo \"usuario:clave\"\
    \ | chpasswd`. Con `sudo`, el `sudo` debe ir delante de `chpasswd`, no de `echo`."
  script:
    path: /home/learner/aso/p13/alta-usuarios.sh
    usage: alta-usuarios.sh CLAVE NOMBRE...
  input_requirements:
  - description: Recibe la clave y al menos un nombre.
    error: uso
  - description: Todos los nombres son válidos.
    error: nombre
  - description: Se ejecuta como root.
    error: permiso
  - description: Las cuentas no existen ya; si existe una, se avisa y se continúa.
