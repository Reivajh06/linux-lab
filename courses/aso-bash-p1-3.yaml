  title: Los siete campos de /etc/passwd
  description: 'Muestra los campos de un usuario leyendo `/etc/passwd` con `read`:


    ```text

    uid: 1000

    gid: 1000

    comentario: Usuario 1

    home: /home/usuario1

    shell: /bin/bash

    ```


    **Comandos a practicar:** `grep ^nombre:`, `man 5 passwd`


    **Estructuras de Bash:** `IFS=: read`, here-string `<<<`


    **Detalle importante:** Busca `^usuario:` con el ancla y los dos puntos: `ad`
    no es `adm`. El separador se cambia solo para ese `read` escribiendo `IFS=:` en
    la misma línea.'
