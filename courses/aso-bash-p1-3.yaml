- id: especiales
  title: Auditoría de SUID y SGID
  description: 'Lista, ordenados, los ficheros regulares de un directorio (sin subdirectorios)
    que tienen activado SUID (`-u`) o SGID (`-g`). Si no hay ninguno, muestra `ninguno`.


    **Comandos a practicar:** `find -maxdepth 1 -type f -perm -4000`, `sort`


    **Estructuras de Bash:** `case`, variable intermedia, `[[ -z ]]`


    **Detalle importante:** `-perm -4000` exige que **ese bit** esté activo, sin importar
    los demás; `-perm 4000` pediría exactamente ese modo. SUID es peligroso: conviene
    auditarlo.'
  script:
    path: /home/learner/aso/p13/especiales.sh
    usage: especiales.sh -u|-g DIRECTORIO
  input_requirements:
  - description: Recibe opción y directorio.
    error: uso
  - description: La opción es -u o -g.
    error: opcion
  - description: El segundo argumento es un directorio.
    error: directorio
  output_requirements:
  - id: correcto
    description: Una ruta por línea, o `ninguno`.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: especiales.sh -u|-g DIRECTORIO'
  - id: opcion
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: opción no válida
  - id: directorio
    description: Mensaje en stderr; stdout vacío.
    exit_code: 4
    stream: stderr
    message: no es un directorio
  examples:
  - command: /home/learner/aso/p13/especiales.sh -u /usr/bin
    stdout: '/usr/bin/at

      /usr/bin/chage

      /usr/bin/chfn

      /usr/bin/chsh

      /usr/bin/crontab

      /usr/bin/fusermount3

      /usr/bin/gpasswd

      /usr/bin/mount

      /usr/bin/newgrp

      /usr/bin/pam_timestamp_check

      /usr/bin/passwd

      /usr/bin/su

      /usr/bin/sudo

      /usr/bin/umount

      /usr/bin/unix_chkpwd

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p13/especiales.sh -u
    stdout: ''
    stderr: 'uso: especiales.sh -u|-g DIRECTORIO

      '
    exit_code: 1
  - command: /home/learner/aso/p13/especiales.sh -x /usr/bin
    stdout: ''
    stderr: 'opción no válida

      '
    exit_code: 2
  - command: /home/learner/aso/p13/especiales.sh -u /nada
    stdout: ''
    stderr: 'no es un directorio

      '
    exit_code: 4
  evaluations:
  - id: usr-bin
    description: Audita /usr/bin.
    points: 6
    checks:
    - type: run
      args:
      - -u
      - /usr/bin
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: find /usr/bin -maxdepth 1 -type f -perm -4000 | sort
      stderr:
        match: empty
    - type: run
      args:
      - -g
      - /usr/bin
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: find /usr/bin -maxdepth 1 -type f -perm -2000 | sort | grep
          . || echo ninguno
      stderr:
        match: empty
  - id: vacio
    description: Indica si no hay ninguno.
    points: 6
    checks:
    - type: run
      args:
      - -u
      - /etc/skel
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: ninguno
      stderr:
        match: empty
  - id: error-uso
    description: 'Rechaza la entrada: Recibe opción y directorio.'
    points: 2
    checks:
    - type: run
      args:
      - -u
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
