- id: empresa
  title: Actividad de laboratorio completa
  description: 'El apartado 8 completo en un script **idempotente**, que se puede
    ejecutar varias veces sin error:


    1. Crea `jefe`, `trabajador1`, `trabajador2` y `trabajador3` si no existen, con
    contraseña `ASO2026`.

    2. Vigencia máxima de 60 días, aviso a 4 días y gracia de 2 días para todos. Los
    trabajadores solo podrán acceder hasta el 15 de diciembre de 2026.

    3. Crea el grupo `empresa` con los cuatro como miembros secundarios y `jefe` como
    administrador.

    4. Crea `/home/trabajo`, de `jefe:empresa`, con todos los permisos para usuario
    y grupo, ninguno para otros y sticky bit.


    Termina mostrando `actividad completada`.


    **Comandos a practicar:** `useradd`, `chpasswd`, `chage`, `groupadd`, `gpasswd
    -a -A`, `install -d` o `mkdir`, `chown`, `chmod 1770`


    **Estructuras de Bash:** `for u in ...`, comprobación previa con `id` y `getent`


    **Detalle importante:** `gpasswd -A` y `usermod -G` sin `-a` **sustituyen** la
    lista completa. El modo `1770` lo revisa `ls -ld`: la `T` mayúscula indica sticky
    sin ejecución para otros.'
  script:
    path: /home/learner/aso/p13/empresa.sh
    usage: empresa.sh
  input_requirements:
  - description: No recibe argumentos.
    error: uso
  - description: Se ejecuta como root.
    error: permiso
  output_requirements:
  - id: correcto
    description: El mensaje final, con el sistema en el estado pedido.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: empresa.sh'
  - id: permiso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 3
    stream: stderr
    message: hay que ser root
  examples:
  - command: /home/learner/aso/p13/empresa.sh
    stdout: 'actividad completada

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p13/empresa.sh x
    stdout: ''
    stderr: 'uso: empresa.sh

      '
    exit_code: 1
  - command: /home/learner/aso/p13/empresa.sh
    stdout: ''
    stderr: 'hay que ser root

      '
    exit_code: 3
  evaluations:
  - id: cuentas
    description: Crea cuentas con contraseña.
    points: 6
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: root
      timeout: 30
      requirement: correcto
      stdout:
        match: exact
        value: actividad completada
      stderr:
        match: empty
      prepare: for u in jefe trabajador1 trabajador2 trabajador3; do userdel -r $u
        2>/dev/null; done; groupdel empresa 2>/dev/null; rm -rf /home/trabajo; true
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - "S=/home/learner/aso/p13/empresa.sh\nD=/home/learner/aso/p13\nfor u in jefe\
        \ trabajador1 trabajador2 trabajador3; do\n  case \"$(getent shadow $u | cut\
        \ -d: -f2)\" in ''|'!'*|'*'*) exit 1;; esac\ndone"
      cwd: /home/learner
      user: root
      timeout: 10
      requirement: correcto
  - id: politica
    description: Aplica la política.
    points: 6
    checks:
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - "S=/home/learner/aso/p13/empresa.sh\nD=/home/learner/aso/p13\nfor u in jefe\
        \ trabajador1 trabajador2 trabajador3; do\n  IFS=: read -r n c l mi ma av\
        \ in ca r <<< \"$(getent shadow $u)\"\n  [ \"$ma:$av:$in\" = 60:4:2 ] || exit\
        \ 1\n  if [ $u = jefe ]; then [ -z \"$ca\" ] || exit 1; else [ \"$ca\" = 20802\
        \ ] || exit 1; fi\ndone"
      cwd: /home/learner
      user: root
      timeout: 10
      requirement: correcto
  - id: grupo
    description: Grupo y administrador.
    points: 6
    checks:
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - "S=/home/learner/aso/p13/empresa.sh\nD=/home/learner/aso/p13\nfor u in jefe\
        \ trabajador1 trabajador2 trabajador3; do\n  id -nG $u | grep -qw empresa\
        \ || exit 1\n  [ \"$(id -gn $u)\" = \"$u\" ] || exit 1\ndone\n[ \"$(getent\
        \ gshadow empresa | cut -d: -f3)\" = jefe ]"
      cwd: /home/learner
      user: root
      timeout: 10
      requirement: correcto
  - id: directorio
    description: Directorio compartido.
    points: 6
    checks:
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - 'S=/home/learner/aso/p13/empresa.sh

        D=/home/learner/aso/p13

        [ "$(stat -c ''%a %U %G'' /home/trabajo)" = ''1770 jefe empresa'' ]'
      cwd: /home/learner
      user: root
      timeout: 10
      requirement: correcto
  - id: idempotente
    description: Se puede volver a ejecutar.
    points: 6
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: root
      timeout: 30
      requirement: correcto
      stdout:
        match: exact
        value: actividad completada
      stderr:
        match: empty
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - 'S=/home/learner/aso/p13/empresa.sh

        D=/home/learner/aso/p13

        [ "$(stat -c ''%a %U %G'' /home/trabajo)" = ''1770 jefe empresa'' ] && [ "$(getent
        gshadow empresa | cut -d: -f3)" = jefe ]'
      cwd: /home/learner
      user: root
      timeout: 10
      requirement: correcto
  - id: error-uso
    description: 'Rechaza la entrada: No recibe argumentos.'
    points: 2
    checks:
    - type: run
      args:
      - x
      cwd: /home/learner
      user: root
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: empresa.sh'
  - id: error-permiso
    description: 'Rechaza la entrada: Se ejecuta como root.'
    points: 2
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: permiso
      stderr:
        match: exact
        value: hay que ser root
