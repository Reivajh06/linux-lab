    description: 'Una línea `creado: NOMBRE` por cuenta.'
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: alta-usuarios.sh CLAVE NOMBRE...'
  - id: nombre
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: nombre de usuario no válido
  - id: permiso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 3
    stream: stderr
    message: hay que ser root
  - id: existente
    description: stdout con las cuentas creadas y stderr con las existentes.
