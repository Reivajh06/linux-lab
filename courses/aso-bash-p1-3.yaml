- id: estado-clave
  title: Estado de la contraseña en /etc/shadow
  description: 'Lee `/etc/shadow` y resume la política de una cuenta. Solo root puede
    leer ese fichero: comprueba primero que el script se ejecuta como root.


    ```text

    clave: establecida      (bloqueada si empieza por ! o *; sin clave si el campo
    está vacío)

    maximo: 30

    aviso: 5

    inactividad: 3          (- si está vacío)

    caduca: 2026-12-31      (nunca si está vacío)

    ```


    **Comandos a practicar:** `/etc/shadow`, `chage -l`, `date`, `usermod -L`, `chpasswd`


    **Estructuras de Bash:** `$EUID`, `IFS=: read`, `case` con patrones (`''!''*|''*''*`),
    `${var:--}`


    **Detalle importante:** `useradd` deja la cuenta **sin contraseña utilizable**
    (`!`), y `usermod -L` bloquea anteponiendo `!` a la clave cifrada: en ambos casos
    no se puede entrar con contraseña.'
  script:
    path: /home/learner/aso/p13/estado-clave.sh
    usage: estado-clave.sh USUARIO
  input_requirements:
  - description: Recibe exactamente un usuario.
    error: uso
  - description: Se ejecuta como root.
    error: permiso
  - description: El usuario existe.
    error: usuario
  output_requirements:
  - id: correcto
    description: Las cinco líneas de estado.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: estado-clave.sh USUARIO'
  - id: permiso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 3
    stream: stderr
    message: hay que ser root
  - id: usuario
    description: Mensaje en stderr; stdout vacío.
    exit_code: 4
    stream: stderr
    message: el usuario no existe
  examples:
  - command: /home/learner/aso/p13/estado-clave.sh p13e
    stdout: 'clave: establecida

      maximo: 30

      aviso: 5

      inactividad: 3

      caduca: 2026-12-31

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p13/estado-clave.sh
    stdout: ''
    stderr: 'uso: estado-clave.sh USUARIO

      '
    exit_code: 1
  - command: /home/learner/aso/p13/estado-clave.sh root
    stdout: ''
    stderr: 'hay que ser root

      '
    exit_code: 3
  - command: /home/learner/aso/p13/estado-clave.sh nadie
    stdout: ''
    stderr: 'el usuario no existe

      '
    exit_code: 4
