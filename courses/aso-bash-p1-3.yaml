- id: fecha-shadow
  title: Días desde 1970
  description: '`/etc/shadow` guarda las fechas como días desde el 1 de enero de 1970.
    Convierte en los dos sentidos: un número de días da `AAAA-MM-DD` y una fecha `AAAA-MM-DD`
    da el número de días.


    **Comandos a practicar:** `date -u -d`, `date +%F`, `date +%s`


    **Estructuras de Bash:** `[[ =~ ]]`, `if ! f=$(date ...)`, `$(( ))`


    **Detalle importante:** La práctica caduca las cuentas el 2026-12-15, que en `/etc/shadow`
    aparece como `20802`. Usa `-u`: con hora local un cambio de horario puede desplazar
    un día.'
