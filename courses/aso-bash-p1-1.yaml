- id: sistema
  title: Qué sistema tengo
  description: 'Lee `/etc/os-release` y muestra `NOMBRE VERSION_ID` sin comillas (por
    ejemplo `Fedora Linux 44`). Con la opción `-c` indica además si es la versión
    de la práctica: `es Fedora 44` o `no es Fedora 44`, en una segunda línea.


    **Comandos a practicar:** `source` / `.`, `/etc/os-release`


    **Estructuras de Bash:** `[[ ]]` con `&&`, `case`


    **Detalle importante:** `/etc/os-release` tiene sintaxis de asignaciones de shell,
    así que `. /etc/os-release` carga sus valores en variables sin tener que partir
    el texto.'
  script:
    path: /home/learner/aso/p11/sistema.sh
    usage: sistema.sh [-c]
  input_requirements:
  - description: Recibe como mucho la opción -c.
    error: uso
  output_requirements:
  - id: correcto
    description: Una o dos líneas de identificación.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: sistema.sh [-c]'
  examples:
  - command: /home/learner/aso/p11/sistema.sh
    stdout: 'Fedora Linux 44

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p11/sistema.sh -c
    stdout: 'Fedora Linux 44

      es Fedora 44

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p11/sistema.sh -c -c
    stdout: ''
    stderr: 'uso: sistema.sh [-c]

      '
    exit_code: 1
  evaluations:
  - id: identificacion
    description: Lee la identidad real.
    points: 6
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: awk -F= '$1=="NAME"{gsub(/"/,"",$2);n=$2} $1=="VERSION_ID"{gsub(/"/,"",$2);v=$2}
          END{print n " " v}' /etc/os-release
      stderr:
        match: empty
    - type: run
      args:
      - -c
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: contains
        value: es Fedora 44
      stderr:
        match: empty
  - id: error-uso
    description: 'Rechaza la entrada: Recibe como mucho la opción -c.'
    points: 2
    checks:
    - type: run
      args:
      - -c
      - -c
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: sistema.sh [-c]'
    - type: run
      args:
      - -x
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: sistema.sh [-c]'
  tips: []
  setup: []
