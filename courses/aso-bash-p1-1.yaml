- id: modo-arranque
  title: Modo de arranque por defecto
  description: "Muestra el target por defecto (`systemctl get-default`) seguido del\
    \ modo de arranque, separados por `: `:\n    `graphical.target: modo gráfico`,\
    \ `multi-user.target: modo texto` y, para cualquier otro, `NOMBRE: otro modo`.\n\
    \n**Comandos a practicar:** `systemctl get-default`\n\n**Estructuras de Bash:**\
    \ `case ... esac`\n\n**Detalle importante:** `systemctl set-default` no hace más\
    \ que cambiar el enlace `/etc/systemd/system/default.target`. El evaluador lo\
    \ cambia para comprobar que lees el valor real."
  script:
    path: /home/learner/aso/p11/modo-arranque.sh
    usage: modo-arranque.sh
  input_requirements:
  - description: No recibe argumentos.
    error: uso
  output_requirements:
  - id: correcto
    description: Una línea con el target y su modo.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: modo-arranque.sh'
  examples:
  - command: /home/learner/aso/p11/modo-arranque.sh
    stdout: 'graphical.target: modo gráfico

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p11/modo-arranque.sh x
    stdout: ''
    stderr: 'uso: modo-arranque.sh

      '
    exit_code: 1
  evaluations:
  - id: modos
    description: Refleja el target por defecto real.
    points: 6
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'graphical.target: modo gráfico'
      stderr:
        match: empty
      prepare: rm -f /etc/systemd/system/default.target
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'multi-user.target: modo texto'
      stderr:
        match: empty
      prepare: ln -sf /usr/lib/systemd/system/multi-user.target /etc/systemd/system/default.target
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'rescue.target: otro modo'
      stderr:
        match: empty
      prepare: ln -sf /usr/lib/systemd/system/rescue.target /etc/systemd/system/default.target
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'graphical.target: modo gráfico'
      stderr:
        match: empty
      prepare: rm -f /etc/systemd/system/default.target
  - id: error-uso
    description: 'Rechaza la entrada: No recibe argumentos.'
    points: 2
    checks:
    - type: run
      args:
      - x
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: modo-arranque.sh'
  tips: []
  setup: []
  sources:
  - document_hash: 11cb788eab069a7b8e7c0237daa4046c0b00797879244e0466ccf7402074df8d
    title: Práctica-1.1
    pages:
    - 8
    - 9
  supplemental: Se ejecuta contra los ficheros reales del sistema Fedora del laboratorio;
    la salida esperada se calcula en vivo al evaluar.
- id: interfaz
  title: Descifrar el nombre de una interfaz
  description: "Interpreta nombres predecibles como `enp0s3` (Ethernet `en`, bus PCI\
    \ `p0`, slot `s3`) y muestra `tipo=ethernet bus=0 slot=3`.\n    Acepta también\
    \ `wlp2s0`, que da `tipo=wifi bus=2 slot=0`.\n\n**Comandos a practicar:** `[[\
    \ =~ ]]`\n\n**Estructuras de Bash:** grupos de captura y `BASH_REMATCH`, `case`\n\
    \n**Detalle importante:** `BASH_REMATCH[0]` es la coincidencia completa; los grupos\
    \ empiezan en el índice 1."
  script:
    path: /home/learner/aso/p11/interfaz.sh
    usage: interfaz.sh NOMBRE
  input_requirements:
  - description: Recibe exactamente un nombre.
    error: uso
  - description: El nombre sigue el patrón enpXsY o wlpXsY.
    error: formato
  output_requirements:
  - id: correcto
    description: Una línea con tipo, bus y slot.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: interfaz.sh NOMBRE'
  - id: formato
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: nombre de interfaz no reconocido
  examples:
  - command: /home/learner/aso/p11/interfaz.sh enp0s3
    stdout: 'tipo=ethernet bus=0 slot=3

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p11/interfaz.sh
    stdout: ''
    stderr: 'uso: interfaz.sh NOMBRE

      '
    exit_code: 1
  - command: /home/learner/aso/p11/interfaz.sh eth0
    stdout: ''
    stderr: 'nombre de interfaz no reconocido

      '
    exit_code: 2
  evaluations:
  - id: nombres
    description: Descifra varios nombres.
    points: 6
    checks:
    - type: run
      args:
      - enp0s3
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: tipo=ethernet bus=0 slot=3
      stderr:
        match: empty
    - type: run
      args:
      - enp12s25
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: tipo=ethernet bus=12 slot=25
      stderr:
        match: empty
    - type: run
      args:
      - wlp2s0
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: tipo=wifi bus=2 slot=0
      stderr:
        match: empty
  - id: error-uso
    description: 'Rechaza la entrada: Recibe exactamente un nombre.'
    points: 2
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: interfaz.sh NOMBRE'
  - id: error-formato
    description: 'Rechaza la entrada: El nombre sigue el patrón enpXsY o wlpXsY.'
    points: 2
    checks:
    - type: run
      args:
      - eth0
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: formato
      stderr:
        match: exact
        value: nombre de interfaz no reconocido
    - type: run
      args:
      - enp0s
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: formato
      stderr:
        match: exact
        value: nombre de interfaz no reconocido
    - type: run
      args:
      - xenp0s3
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: formato
      stderr:
        match: exact
        value: nombre de interfaz no reconocido
  tips: []
  setup: []
  sources:
