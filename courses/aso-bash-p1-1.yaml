schema_version: 1
id: aso-bash-p1-1
version: '1.0'
title: ASO Bash 1.1 · Instalación y exploración del sistema
description: "Scripts que consultan lo que la Práctica 1.1 explica durante la instalación:\
  \ herramientas y paquetes (`whereis`, `dnf`),\n    niveles de ejecución (`systemctl`,\
  \ enlaces de `runlevelN.target`), identidad del sistema, memoria, red y ficheros\
  \ de configuración.\n    VirtualBox, el particionado real, GRUB y la recuperación\
  \ con el CD necesitan una máquina virtual y no se evalúan aquí.\n\nCada ejercicio\
  \ es un **script de Bash** en `/home/learner/aso/p11/`: empieza por `#!/bin/bash`,\
  \ hazlo ejecutable con `chmod u+x`, envía los resultados a stdout y los errores\
  \ a stderr, y usa un código de salida distinto para cada error. Los ejercicios trabajan\
  \ con ficheros y procesos reales del sistema (`/etc/passwd`, `/etc/group`, `/proc`,\
  \ `/usr/share/dict/words`...): la salida esperada se calcula al evaluar, así que\
  \ no vale escribir el resultado a mano."
setup:
- script: 'set -e

    install -d -o learner -g learner /home/learner/aso/p11

    id usuario1 >/dev/null 2>&1 || useradd -m -s /bin/bash -G wheel -c ''Usuario 1''
    usuario1

    '
  user: root
  timeout: 60
exercises:
- id: herramientas
  title: Localizar herramientas con whereis
  description: "Para cada herramienta recibida como argumento, muestra `NOMBRE: RUTA`\
    \ con la primera ruta de binario que indique `whereis -b`.\n    Si una herramienta\
    \ no está instalada, escribe `NOMBRE: no instalada` en stderr, sigue con las demás\
    \ y termina con el código 3.\n\n**Comandos a practicar:** `whereis -b`, `cut -s`\n\
    \n**Estructuras de Bash:** `for x in \"$@\"`, `[[ -z ... ]]`, `>&2`\n\n**Detalle\
    \ importante:** `whereis` imprime `nosuch:` sin espacios cuando no encuentra nada,\
    \ y `cut` devuelve la línea entera si no contiene el delimitador. Mira qué hace\
    \ `cut -s`."
  script:
    path: /home/learner/aso/p11/herramientas.sh
    usage: herramientas.sh HERRAMIENTA...
  input_requirements:
  - description: Recibe al menos una herramienta.
    error: uso
  - description: Cada herramienta debe estar instalada; si no, se avisa y se continúa.
    error: parcial
  output_requirements:
  - id: correcto
    description: 'Una línea `NOMBRE: RUTA` por herramienta.'
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: herramientas.sh HERRAMIENTA...'
  - id: parcial
    description: stdout con las herramientas encontradas y stderr con las que faltan.
    exit_code: 3
    stream: stderr
    message: 'nosuch: no instalada'
  examples:
  - command: /home/learner/aso/p11/herramientas.sh tar bzip2
    stdout: 'tar: /usr/bin/tar

      bzip2: /usr/bin/bzip2

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p11/herramientas.sh
    stdout: ''
    stderr: 'uso: herramientas.sh HERRAMIENTA...

      '
    exit_code: 1
  evaluations:
  - id: instaladas
    description: Localiza las herramientas instaladas.
    points: 6
    checks:
    - type: run
      args:
      - tar
      - bzip2
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'tar: /usr/bin/tar

          bzip2: /usr/bin/bzip2'
      stderr:
        match: empty
    - type: run
      args:
      - bash
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: 'whereis -b bash | cut -d'' '' -f2 | sed ''s/^/bash: /'''
      stderr:
        match: empty
  - id: error-uso
    description: 'Rechaza la entrada: Recibe al menos una herramienta.'
    points: 2
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: herramientas.sh HERRAMIENTA...'
  - id: error-parcial
    description: 'Rechaza la entrada: Cada herramienta debe estar instalada; si no,
      se avisa y se continúa.'
    points: 2
    checks:
    - type: run
      args:
      - tar
      - nosuch
      - bash
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: parcial
      stdout:
        match: lines
        from_command: 'whereis -b bash | cut -d'' '' -f2 | sed ''1i tar: /usr/bin/tar''
          | sed ''2s/^/bash: /'''
      stderr:
        match: exact
        value: 'nosuch: no instalada'
  tips: []
  setup: []
  sources:
  - document_hash: 11cb788eab069a7b8e7c0237daa4046c0b00797879244e0466ccf7402074df8d
    title: Práctica-1.1
    pages:
    - 6
    - 7
  supplemental: Se ejecuta contra los ficheros reales del sistema Fedora del laboratorio;
    la salida esperada se calcula en vivo al evaluar.
- id: paquetes
  title: ¿Está instalado este paquete?
  description: "Para cada paquete, muestra `NOMBRE: instalado` o `NOMBRE: no instalado`\
    \ consultando `dnf list --installed`.\n    El nombre debe cumplir `^[a-z0-9][a-z0-9+._-]*$`;\
    \ valida todos los argumentos antes de consultar ninguno.\n\n**Comandos a practicar:**\
    \ `dnf list --installed`\n\n**Estructuras de Bash:** `[[ =~ ]]`, `cmd >/dev/null\
    \ 2>&1 && ... || ...`\n\n**Detalle importante:** La salida del comando interno\
    \ no forma parte del resultado: redirige stdout **y** stderr. Un comando vale\
    \ «verdadero» cuando devuelve 0."
  script:
    path: /home/learner/aso/p11/paquetes.sh
    usage: paquetes.sh PAQUETE...
  input_requirements:
  - description: Recibe al menos un paquete.
    error: uso
  - description: Cada nombre debe tener un formato válido.
    error: nombre
  output_requirements:
  - id: correcto
    description: Una línea por paquete, en el orden recibido.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: paquetes.sh PAQUETE...'
  - id: nombre
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: nombre de paquete no válido
  examples:
  - command: /home/learner/aso/p11/paquetes.sh tar nosuch-pkg
    stdout: 'tar: instalado

      nosuch-pkg: no instalado

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p11/paquetes.sh
    stdout: ''
    stderr: 'uso: paquetes.sh PAQUETE...

      '
    exit_code: 1
  - command: /home/learner/aso/p11/paquetes.sh tar 'Mal Nombre'
    stdout: ''
    stderr: 'nombre de paquete no válido

      '
    exit_code: 2
  evaluations:
  - id: consulta
    description: Distingue paquetes instalados y ausentes.
    points: 6
    checks:
    - type: run
      args:
      - tar
      - nosuch-pkg
      - bzip2
      cwd: /home/learner
      user: learner
      timeout: 30
      requirement: correcto
      stdout:
        match: exact
        value: 'tar: instalado

          nosuch-pkg: no instalado

          bzip2: instalado'
      stderr:
        match: empty
  - id: error-uso
    description: 'Rechaza la entrada: Recibe al menos un paquete.'
    points: 2
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: paquetes.sh PAQUETE...'
  - id: error-nombre
    description: 'Rechaza la entrada: Cada nombre debe tener un formato válido.'
    points: 2
    checks:
    - type: run
      args:
      - tar
      - Mal Nombre
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: nombre
      stderr:
        match: exact
        value: nombre de paquete no válido
    - type: run
      args:
      - -x
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: nombre
      stderr:
        match: exact
        value: nombre de paquete no válido
  tips: []
  setup: []
  sources:
  - document_hash: 11cb788eab069a7b8e7c0237daa4046c0b00797879244e0466ccf7402074df8d
    title: Práctica-1.1
    pages:
    - 6
    - 7
  supplemental: Se ejecuta contra los ficheros reales del sistema Fedora del laboratorio;
    la salida esperada se calcula en vivo al evaluar.
- id: runlevel
  title: De nivel de ejecución a target
  description: 'Recibe un nivel de ejecución de 0 a 6 y muestra el nombre del target
    al que apunta el enlace simbólico real `/usr/lib/systemd/system/runlevelN.target`.


    **Comandos a practicar:** `readlink`, `ls -l`


    **Estructuras de Bash:** `[[ =~ ]]`, `(( ))`, sustitución de comandos


    **Detalle importante:** Son enlaces simbólicos, por eso `readlink` da directamente
    el nombre del target. Compruébalo con `ls -l /usr/lib/systemd/system/runlevel*.target`.'
  script:
    path: /home/learner/aso/p11/runlevel.sh
    usage: runlevel.sh NIVEL
  input_requirements:
  - description: Recibe exactamente un argumento.
    error: uso
  - description: El nivel es un número.
    error: formato
  - description: El nivel está entre 0 y 6.
    error: rango
  output_requirements:
  - id: correcto
    description: El nombre del target.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: runlevel.sh NIVEL'
  - id: formato
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: el nivel debe ser un número
  - id: rango
    description: Mensaje en stderr; stdout vacío.
    exit_code: 3
    stream: stderr
    message: el nivel debe estar entre 0 y 6
  examples:
  - command: /home/learner/aso/p11/runlevel.sh 3
    stdout: 'multi-user.target

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p11/runlevel.sh 5
    stdout: 'graphical.target

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p11/runlevel.sh
    stdout: ''
    stderr: 'uso: runlevel.sh NIVEL

      '
    exit_code: 1
  - command: /home/learner/aso/p11/runlevel.sh tres
    stdout: ''
    stderr: 'el nivel debe ser un número

      '
    exit_code: 2
  - command: /home/learner/aso/p11/runlevel.sh 7
    stdout: ''
    stderr: 'el nivel debe estar entre 0 y 6

      '
    exit_code: 3
  evaluations:
  - id: niveles
    description: Resuelve todos los niveles.
    points: 6
    checks:
    - type: run
      args:
      - '0'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: readlink /usr/lib/systemd/system/runlevel0.target
      stderr:
        match: empty
    - type: run
      args:
      - '1'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: readlink /usr/lib/systemd/system/runlevel1.target
      stderr:
        match: empty
    - type: run
      args:
      - '2'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: readlink /usr/lib/systemd/system/runlevel2.target
      stderr:
        match: empty
    - type: run
      args:
      - '3'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: readlink /usr/lib/systemd/system/runlevel3.target
      stderr:
        match: empty
    - type: run
      args:
      - '4'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: readlink /usr/lib/systemd/system/runlevel4.target
      stderr:
