    la salida esperada se calcula en vivo al evaluar.
- id: administrador
  title: ¿Puede administrar con sudo?
  description: 'Indica si un usuario pertenece al grupo `wheel`, el que da privilegios
    de administración en Fedora: `USUARIO: administrador` o `USUARIO: sin privilegios`.


    **Comandos a practicar:** `id -nG`, `grep -qw`


    **Estructuras de Bash:** `if ! comando; then`


    **Detalle importante:** Busca la palabra completa: un grupo llamado `wheelers`
    no da privilegios. `usuario1`, creado como en la instalación de la práctica, ya
    está en `wheel`.'
  script:
    path: /home/learner/aso/p11/administrador.sh
    usage: administrador.sh USUARIO
  input_requirements:
  - description: Recibe exactamente un usuario.
    error: uso
  - description: El usuario existe.
    error: usuario
  output_requirements:
  - id: correcto
    description: Una línea con el veredicto.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: administrador.sh USUARIO'
  - id: usuario
    description: Mensaje en stderr; stdout vacío.
    exit_code: 4
    stream: stderr
    message: el usuario no existe
  examples:
  - command: /home/learner/aso/p11/administrador.sh usuario1
    stdout: 'usuario1: administrador

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p11/administrador.sh daemon
    stdout: 'daemon: sin privilegios

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p11/administrador.sh
    stdout: ''
    stderr: 'uso: administrador.sh USUARIO

      '
    exit_code: 1
  - command: /home/learner/aso/p11/administrador.sh nadie
    stdout: ''
    stderr: 'el usuario no existe

      '
    exit_code: 4
  evaluations:
  - id: usuarios
    description: Distingue miembros y no miembros.
    points: 6
    checks:
    - type: run
      args:
      - usuario1
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'usuario1: administrador'
      stderr:
        match: empty
    - type: run
      args:
      - daemon
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'daemon: sin privilegios'
      stderr:
        match: empty
    - type: run
      args:
      - p11wheelers
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'p11wheelers: sin privilegios'
      stderr:
        match: empty
      prepare: getent group wheelers >/dev/null || groupadd wheelers; id p11wheelers
        >/dev/null 2>&1 || useradd -M -G wheelers p11wheelers
  - id: error-uso
    description: 'Rechaza la entrada: Recibe exactamente un usuario.'
    points: 2
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: administrador.sh USUARIO'
  - id: error-usuario
    description: 'Rechaza la entrada: El usuario existe.'
    points: 2
    checks:
    - type: run
      args:
      - nadie
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: usuario
      stderr:
        match: exact
        value: el usuario no existe
