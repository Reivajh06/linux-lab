- id: memoria
  title: RAM y swap desde /proc/meminfo
  description: 'Lee `/proc/meminfo` y muestra dos líneas: `RAM: N MiB` y `Swap: N
    MiB`, truncando la división por 1024. Si no hay swap, la segunda línea es `Swap:
    sin swap`.


    **Comandos a practicar:** `/proc/meminfo`


    **Estructuras de Bash:** `while IFS='': '' read`, `case`, `$(( ))`, redirección
    al bloque `while`


    **Detalle importante:** La práctica explica que la swap da soporte a la memoria
    virtual cuando supera a la RAM. `/proc` es un sistema de ficheros virtual: se
    lee como cualquier otro fichero.'
  script:
    path: /home/learner/aso/p11/memoria.sh
    usage: memoria.sh
  input_requirements:
  - description: No recibe argumentos.
    error: uso
  output_requirements:
  - id: correcto
    description: Las líneas de RAM y swap.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: memoria.sh'
  examples:
  - command: /home/learner/aso/p11/memoria.sh
    stdout: 'RAM: 15896 MiB

      Swap: 4096 MiB

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p11/memoria.sh x
    stdout: ''
    stderr: 'uso: memoria.sh

      '
    exit_code: 1
  evaluations:
  - id: valores
    description: Coincide con el kernel.
    points: 6
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: 'awk ''/^MemTotal:/{print "RAM: " int($2/1024) " MiB"} /^SwapTotal:/{print
          ($2 ? "Swap: " int($2/1024) " MiB" : "Swap: sin swap")}'' /proc/meminfo'
      stderr:
        match: empty
  - id: error-uso
    description: 'Rechaza la entrada: No recibe argumentos.'
    points: 2
    checks:
    - type: run
      args:
      - x
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: memoria.sh'
  tips: []
  setup: []
  sources:
