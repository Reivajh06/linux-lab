    title: Práctica-1.1
    pages:
    - 4
  supplemental: Se ejecuta contra los ficheros reales del sistema Fedora del laboratorio;
    la salida esperada se calcula en vivo al evaluar.
- id: interfaces-red
  title: Interfaces reales del sistema
  description: 'Lista por orden alfabético las interfaces de red reales a partir de
    `ip -o link`, una por línea y solo el nombre.


    **Comandos a practicar:** `ip -o link`, `cut`, `sort`


    **Estructuras de Bash:** tuberías


    **Detalle importante:** El nombre de una interfaz de contenedor aparece como `eth0@if27`:
    hay que quitar lo que sigue a `@`.'
  script:
