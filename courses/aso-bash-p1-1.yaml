- id: directiva
  title: Valor activo de una directiva
  description: "Muestra el valor de una directiva en un fichero de configuración con\
    \ formato `CLAVE VALOR`. Las líneas comentadas no cuentan y, si la clave aparece\
    \ varias veces, gana la última.\n    La práctica edita así `PermitRootLogin` en\
    \ `sshd_config`; aquí se prueba con `/etc/login.defs`, el fichero real de valores\
    \ por defecto.\n\n**Comandos a practicar:** `grep -E`, `tail -n 1`, `tr -s`, `cut`\n\
    \n**Estructuras de Bash:** `[[ -f ]]`, sustitución de comandos\n\n**Detalle importante:**\
    \ Una línea que empieza por `#` no tiene efecto: `#PermitRootLogin prohibit-password`\
    \ no es la configuración activa. Ancla bien el patrón para que `UID_MIN` no coincida\
    \ con `SUB_UID_MIN`."
  script:
    path: /home/learner/aso/p11/directiva.sh
    usage: directiva.sh CLAVE FICHERO
  input_requirements:
  - description: Recibe clave y fichero.
    error: uso
  - description: El fichero existe y es regular.
    error: fichero
  - description: La clave está activa en el fichero.
    error: clave
  output_requirements:
  - id: correcto
    description: El valor de la directiva.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: directiva.sh CLAVE FICHERO'
  - id: fichero
    description: Mensaje en stderr; stdout vacío.
    exit_code: 4
    stream: stderr
    message: el fichero no existe
  - id: clave
    description: Mensaje en stderr; stdout vacío.
    exit_code: 5
    stream: stderr
    message: directiva no encontrada
  examples:
  - command: /home/learner/aso/p11/directiva.sh UID_MIN /etc/login.defs
    stdout: '1000

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p11/directiva.sh UMASK
    stdout: ''
    stderr: 'uso: directiva.sh CLAVE FICHERO

      '
    exit_code: 1
  - command: /home/learner/aso/p11/directiva.sh UMASK /etc/nada
    stdout: ''
    stderr: 'el fichero no existe

      '
    exit_code: 4
  - command: /home/learner/aso/p11/directiva.sh NO_EXISTE /etc/login.defs
    stdout: ''
    stderr: 'directiva no encontrada

      '
    exit_code: 5
  evaluations:
  - id: login-defs
    description: Lee /etc/login.defs.
    points: 6
    checks:
    - type: run
      args:
      - UMASK
      - /etc/login.defs
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: awk '$1=="UMASK"{v=$2} END{print v}' /etc/login.defs
      stderr:
        match: empty
    - type: run
      args:
      - UID_MIN
      - /etc/login.defs
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: awk '$1=="UID_MIN"{v=$2} END{print v}' /etc/login.defs
      stderr:
        match: empty
    - type: run
      args:
      - UID_MAX
      - /etc/login.defs
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: awk '$1=="UID_MAX"{v=$2} END{print v}' /etc/login.defs
      stderr:
        match: empty
  - id: comentada
    description: Ignora comentarios y se queda con la última.
    points: 6
    checks:
    - type: run
      args:
      - PermitRootLogin
      - /home/learner/aso/p11/sshd_config
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'yes'
      stderr:
        match: empty
      prepare: 'printf ''#PermitRootLogin prohibit-password\nPermitRootLogin no\nPermitRootLogin
        yes\nXPermitRootLogin never\n'' > /home/learner/aso/p11/sshd_config; chown
        learner: /home/learner/aso/p11/sshd_config'
  - id: error-uso
    description: 'Rechaza la entrada: Recibe clave y fichero.'
    points: 2
    checks:
    - type: run
      args:
      - UMASK
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: directiva.sh CLAVE FICHERO'
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: directiva.sh CLAVE FICHERO'
  - id: error-fichero
    description: 'Rechaza la entrada: El fichero existe y es regular.'
    points: 2
    checks:
    - type: run
      args:
      - UMASK
      - /etc/nada
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: fichero
      stderr:
        match: exact
        value: el fichero no existe
    - type: run
      args:
      - UMASK
      - /etc
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: fichero
      stderr:
        match: exact
        value: el fichero no existe
  - id: error-clave
    description: 'Rechaza la entrada: La clave está activa en el fichero.'
    points: 2
    checks:
    - type: run
      args:
      - NO_EXISTE
      - /etc/login.defs
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: clave
      stderr:
        match: exact
        value: directiva no encontrada
    - type: run
      args:
      - PermitRootLogin
      - /home/learner/aso/p11/inactiva
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: clave
      stderr:
        match: exact
        value: directiva no encontrada
      prepare: 'printf ''#PermitRootLogin yes\n'' > /home/learner/aso/p11/inactiva;
        chown learner: /home/learner/aso/p11/inactiva'
  tips: []
  setup: []
  sources:
