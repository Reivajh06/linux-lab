- id: autonomos-1
  title: 10 · Autónomos 1–5
  description: 'Cada apartado requiere su propio script ejecutable con shebang #!/bin/bash. No recibe
    argumentos salvo indicación expresa. Mantén el orden del fichero de entrada salvo que se pida ordenar.
    Para ordenar usa la configuración regional del contenedor.


    **autonomo-01** — Guardar el listado recursivo de /etc en listado.txt y los errores de acceso en errores.txt,
    ambos dentro de /home/learner/aso/p12. No mostrar nada en pantalla. Los errores de acceso son previstos:
    termina con código 0 tras guardar ambos canales. Guarda el comando en /home/learner/aso/p12/autonomo-01.sh.


    **autonomo-02** — Mostrar la sexta línea de /etc/passwd. Guarda el comando en /home/learner/aso/p12/autonomo-02.sh.


    **autonomo-03** — Enumerar los shells sin repeticiones, ordenados alfabéticamente. Guarda el comando
    en /home/learner/aso/p12/autonomo-03.sh.


    **autonomo-04** — Contar los elementos de /home/learner/aso/p12/boot-muestra cuyo nombre contiene
    al menos una mayúscula; adaptación de /boot. Guarda el comando en /home/learner/aso/p12/autonomo-04.sh.


    **autonomo-05** — Listar alfabéticamente los usuarios cuyo shell no es /bin/bash. Guarda el comando
    en /home/learner/aso/p12/autonomo-05.sh.'
  evaluations:
  - id: autonomo-01
    description: Guardar el listado recursivo de /etc en listado.txt y los errores de acceso en errores.txt,
      ambos dentro de /home/learner/aso/p12. No mostrar nada en pantalla.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/autonomo-01.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: empty
    - type: command
      script: 'work=$(mktemp -d)

        ls -R /etc > "$work/out" 2> "$work/err"

        cmp /home/learner/aso/p12/listado.txt "$work/out" && cmp /home/learner/aso/p12/errores.txt "$work/err"

        rc=$?

        rm -f "$work/out" "$work/err"

        rmdir "$work"

        exit "$rc"'
      user: learner
  - id: autonomo-02
    description: Mostrar la sexta línea de /etc/passwd.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/autonomo-02.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: sed -n '6p' /etc/passwd
  - id: autonomo-03
    description: Enumerar los shells sin repeticiones, ordenados alfabéticamente.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/autonomo-03.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: 'cut -d: -f7 /etc/passwd | sort -u'
  - id: autonomo-04
    description: "Cuenta los nombres con mayúsculas en boot-muestra"
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/autonomo-04.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: find /home/learner/aso/p12/boot-muestra -mindepth 1 -maxdepth 1 -printf '%f\n' |
          grep -c '[A-Z]'
  - id: autonomo-05
    description: Listar alfabéticamente los usuarios cuyo shell no es /bin/bash.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/autonomo-05.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: 'awk -F: ''$7!="/bin/bash" {print $1}'' /etc/passwd | sort'
  tips:
  - Consulta man cut, man sort, man uniq, man grep, man wc y man bash.
- id: autonomos-2
  title: 10 · Autónomos 6–8 y 10
  description: 'Cada apartado requiere su propio script ejecutable con shebang #!/bin/bash. No recibe
    argumentos salvo indicación expresa. Mantén el orden del fichero de entrada salvo que se pida ordenar.
    Para ordenar usa la configuración regional del contenedor.


    **autonomo-06** — Contar dispositivos directamente en /dev y subdirectorios. Dos líneas: bloque: N
    y caracter: N. Guarda el comando en /home/learner/aso/p12/autonomo-06.sh.


    **autonomo-07** — Mostrar texto.txt sin los comentarios desde # hasta fin de línea, conservando líneas
    y espacios restantes. Guarda el comando en /home/learner/aso/p12/autonomo-07.sh.


    **autonomo-08** — Mostrar nombres de ficheros regulares homónimos directamente en /usr/bin y /etc,
    uno por línea y ordenados. Los enlaces simbólicos no cuentan. Guarda el comando en /home/learner/aso/p12/autonomo-08.sh.


    **autonomo-10** — Extraer los correos habituales de texto.txt en orden de aparición, uno por línea;
    admitir guiones, puntos y guiones bajos. Guarda el comando en /home/learner/aso/p12/autonomo-10.sh.'
  evaluations:
  - id: autonomo-06
    description: 'Contar dispositivos directamente en /dev y subdirectorios. Dos líneas: bloque: N y caracter:
      N.'
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/autonomo-06.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: 'printf ''bloque: %s\n'' "$(find /dev -type b 2>/dev/null | wc -l)"

          printf ''caracter: %s\n'' "$(find /dev -type c 2>/dev/null | wc -l)"'
  - id: autonomo-07
    description: 'Mostrar texto.txt sin los comentarios desde # hasta fin de línea, conservando líneas
      y espacios restantes.'
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/autonomo-07.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: sed 's/#.*//' /home/learner/aso/p12/texto.txt
  - id: autonomo-08
    description: Mostrar nombres de ficheros regulares homónimos directamente en /usr/bin y /etc, uno
      por línea y ordenados. Los enlaces simbólicos no cuentan.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/autonomo-08.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: comm -12 <(find /usr/bin -maxdepth 1 -type f -printf '%f\n' | sort) <(find /etc
          -maxdepth 1 -type f -printf '%f\n' | sort)
  - id: autonomo-10
    description: Extraer los correos habituales de texto.txt en orden de aparición, uno por línea; admitir
      guiones, puntos y guiones bajos.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/autonomo-10.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: grep -Eo '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' /home/learner/aso/p12/texto.txt
  tips:
  - Consulta man cut, man sort, man uniq, man grep, man wc y man bash.
- id: autonomo-09
  title: 10.9 · Apariciones de una palabra
  description: "Cuenta cuántas veces aparece PALABRA como palabra completa en FICHERO, distinguiendo mayúsculas y minúsculas. Cuenta por separado las apariciones de una misma línea; por ejemplo, «hola-mundo» contiene una aparición de «hola».\n\nCrea el script ejecutable /home/learner/aso/p12/autonomo-09.sh con shebang #!/bin/bash."
  script:
    path: /home/learner/aso/p12/autonomo-09.sh
    usage: autonomo-09.sh PALABRA FICHERO
  input_requirements:
  - description: "Exactamente dos argumentos."
    error: uso
  - description: "PALABRA contiene una o más letras ASCII (a–z o A–Z), sin espacios ni otros caracteres."
    error: formato
  - description: "FICHERO existe, es regular y se puede leer."
    error: fichero
  output_requirements:
  - id: ok
    description: "Imprime por stdout solo el número total de apariciones de PALABRA, seguido de un salto de línea; si no aparece, imprime `0`."
    exit_code: 0
    stream: stdout
  - id: uso
    description: "No se han recibido exactamente dos argumentos."
    exit_code: 1
    stream: stderr
    message: 'uso: autonomo-09.sh PALABRA FICHERO'
  - id: formato
    description: "PALABRA está vacía o contiene algún carácter que no es una letra ASCII."
    exit_code: 2
    stream: stderr
    message: la palabra debe contener solo letras
  - id: fichero
    description: "FICHERO no existe, no es regular o no se puede leer."
    exit_code: 4
    stream: stderr
    message: el fichero no existe o no es legible
  examples:
  - command: ./autonomo-09.sh hola texto.txt
    exit_code: 0
    stdout: '5
  
      '
  - command: ./autonomo-09.sh zzzz texto.txt
    exit_code: 0
    stdout: '0
  
      '
  - command: ./autonomo-09.sh
    stderr: 'uso: autonomo-09.sh PALABRA FICHERO
  
      '
    exit_code: 1
  evaluations:
  - id: correcto-1
    description: "Cuenta las cinco apariciones completas de «hola»"
    points: 2
    checks:
    - type: run
      args:
      - hola
      - /home/learner/aso/p12/texto.txt
      requirement: ok
      stdout:
        match: exact
        value: '5

          '
      stderr:
        match: empty
  - id: correcto-2
    description: "Devuelve cero cuando no aparece «zzzz»"
    points: 2
    checks:
    - type: run
      args:
      - zzzz
      - /home/learner/aso/p12/texto.txt
      requirement: ok
      stdout:
        match: exact
        value: '0

          '
      stderr:
        match: empty
  - id: uso
    description: "Sin argumentos → error de uso"
    points: 2
    checks:
    - type: run
      args: []
      requirement: uso
  - id: formato
    description: "Un punto en PALABRA → error de formato"
    points: 2
    checks:
    - type: run
      args:
      - ho.la
      - /home/learner/aso/p12/texto.txt
      requirement: formato
  - id: fichero
    description: "Fichero inexistente → error de fichero"
    points: 2
    checks:
    - type: run
      args:
      - hola
      - /home/learner/aso/p12/ausente
      requirement: fichero
  tips:
  - 'Cuenta coincidencias completas, no líneas: una misma línea puede contener varias apariciones de la
    palabra.'
