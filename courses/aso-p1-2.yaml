  user: root
exercises:
- id: ayuda-expansiones
  title: 1–6 · Ayuda, expansiones y canales
  description: 'Consulta man passwd y man 5 passwd, la ayuda breve de ls y help cd. Practica Ctrl+A, Ctrl+E
    y Ctrl+R en la terminal. En /home/learner/aso/p12/ayuda.txt escribe las secciones de manual del comando
    y del formato de passwd como «comando: 1» y «formato: 5». Crea vacíos tema1.txt a tema5.txt mediante
    expansión de llaves. Con comodines, guarda sus nombres (solo el nombre base, en orden) en temas.txt.
    Usa redirecciones para escribir «primera» y añadir «segunda» en canales.txt, una línea por palabra.'
  evaluations:
  - id: manuales
    description: "Registra las secciones del manual de passwd: comando y formato"
    points: 2
    checks:
    - type: content
      path: /home/learner/aso/p12/ayuda.txt
      value: 'comando: 1'
    - type: content
      path: /home/learner/aso/p12/ayuda.txt
      value: 'formato: 5'
  - id: expansion
    description: "Crea tema1.txt a tema5.txt"
    points: 2
    checks:
    - type: path
      path: /home/learner/aso/p12/tema1.txt
    - type: path
      path: /home/learner/aso/p12/tema2.txt
    - type: path
      path: /home/learner/aso/p12/tema3.txt
    - type: path
      path: /home/learner/aso/p12/tema4.txt
    - type: path
      path: /home/learner/aso/p12/tema5.txt
  - id: comodines
    description: "Guarda los cinco nombres de tema ordenados en temas.txt"
    points: 2
    checks:
    - type: content
      path: /home/learner/aso/p12/temas.txt
      value: 'tema1.txt

        tema2.txt

        tema3.txt

        tema4.txt

        tema5.txt

        '
      match: exact
  - id: canales
    description: "Escribe «primera» y añade «segunda» en canales.txt"
    points: 2
    checks:
    - type: content
      path: /home/learner/aso/p12/canales.txt
      value: 'primera

        segunda

        '
      match: exact
  tips:
  - 'Consulta man bash: busca Brace Expansion y Redirections.'
- id: filtros-1
  title: 7 · Filtros 1–5
  description: 'Cada apartado requiere su propio script ejecutable con shebang #!/bin/bash. No recibe
    argumentos salvo indicación expresa. Mantén el orden del fichero de entrada salvo que se pida ordenar.
    Para ordenar usa la configuración regional del contenedor.


    **filtros-01** — Mostrar el primer y el quinto campo de todas las líneas de /etc/passwd, separados
    por dos puntos. Guarda el comando en /home/learner/aso/p12/filtros-01.sh.


    **filtros-02** — Mostrar los bytes 1–3 y 5–8 de todas las líneas de /etc/passwd. Guarda el comando
    en /home/learner/aso/p12/filtros-02.sh.


    **filtros-03** — Mostrar /etc/passwd sustituyendo los dos puntos por espacios. Guarda el comando en
    /home/learner/aso/p12/filtros-03.sh.


    **filtros-04** — Mostrar todas las líneas de /etc/passwd excepto la primera. Guarda el comando en
    /home/learner/aso/p12/filtros-04.sh.


    **filtros-05** — Mostrar las tres primeras líneas de /etc/passwd, ordenadas alfabéticamente entre
    ellas. Guarda el comando en /home/learner/aso/p12/filtros-05.sh.'
  evaluations:
  - id: filtros-01
    description: Mostrar el primer y el quinto campo de todas las líneas de /etc/passwd, separados por
      dos puntos.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/filtros-01.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: 'cut -d: -f1,5 /etc/passwd'
  - id: filtros-02
    description: Mostrar los bytes 1–3 y 5–8 de todas las líneas de /etc/passwd.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/filtros-02.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: cut -b1-3,5-8 /etc/passwd
  - id: filtros-03
    description: Mostrar /etc/passwd sustituyendo los dos puntos por espacios.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/filtros-03.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: tr ':' ' ' < /etc/passwd
  - id: filtros-04
    description: Mostrar todas las líneas de /etc/passwd excepto la primera.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/filtros-04.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: tail -n +2 /etc/passwd
  - id: filtros-05
    description: Mostrar las tres primeras líneas de /etc/passwd, ordenadas alfabéticamente entre ellas.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/filtros-05.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: head -n 3 /etc/passwd | sort
  tips:
  - Consulta man cut, man sort, man uniq, man grep, man wc y man bash.
- id: filtros-2
  title: 7 · Filtros 6–10
  description: 'Cada apartado requiere su propio script ejecutable con shebang #!/bin/bash. No recibe
    argumentos salvo indicación expresa. Mantén el orden del fichero de entrada salvo que se pida ordenar.
    Para ordenar usa la configuración regional del contenedor.


    **filtros-06** — Mostrar todos los nombres de cuentas del sistema ordenados alfabéticamente. Guarda
    el comando en /home/learner/aso/p12/filtros-06.sh.


    **filtros-07** — Numerar las líneas de /etc/passwd que contienen bash (formato de nl). Guarda el comando
    en /home/learner/aso/p12/filtros-07.sh.


    **filtros-08** — Contar las líneas de /etc/passwd que contienen bash. Guarda el comando en /home/learner/aso/p12/filtros-08.sh.


    **filtros-09** — Mostrar las líneas que contienen bash ordenadas numéricamente por UID. Guarda el
    comando en /home/learner/aso/p12/filtros-09.sh.


    **filtros-10** — Mostrar los campos primero y quinto separados por dos puntos y ordenar por el segundo
    campo de la salida. Guarda el comando en /home/learner/aso/p12/filtros-10.sh.'
  evaluations:
  - id: filtros-06
    description: Mostrar todos los nombres de cuentas del sistema ordenados alfabéticamente.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/filtros-06.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: 'cut -d: -f1 /etc/passwd | sort'
  - id: filtros-07
    description: Numerar las líneas de /etc/passwd que contienen bash (formato de nl).
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/filtros-07.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: grep bash /etc/passwd | nl
  - id: filtros-08
    description: Contar las líneas de /etc/passwd que contienen bash.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/filtros-08.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: grep -c bash /etc/passwd
  - id: filtros-09
    description: Mostrar las líneas que contienen bash ordenadas numéricamente por UID.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/filtros-09.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: 'grep bash /etc/passwd | sort -t: -k3,3n'
  - id: filtros-10
    description: Mostrar los campos primero y quinto separados por dos puntos y ordenar por el segundo
      campo de la salida.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/filtros-10.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: 'cut -d: -f1,5 /etc/passwd | sort -t: -k2,2'
  tips:
  - Consulta man cut, man sort, man uniq, man grep, man wc y man bash.
- id: filtros-3
  title: 7 · Filtros 11–15
  description: 'Cada apartado requiere su propio script ejecutable con shebang #!/bin/bash. No recibe
    argumentos salvo indicación expresa. Mantén el orden del fichero de entrada salvo que se pida ordenar.
    Para ordenar usa la configuración regional del contenedor.


    **filtros-11** — Mostrar los campos primero y quinto de las líneas que contienen root; ordenar por
    el primer campo. Guarda el comando en /home/learner/aso/p12/filtros-11.sh.


    **filtros-12** — Mostrar los campos primero, tercero y quinto separados por dos puntos y ordenar por
    UID numérico. Guarda el comando en /home/learner/aso/p12/filtros-12.sh.


    **filtros-13** — Mostrar los campos primero, tercero y quinto separados por dos puntos y ordenar por
    nombre ignorando el primer carácter. Guarda el comando en /home/learner/aso/p12/filtros-13.sh.


    **filtros-14** — Mostrar los GID utilizados más de una vez, ordenados numéricamente, uno por línea.
    Guarda el comando en /home/learner/aso/p12/filtros-14.sh.


    **filtros-15** — Contar cuántos shells distintos aparecen en /etc/passwd. Guarda el comando en /home/learner/aso/p12/filtros-15.sh.'
  evaluations:
  - id: filtros-11
    description: Mostrar los campos primero y quinto de las líneas que contienen root; ordenar por el
      primer campo.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/filtros-11.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: 'grep root /etc/passwd | cut -d: -f1,5 | sort -t: -k1,1'
  - id: filtros-12
    description: Mostrar los campos primero, tercero y quinto separados por dos puntos y ordenar por UID
      numérico.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/filtros-12.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: 'cut -d: -f1,3,5 /etc/passwd | sort -t: -k2,2n'
  - id: filtros-13
    description: Mostrar los campos primero, tercero y quinto separados por dos puntos y ordenar por nombre
      ignorando el primer carácter.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/filtros-13.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: 'cut -d: -f1,3,5 /etc/passwd | sort -t: -k1.2,1'
  - id: filtros-14
    description: Mostrar los GID utilizados más de una vez, ordenados numéricamente, uno por línea.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/filtros-14.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: 'cut -d: -f4 /etc/passwd | sort -n | uniq -d'
  - id: filtros-15
    description: Contar cuántos shells distintos aparecen en /etc/passwd.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/filtros-15.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: 'cut -d: -f7 /etc/passwd | sort -u | wc -l'
  tips:
  - Consulta man cut, man sort, man uniq, man grep, man wc y man bash.
- id: regex-1
  title: 8 · Expresiones regulares 1–5
  description: 'Cada apartado requiere su propio script ejecutable con shebang #!/bin/bash. No recibe
    argumentos salvo indicación expresa. Mantén el orden del fichero de entrada salvo que se pida ordenar.
    Para ordenar usa la configuración regional del contenedor.


    **regex-01** — Palabras que empiezan por vocal (mayúscula o minúscula). Guarda el comando en /home/learner/aso/p12/regex-01.sh.


    **regex-02** — Palabras de exactamente cinco letras ASCII; excluye apóstrofos. Guarda el comando en
    /home/learner/aso/p12/regex-02.sh.


    **regex-03** — Palabras de una a cuatro letras ASCII; excluye apóstrofos. Guarda el comando en /home/learner/aso/p12/regex-03.sh.


    **regex-04** — Palabras que contienen dos vocales consecutivas. Guarda el comando en /home/learner/aso/p12/regex-04.sh.


    **regex-05** — Palabras que terminan en ing o ed. Guarda el comando en /home/learner/aso/p12/regex-05.sh.'
  evaluations:
  - id: regex-01
    description: Palabras que empiezan por vocal (mayúscula o minúscula).
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/regex-01.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: grep -E '^[AEIOUaeiou]' /usr/share/dict/words
  - id: regex-02
    description: Palabras de exactamente cinco letras ASCII; excluye apóstrofos.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/regex-02.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: grep -E '^[A-Za-z]{5}$' /usr/share/dict/words
  - id: regex-03
    description: Palabras de una a cuatro letras ASCII; excluye apóstrofos.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/regex-03.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: grep -E '^[A-Za-z]{1,4}$' /usr/share/dict/words
  - id: regex-04
    description: Palabras que contienen dos vocales consecutivas.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/regex-04.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: grep -E '[AEIOUaeiou]{2}' /usr/share/dict/words
  - id: regex-05
    description: Palabras que terminan en ing o ed.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/regex-05.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: grep -E '(ing|ed)$' /usr/share/dict/words
  tips:
  - Consulta man cut, man sort, man uniq, man grep, man wc y man bash.
- id: regex-2
  title: 8 · Expresiones regulares 6–9
  description: 'Cada apartado requiere su propio script ejecutable con shebang #!/bin/bash. No recibe
    argumentos salvo indicación expresa. Mantén el orden del fichero de entrada salvo que se pida ordenar.
    Para ordenar usa la configuración regional del contenedor.


    **regex-06** — Palabras que empiezan por vocal y terminan en tion. Guarda el comando en /home/learner/aso/p12/regex-06.sh.


    **regex-07** — Palabras que empiezan por vocal, terminan en tion y tienen como máximo ocho letras.
    Guarda el comando en /home/learner/aso/p12/regex-07.sh.


    **regex-08** — Palabras que no contienen vocales (sin distinguir mayúsculas). Guarda el comando en
    /home/learner/aso/p12/regex-08.sh.


    **regex-09** — Palabras en las que sh aparece al menos dos veces. Guarda el comando en /home/learner/aso/p12/regex-09.sh.'
  evaluations:
  - id: regex-06
    description: Palabras que empiezan por vocal y terminan en tion.
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p12/regex-06.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: lines
        from_command: grep -E '^[AEIOUaeiou].*tion$' /usr/share/dict/words
  - id: regex-07
