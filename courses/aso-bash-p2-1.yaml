- id: letra
  title: 'Actividad 1: palabras por letra'
  description: 'Actividad de laboratorio 1. Recibe una única letra, mayúscula o minúscula,
    y muestra cuántas palabras de `/usr/share/dict/words` empiezan por ella, sin distinguir
    entre ambas.


    **Comandos a practicar:** `grep -ic`


    **Estructuras de Bash:** `[[ =~ ^[A-Za-z]$ ]]`


    **Detalle importante:** Ancla con `^` y entrecomilla: `grep -ic "^$1"`. Sin el
    ancla contarías las palabras que **contienen** la letra.'
  script:
    path: /home/learner/aso/p21/letra.sh
    usage: letra.sh LETRA
  input_requirements:
  - description: Recibe exactamente un argumento.
    error: uso
  - description: El argumento es una sola letra.
    error: formato
  output_requirements:
  - id: correcto
    description: Un número.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: letra.sh LETRA'
  - id: formato
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: el argumento debe ser una letra
  examples:
  - command: /home/learner/aso/p21/letra.sh z
    stdout: '1914

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p21/letra.sh
    stdout: ''
    stderr: 'uso: letra.sh LETRA

      '
    exit_code: 1
  - command: /home/learner/aso/p21/letra.sh ab
    stdout: ''
    stderr: 'el argumento debe ser una letra

      '
    exit_code: 2
  evaluations:
  - id: letras
    description: Cuenta sin distinguir mayúsculas.
    points: 6
    checks:
    - type: run
      args:
      - a
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: grep -ic '^a' /usr/share/dict/words
      stderr:
        match: empty
    - type: run
      args:
      - A
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: grep -ic '^a' /usr/share/dict/words
      stderr:
        match: empty
    - type: run
