  description: 'Con `-u` indica si existe un usuario y con `-g` si existe un grupo:
    `existe el usuario X`, `no existe el usuario X`, `existe el grupo X` o `no existe
    el grupo X`.


    **Comandos a practicar:** `grep -q`, `getent`


    **Estructuras de Bash:** `case`, variables con la ruta y el texto


    **Detalle importante:** Busca `^nombre:`. Sin los dos puntos, `ad` coincidiría
    con `adm`; sin `^`, `dm:` también.'
