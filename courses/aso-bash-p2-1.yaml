      la ruta no existe

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p21/codigo-ls.sh
    stdout: ''
    stderr: 'uso: codigo-ls.sh RUTA

      '
    exit_code: 1
  evaluations:
