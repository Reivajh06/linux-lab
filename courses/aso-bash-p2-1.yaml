    en una línea `grupos: A B C`, con el grupo primario en primer lugar.


    **Comandos a practicar:** `id -nG`


    **Estructuras de Bash:** `if ! grupos=$(id -nG "$1" 2>/dev/null); then`


    **Detalle importante:** Puedes asignar y comprobar a la vez: una asignación con
    `$( )` devuelve el código del comando interior.'
