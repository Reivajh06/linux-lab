      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: hola.sh iteraciones'
  - id: error-formato
    description: 'Rechaza la entrada: El argumento es un entero positivo.'
    points: 2
    checks:
    - type: run
      args:
      - tres
      cwd: /home/learner
      user: learner
      timeout: 10
