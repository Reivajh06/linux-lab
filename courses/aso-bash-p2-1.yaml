      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: grep -ic '^z' /usr/share/dict/words
      stderr:
        match: empty
  - id: error-uso
    description: 'Rechaza la entrada: Recibe exactamente un argumento.'
    points: 2
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: letra.sh LETRA'
    - type: run
