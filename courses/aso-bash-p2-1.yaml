- id: suma
  title: 'Funciones: error y sumar'
  description: 'Apartado 4. Suma dos enteros positivos y muestra `Resultado: N`. Usa
    una función `error()` para los errores y una función `sumar()` para el cálculo.


    **Comandos a practicar:** `echo`


    **Estructuras de Bash:** funciones, `$(( ))`, `$(funcion args)`, `&&`


    **Detalle importante:** `return` no devuelve resultados: solo un código de 0 a
    255. Con `return $(($1+$2))`, 200+100 daría 44. La función debe **imprimir** el
    resultado y capturarlo con `$(sumar $1 $2)`.'
  script:
    path: /home/learner/aso/p21/suma.sh
    usage: suma.sh SUMANDO1 SUMANDO2
  input_requirements:
  - description: Recibe dos sumandos.
    error: uso
  - description: Ambos son enteros positivos.
    error: formato
  output_requirements:
  - id: correcto
    description: La línea con el resultado.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: suma.sh sumando1 sumando2'
  - id: formato
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: los argumentos deben ser enteros positivos
  examples:
  - command: /home/learner/aso/p21/suma.sh 200 100
    stdout: 'Resultado: 300

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p21/suma.sh 1
    stdout: ''
    stderr: 'uso: suma.sh sumando1 sumando2

      '
    exit_code: 1
  - command: /home/learner/aso/p21/suma.sh a 1
    stdout: ''
    stderr: 'los argumentos deben ser enteros positivos

      '
    exit_code: 2
  evaluations:
  - id: sumas
    description: Suma, también por encima de 255.
    points: 6
    checks:
    - type: run
      args:
      - '2'
      - '3'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'Resultado: 5'
      stderr:
        match: empty
    - type: run
      args:
      - '200'
      - '100'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'Resultado: 300'
      stderr:
        match: empty
    - type: run
      args:
      - '0'
      - '0'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'Resultado: 0'
      stderr:
        match: empty
    - type: run
      args:
      - '100000'
      - '234567'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'Resultado: 334567'
      stderr:
        match: empty
  - id: error-uso
    description: 'Rechaza la entrada: Recibe dos sumandos.'
    points: 2
    checks:
    - type: run
      args:
      - '1'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: suma.sh sumando1 sumando2'
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: suma.sh sumando1 sumando2'
    - type: run
      args:
      - '1'
      - '2'
      - '3'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: suma.sh sumando1 sumando2'
  - id: error-formato
    description: 'Rechaza la entrada: Ambos son enteros positivos.'
    points: 2
    checks:
    - type: run
      args:
      - a
      - '1'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: formato
      stderr:
        match: exact
        value: los argumentos deben ser enteros positivos
    - type: run
      args:
      - '1'
      - b
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: formato
      stderr:
        match: exact
        value: los argumentos deben ser enteros positivos
    - type: run
      args:
      - '-1'
      - '1'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: formato
      stderr:
        match: exact
        value: los argumentos deben ser enteros positivos
