- id: campos
  title: 'Actividad 2: dos campos de un fichero'
  description: 'Actividad de laboratorio 2. Muestra `CAMPO1:CAMPO2` de cada línea
    de un fichero con formato de `/etc/passwd`. El tercer argumento es opcional; por
    defecto se usa `/etc/passwd`. Los campos se muestran **en el orden pedido**.


    **Comandos a practicar:** `cut`, o `read`


    **Estructuras de Bash:** `${3:-/etc/passwd}`, `(( ))`, `||` en condiciones


    **Detalle importante:** `cut -f7,1` muestra los campos en el orden del fichero,
    no en el pedido: `cut -d: -f7,1` y `-f1,7` dan lo mismo. Hace falta otro enfoque,
    como dos `cut` o `read`.'
  script:
    path: /home/learner/aso/p21/campos.sh
    usage: campos.sh CAMPO1 CAMPO2 [FICHERO]
  input_requirements:
  - description: Recibe dos o tres argumentos.
    error: uso
  - description: Los campos son números.
    error: formato
  - description: Los campos están entre 1 y 7.
    error: rango
  - description: El fichero existe.
    error: fichero
  output_requirements:
  - id: correcto
    description: Una línea por registro.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: campos.sh CAMPO1 CAMPO2 [FICHERO]'
  - id: formato
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: los campos deben ser números
  - id: rango
    description: Mensaje en stderr; stdout vacío.
    exit_code: 3
    stream: stderr
    message: los campos deben estar entre 1 y 7
  - id: fichero
    description: Mensaje en stderr; stdout vacío.
    exit_code: 4
    stream: stderr
    message: el fichero no existe
  examples:
  - command: /home/learner/aso/p21/campos.sh 7 1 | head -n 2
    stdout: '/bin/bash:root

      /usr/sbin/nologin:bin

      '
    stderr: ''
    exit_code: 0
    description: Respeta el orden pedido.
  - command: /home/learner/aso/p21/campos.sh 1
    stdout: ''
    stderr: 'uso: campos.sh CAMPO1 CAMPO2 [FICHERO]

      '
    exit_code: 1
