- id: hola-fichero
  title: Volcar la salida a un fichero
  description: 'Apartado 3.4. Añade las líneas `k: hola, mundo` al fichero `salida.txt`
    dentro de `DIRECTORIO`, creándolo si no existe. Por pantalla muestra solo `N líneas
    añadidas`.


    **Comandos a practicar:** `mkdir -p`, `>>`, `2>/dev/null`


    **Estructuras de Bash:** `if ! mkdir -p "$dir" 2>/dev/null; then`, `$?`


    **Detalle importante:** Un comando es «verdadero» si devuelve 0, así que puedes
    integrarlo en el `if`. Sin `2>/dev/null` el mensaje de `mkdir` se mezclaría con
    el tuyo.'
  script:
    path: /home/learner/aso/p21/hola-fichero.sh
    usage: hola-fichero.sh ITERACIONES DIRECTORIO
  input_requirements:
  - description: Recibe iteraciones y directorio.
    error: uso
  - description: Las iteraciones son un entero positivo.
    error: formato
  - description: El directorio se puede crear.
    error: crear
  output_requirements:
  - id: correcto
    description: La línea de confirmación; el fichero contiene las líneas.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: hola-fichero.sh ITERACIONES DIRECTORIO'
  - id: formato
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: el argumento debe ser un entero positivo
  - id: crear
    description: Mensaje en stderr; stdout vacío.
    exit_code: 4
    stream: stderr
    message: no se ha podido crear el directorio
  examples:
  - command: /home/learner/aso/p21/hola-fichero.sh 3 /home/learner/aso/p21/salida/ejemplo
    stdout: '3 líneas añadidas

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p21/hola-fichero.sh 3
    stdout: ''
    stderr: 'uso: hola-fichero.sh ITERACIONES DIRECTORIO

      '
    exit_code: 1
  - command: /home/learner/aso/p21/hola-fichero.sh x /home/learner/aso/p21/salida
    stdout: ''
    stderr: 'el argumento debe ser un entero positivo

      '
    exit_code: 2
  - command: /home/learner/aso/p21/hola-fichero.sh 3 /proc/nada/x
    stdout: ''
    stderr: 'no se ha podido crear el directorio

      '
    exit_code: 4
  evaluations:
  - id: crea
    description: Crea el directorio y el fichero.
    points: 6
    checks:
    - type: run
      args:
      - '3'
      - /home/learner/aso/p21/salida/uno/dos
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 3 líneas añadidas
      stderr:
        match: empty
      prepare: rm -rf /home/learner/aso/p21/salida
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - 'S=/home/learner/aso/p21/hola-fichero.sh

        D=/home/learner/aso/p21

        [ "$(cat $D/salida/uno/dos/salida.txt)" = "1: hola, mundo

        2: hola, mundo

        3: hola, mundo" ]'
      cwd: /home/learner
      user: root
      timeout: 10
      requirement: correcto
  - id: anade
    description: Añade sin sobrescribir.
    points: 6
    checks:
    - type: run
      args:
      - '2'
      - /home/learner/aso/p21/salida/uno/dos
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 2 líneas añadidas
      stderr:
        match: empty
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - 'S=/home/learner/aso/p21/hola-fichero.sh

        D=/home/learner/aso/p21

        [ "$(wc -l < $D/salida/uno/dos/salida.txt)" = 5 ]'
      cwd: /home/learner
      user: root
      timeout: 10
      requirement: correcto
  - id: error-uso
    description: 'Rechaza la entrada: Recibe iteraciones y directorio.'
    points: 2
    checks:
    - type: run
      args:
      - '3'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: hola-fichero.sh ITERACIONES DIRECTORIO'
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: hola-fichero.sh ITERACIONES DIRECTORIO'
  - id: error-formato
    description: 'Rechaza la entrada: Las iteraciones son un entero positivo.'
    points: 2
    checks:
