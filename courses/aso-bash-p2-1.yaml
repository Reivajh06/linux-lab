    stdout: 'el usuario existe

      directorio bajo /home: no

      shell /bin/bash: sí

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p21/perfil.sh
    stdout: ''
    stderr: 'uso: perfil.sh USUARIO

      '
    exit_code: 1
  - command: /home/learner/aso/p21/perfil.sh nadie
    stdout: ''
    stderr: 'el usuario no existe

      '
    exit_code: 4
