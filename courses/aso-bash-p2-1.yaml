- id: codigo-ls
  title: Guardar el código de salida
  description: 'Apartado 3.4. Ejecuta `ls -l` sobre una ruta sin mostrar su salida
    ni sus errores, y muestra dos líneas: `ls devolvió N` y `la ruta existe` o `la
    ruta no existe`, según ese código. El script siempre termina con 0.


    **Comandos a practicar:** `ls -l`, `>/dev/null 2>&1`


    **Estructuras de Bash:** `$?`, guardar en variable, `(( ))`


    **Detalle importante:** `$?` es el código del **último** comando: tras un `echo`
    ya vale 0. Guárdalo en una variable justo después de ejecutar el comando que te
    interesa.'
  script:
    path: /home/learner/aso/p21/codigo-ls.sh
    usage: codigo-ls.sh RUTA
  input_requirements:
  - description: Recibe exactamente una ruta.
    error: uso
