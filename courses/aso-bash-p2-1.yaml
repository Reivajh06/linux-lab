    de dos dígitos` o `es un número de tres o más dígitos` según la cadena recibida.
    Todos son resultados normales con código 0.


    **Comandos a practicar:** `echo`


    **Estructuras de Bash:** `[[ =~ ]]`, `${#1}`, `if/elif/else` o `case`


    **Detalle importante:** `${#var}` da la longitud de la cadena. `007` tiene tres
    dígitos aunque valga 7: no compares su valor numérico.'
