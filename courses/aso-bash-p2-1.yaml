- id: interprete
  title: Shebang y permiso de ejecución
  description: 'Apartado 2. Examina un fichero real y muestra su intérprete (lo que
    sigue a `#!` en la primera línea) y si es ejecutable para quien lanza el script:


    ```text

    interprete: /bin/sh     (ninguno si no hay shebang)

    ejecutable: sí          (o no)

    ```


    **Comandos a practicar:** `head -n 1`, `file`, `chmod`


    **Estructuras de Bash:** `read`, `[[ $linea == ''#!''* ]]`, `${linea#\#!}`, `-x`


    **Detalle importante:** `./script` obedece al shebang: con `#!/bin/false` no haría
    nada. Comprueba con `file` cómo cambia la descripción de un fichero según su primera
    línea.'
  script:
    path: /home/learner/aso/p21/interprete.sh
    usage: interprete.sh FICHERO
  input_requirements:
  - description: Recibe exactamente un fichero.
    error: uso
  - description: El fichero existe y es regular.
    error: fichero
  output_requirements:
  - id: correcto
    description: Las dos líneas.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: interprete.sh FICHERO'
  - id: fichero
    description: Mensaje en stderr; stdout vacío.
    exit_code: 4
    stream: stderr
    message: el fichero no existe
  examples:
  - command: /home/learner/aso/p21/interprete.sh /usr/bin/ldd
    stdout: 'interprete: /usr/bin/bash

      ejecutable: sí

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p21/interprete.sh /etc/passwd
    stdout: 'interprete: ninguno

      ejecutable: no

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p21/interprete.sh
    stdout: ''
    stderr: 'uso: interprete.sh FICHERO

      '
    exit_code: 1
  - command: /home/learner/aso/p21/interprete.sh /nada
    stdout: ''
    stderr: 'el fichero no existe

      '
    exit_code: 4
  evaluations:
  - id: reales
    description: Examina scripts del sistema.
    points: 6
    checks:
    - type: run
      args:
      - /usr/bin/ldd
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: 'head -n 1 /usr/bin/ldd | sed ''s/^#! *//; s/^/interprete: /'';
          echo ''ejecutable: sí'''
      stderr:
        match: empty
    - type: run
      args:
      - /usr/bin/gunzip
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: 'head -n 1 /usr/bin/gunzip | sed ''s/^#! *//; s/^/interprete:
          /''; echo ''ejecutable: sí'''
      stderr:
        match: empty
  - id: sin-shebang
    description: Reconoce ficheros sin shebang.
    points: 6
    checks:
    - type: run
      args:
      - /etc/passwd
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'interprete: ninguno

          ejecutable: no'
      stderr:
        match: empty
    - type: run
      args:
      - /usr/bin/ls
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'interprete: ninguno

          ejecutable: sí'
      stderr:
        match: empty
  - id: error-uso
    description: 'Rechaza la entrada: Recibe exactamente un fichero.'
    points: 2
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: interprete.sh FICHERO'
  - id: error-fichero
    description: 'Rechaza la entrada: El fichero existe y es regular.'
    points: 2
    checks:
    - type: run
      args:
      - /nada
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: fichero
      stderr:
        match: exact
        value: el fichero no existe
    - type: run
      args:
      - /etc
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: fichero
      stderr:
        match: exact
        value: el fichero no existe
