      args:
      - x
      - /home/learner/aso/p21/salida
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: formato
      stderr:
        match: exact
        value: el argumento debe ser un entero positivo
  - id: error-crear
    description: 'Rechaza la entrada: El directorio se puede crear.'
    points: 2
    checks:
    - type: run
      args:
      - '3'
      - /proc/nada/x
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: crear
      stderr:
        match: exact
        value: no se ha podido crear el directorio
    - type: run
      args:
      - '3'
      - /etc/passwd/x
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: crear
      stderr:
        match: exact
        value: no se ha podido crear el directorio
