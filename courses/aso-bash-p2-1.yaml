- id: secundarios
  title: 'Autónomo 4: usuarios secundarios de un grupo'
  description: 'Si el grupo existe, muestra `el grupo existe` y después los usuarios
    que lo tienen como secundario, uno por línea. Si no tiene ninguno, la segunda
    línea es `sin usuarios secundarios`.


    **Comandos a practicar:** `grep`, `cut -d: -f4`, `tr '','' ''\n''`


    **Estructuras de Bash:** variable intermedia, `[[ -z ]]`


    **Detalle importante:** El cuarto campo de `/etc/group` separa los usuarios por
    comas y **no incluye** a quienes lo tienen como grupo primario.'
  script:
    path: /home/learner/aso/p21/secundarios.sh
    usage: secundarios.sh GRUPO
  input_requirements:
  - description: Recibe exactamente un grupo.
    error: uso
  - description: El grupo existe.
    error: grupo
  output_requirements:
  - id: correcto
    description: La línea de existencia y la lista.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: secundarios.sh GRUPO'
  - id: grupo
    description: Mensaje en stderr; stdout vacío.
    exit_code: 4
    stream: stderr
    message: el grupo no existe
  examples:
  - command: /home/learner/aso/p21/secundarios.sh p21g
    stdout: 'el grupo existe

      usuario1

      usuario2

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p21/secundarios.sh
    stdout: ''
    stderr: 'uso: secundarios.sh GRUPO

      '
    exit_code: 1
  - command: /home/learner/aso/p21/secundarios.sh nadie
    stdout: ''
    stderr: 'el grupo no existe

      '
    exit_code: 4
  evaluations:
  - id: grupos
    description: Muestra la lista real.
    points: 6
    checks:
    - type: run
      args:
      - p21g
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'el grupo existe

          usuario1

          usuario2'
      stderr:
        match: empty
      prepare: getent group p21g >/dev/null || groupadd p21g; gpasswd -M usuario1,usuario2
        p21g >/dev/null; getent group p21v >/dev/null || groupadd p21v
