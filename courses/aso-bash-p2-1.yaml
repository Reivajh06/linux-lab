    stdout: ''
    stderr: 'los campos deben ser números

      '
    exit_code: 2
  - command: /home/learner/aso/p21/campos.sh 0 1
    stdout: ''
    stderr: 'los campos deben estar entre 1 y 7

      '
    exit_code: 3
  - command: /home/learner/aso/p21/campos.sh 1 2 /etc/nada
    stdout: ''
    stderr: 'el fichero no existe

      '
    exit_code: 4
