schema_version: 1
id: aso-bash-p2-1
version: '1.0'
title: ASO Bash 2.1 · Programación de scripts en Bash
description: "Los scripts que desarrolla la Práctica 2.1, las dos actividades de laboratorio\
  \ y los seis ejercicios autónomos: validación de argumentos, `if`, `while`, `((\
  \ ))`, `[[ ]]`, `=~`, `$?`, funciones y sustitución de comandos.\n    Se aplican\
  \ las buenas prácticas de la hoja: validar número y formato de argumentos, limitar\
  \ la salida a lo previsto, usar el canal adecuado y un código distinto para cada\
  \ error.\n\nCada ejercicio es un **script de Bash** en `/home/learner/aso/p21/`:\
  \ empieza por `#!/bin/bash`, hazlo ejecutable con `chmod u+x`, envía los resultados\
  \ a stdout y los errores a stderr, y usa un código de salida distinto para cada\
  \ error. Los ejercicios trabajan con ficheros y procesos reales del sistema (`/etc/passwd`,\
  \ `/etc/group`, `/proc`, `/usr/share/dict/words`...): la salida esperada se calcula\
  \ al evaluar, así que no vale escribir el resultado a mano."
setup:
- script: 'set -e

    install -d -o learner -g learner /home/learner/aso/p21

    id usuario1 >/dev/null 2>&1 || useradd -m -s /bin/bash -c ''Usuario 1'' usuario1

    id usuario2 >/dev/null 2>&1 || useradd -m -s /bin/bash -c ''Usuario 2'' usuario2

    '
  user: root
  timeout: 60
exercises:
- id: hola
  title: Mensaje repetido con validación
  description: 'El script guía de los apartados 3 a 3.2: muestra `k: hola, mundo`
    tantas veces como indique el argumento, que debe ser un entero entre 2 y 20, **ambos
    incluidos**.


    **Comandos a practicar:** `echo`


    **Estructuras de Bash:** `while ((k<=$1))`, `((k++))`, `if/elif`, `[[ ! $1 =~
    ^[0-9]+$ ]]`, `$#`, `$0`, `exit`


    **Detalle importante:** Sin espacios en `mensaje="hola"`. Cuidado con los límites:
    la hoja usa `-le 2 || -ge 20`, que **excluye** el 2 y el 20 aunque el mensaje
    los admita. Aquí deben aceptarse.'
  script:
    path: /home/learner/aso/p21/hola.sh
    usage: hola.sh ITERACIONES
  input_requirements:
  - description: Recibe exactamente un argumento.
    error: uso
  - description: El argumento es un entero positivo.
    error: formato
  - description: El valor está entre 2 y 20.
    error: rango
  output_requirements:
  - id: correcto
    description: Una línea por iteración.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: hola.sh iteraciones'
  - id: formato
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: el argumento debe ser un entero positivo
  - id: rango
    description: Mensaje en stderr; stdout vacío.
    exit_code: 3
    stream: stderr
    message: el argumento debe estar entre 2 y 20
  examples:
  - command: /home/learner/aso/p21/hola.sh 3
    stdout: '1: hola, mundo

      2: hola, mundo

      3: hola, mundo

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p21/hola.sh
    stdout: ''
    stderr: 'uso: hola.sh iteraciones

      '
    exit_code: 1
  - command: /home/learner/aso/p21/hola.sh tres
    stdout: ''
    stderr: 'el argumento debe ser un entero positivo

      '
    exit_code: 2
  - command: /home/learner/aso/p21/hola.sh 1
    stdout: ''
    stderr: 'el argumento debe estar entre 2 y 20

      '
    exit_code: 3
  evaluations:
  - id: iteraciones
    description: Repite el mensaje, incluidos los límites.
    points: 6
    checks:
    - type: run
      args:
      - '3'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: '1: hola, mundo

          2: hola, mundo

          3: hola, mundo'
      stderr:
        match: empty
    - type: run
      args:
      - '2'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: '1: hola, mundo

          2: hola, mundo'
      stderr:
        match: empty
    - type: run
      args:
      - '20'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: '1: hola, mundo

          2: hola, mundo

          3: hola, mundo

          4: hola, mundo

          5: hola, mundo

          6: hola, mundo

          7: hola, mundo

          8: hola, mundo

          9: hola, mundo

          10: hola, mundo

          11: hola, mundo

          12: hola, mundo

          13: hola, mundo

          14: hola, mundo

          15: hola, mundo

          16: hola, mundo

          17: hola, mundo

          18: hola, mundo

          19: hola, mundo

          20: hola, mundo'
      stderr:
