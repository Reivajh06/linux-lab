- id: perfil
  title: 'Autónomo 6: home y shell de un usuario'
  description: 'Si el usuario existe, muestra tres líneas:


    ```text

    el usuario existe

    directorio bajo /home: sí      (o no)

    shell /bin/bash: sí            (o no)

    ```


    **Comandos a practicar:** `grep`, `cut`


    **Estructuras de Bash:** `[[ $home == /home/* ]]`, `IFS=: read`, `<<<`, `&& ...
    || ...`


    **Detalle importante:** El comodín de `[[ == ]]` funciona solo **sin comillas**
    en el patrón. Y `/homeless/x` empieza por `/home` pero no está bajo `/home`: incluye
    la barra.'
