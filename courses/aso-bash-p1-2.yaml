schema_version: 1
id: aso-bash-p1-2
version: '1.0'
title: ASO Bash 1.2 · Filtros, tuberías y expresiones regulares
description: "Los ejercicios 7, 8 y 10 de la Práctica 1.2 convertidos en scripts:\
  \ `cut`, `sort`, `uniq`, `tr`, `grep`, `head`, `tail`, `wc`, `nl`,\n    redirecciones\
  \ y comodines sobre `/etc/passwd`, `/etc`, `/dev`, `/usr/bin` y `/usr/share/dict/words`.\n\
  \    La actividad del CSV de portátiles se omite porque depende de un fichero externo:\
  \ está en el curso `aso-p1-2`.\n\nCada ejercicio es un **script de Bash** en `/home/learner/aso/p12/`:\
  \ empieza por `#!/bin/bash`, hazlo ejecutable con `chmod u+x`, envía los resultados\
  \ a stdout y los errores a stderr, y usa un código de salida distinto para cada\
  \ error. Los ejercicios trabajan con ficheros y procesos reales del sistema (`/etc/passwd`,\
  \ `/etc/group`, `/proc`, `/usr/share/dict/words`...): la salida esperada se calcula\
  \ al evaluar, así que no vale escribir el resultado a mano."
setup:
- script: 'set -e

    install -d -o learner -g learner /home/learner/aso/p12

    id usuario1 >/dev/null 2>&1 || useradd -m -s /bin/bash -c ''Usuario 1'' usuario1

    id usuario2 >/dev/null 2>&1 || useradd -m -s /bin/bash -c ''Usuario 2'' usuario2

    '
  user: root
  timeout: 60
exercises:
- id: filtros-a
  title: Ejercicios de filtros 1–8
  description: 'Un único script que resuelve los ejercicios 1 a 8 del apartado 7 sobre
    `/etc/passwd`, según el número recibido:


    1. Primer y quinto campo de cada línea.

    2. Bytes del 1 al 3 y del 5 al 8 de cada línea.

    3. El fichero con los dos puntos sustituidos por un espacio.

    4. Todas las líneas menos la primera.

    5. Las tres primeras líneas del fichero, ordenadas alfabéticamente.

    6. Los nombres de las cuentas, ordenados alfabéticamente.

    7. Listado numerado (con `nl`) de las líneas que contienen `bash`.

    8. Cuántas líneas contienen `bash`.


    **Comandos a practicar:** `cut -d -f`, `cut -b`, `tr`, `tail -n +K`, `head`, `sort`,
    `nl`, `grep -c`


    **Estructuras de Bash:** `case ... esac`, `[[ =~ ]]`, función `error()`


    **Detalle importante:** `tail -n +2` significa «desde la línea 2»; `tail -n 2`
    son las dos últimas. `grep bash | wc -l` y `grep -c bash` dan lo mismo: usa el
    comando más sencillo.'
  script:
    path: /home/learner/aso/p12/filtros-a.sh
    usage: filtros-a.sh N
  input_requirements:
  - description: Recibe exactamente un número.
    error: uso
  - description: El argumento es un número.
    error: formato
  - description: El número está entre 1 y 8.
    error: rango
  output_requirements:
  - id: correcto
    description: La salida del ejercicio pedido.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: filtros-a.sh N'
  - id: formato
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: N debe ser un número
  - id: rango
    description: Mensaje en stderr; stdout vacío.
    exit_code: 3
    stream: stderr
    message: N debe estar entre 1 y 8
  examples:
  - command: /home/learner/aso/p12/filtros-a.sh 8
    stdout: '5

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p12/filtros-a.sh 5
    stdout: 'bin:x:1:1:bin:/bin:/usr/sbin/nologin

      daemon:x:2:2:daemon:/sbin:/usr/sbin/nologin

      root:x:0:0:Super User:/root:/bin/bash

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p12/filtros-a.sh
    stdout: ''
    stderr: 'uso: filtros-a.sh N

      '
    exit_code: 1
  - command: /home/learner/aso/p12/filtros-a.sh dos
    stdout: ''
    stderr: 'N debe ser un número

      '
    exit_code: 2
  - command: /home/learner/aso/p12/filtros-a.sh 0
    stdout: ''
    stderr: 'N debe estar entre 1 y 8

      '
    exit_code: 3
  evaluations:
  - id: ej1
    description: Ejercicio 1.
    points: 3
    checks:
    - type: run
      args:
      - '1'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: 'cut -d: -f1,5 /etc/passwd'
      stderr:
        match: empty
  - id: ej2
    description: Ejercicio 2.
    points: 3
    checks:
    - type: run
      args:
      - '2'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: cut -b1-3,5-8 /etc/passwd
      stderr:
        match: empty
  - id: ej3
    description: Ejercicio 3.
    points: 3
    checks:
