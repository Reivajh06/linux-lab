- id: listado
  title: Listado recursivo y errores separados
  description: "Ejercicio autónomo 1. Guarda un listado recursivo de `/etc` en el\
    \ fichero `LISTADO` y los errores de acceso en `ERRORES`, sin mostrar nada de\
    \ `ls` por pantalla.\n    Termina con la línea `listado: N, errores: M`, con el\
    \ número de líneas de cada fichero.\n\n**Comandos a practicar:** `ls -R`, `>`,\
    \ `2>`, `wc -l <`\n\n**Estructuras de Bash:** `if ! : > fichero`\n\n**Detalle\
    \ importante:** `wc -l fichero` imprime también el nombre; `wc -l < fichero` solo\
    \ el número, porque `wc` no sabe de dónde vienen los datos."
  script:
    path: /home/learner/aso/p12/listado.sh
    usage: listado.sh LISTADO ERRORES
  input_requirements:
  - description: Recibe dos ficheros.
    error: uso
  - description: Los ficheros de salida se pueden crear.
    error: escritura
  output_requirements:
  - id: correcto
    description: La línea con los dos recuentos.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: listado.sh LISTADO ERRORES'
  - id: escritura
    description: Mensaje en stderr; stdout vacío.
    exit_code: 4
    stream: stderr
    message: no se puede escribir la salida
  examples:
  - command: /home/learner/aso/p12/listado.sh /home/learner/aso/p12/listado.txt /home/learner/aso/p12/errores.txt
    stdout: 'listado: 2029, errores: 6

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p12/listado.sh a
    stdout: ''
    stderr: 'uso: listado.sh LISTADO ERRORES

      '
    exit_code: 1
  - command: /home/learner/aso/p12/listado.sh /proc/nada/l /home/learner/aso/p12/e.txt
    stdout: ''
    stderr: 'no se puede escribir la salida

      '
    exit_code: 4
  evaluations:
  - id: separados
    description: Separa listado y errores como usuario normal.
    points: 6
    checks:
    - type: run
      args:
      - /home/learner/aso/p12/listado.txt
      - /home/learner/aso/p12/errores.txt
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: regex
        value: '^listado: [0-9]+, errores: [1-9][0-9]*$'
      stderr:
        match: empty
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - 'S=/home/learner/aso/p12/listado.sh

        D=/home/learner/aso/p12

        [ "$(wc -l < $D/listado.txt)" = "$(ls -R /etc 2>/dev/null | wc -l)" ] && [
        "$(wc -l < $D/errores.txt)" = "$(ls -R /etc 2>&1 >/dev/null | wc -l)" ] &&
        [ -s $D/errores.txt ]'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
  - id: error-uso
