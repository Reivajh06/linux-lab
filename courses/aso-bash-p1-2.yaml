  - description: Recibe exactamente un nombre.
    error: uso
  - description: El nombre tiene alguna página de manual.
    error: sin-pagina
  output_requirements:
  - id: correcto
    description: Una sección por línea.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: secciones-man.sh NOMBRE'
  - id: sin-pagina
    description: Mensaje en stderr; stdout vacío.
    exit_code: 4
    stream: stderr
    message: no hay ninguna página de manual
  examples:
  - command: /home/learner/aso/p12/secciones-man.sh passwd
    stdout: '1

      5

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p12/secciones-man.sh
    stdout: ''
    stderr: 'uso: secciones-man.sh NOMBRE

      '
    exit_code: 1
  - command: /home/learner/aso/p12/secciones-man.sh comando-que-no-existe
    stdout: ''
    stderr: 'no hay ninguna página de manual

      '
    exit_code: 4
  evaluations:
  - id: paginas
    description: Encuentra las secciones reales.
    points: 6
    checks:
    - type: run
      args:
      - passwd
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: '1

          5'
      stderr:
        match: empty
    - type: run
      args:
      - ls
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: '1'
      stderr:
        match: empty
    - type: run
      args:
      - crontab
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: man -aw crontab | grep -oE '/man[0-9]+/' | tr -dc '0-9\n' |
          sort -u
      stderr:
        match: empty
  - id: error-uso
    description: 'Rechaza la entrada: Recibe exactamente un nombre.'
    points: 2
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: secciones-man.sh NOMBRE'
  - id: error-sin-pagina
    description: 'Rechaza la entrada: El nombre tiene alguna página de manual.'
    points: 2
    checks:
    - type: run
      args:
      - comando-que-no-existe
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: sin-pagina
      stderr:
        match: exact
        value: no hay ninguna página de manual
  tips: []
  setup: []
