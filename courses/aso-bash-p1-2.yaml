- id: homonimos
  title: Ficheros homónimos
  description: 'Ejercicio autónomo 8. Lista los nombres que corresponden a **ficheros
    regulares** tanto en `/usr/bin` como en `/etc` (solo su nivel superior), ordenados.


    **Comandos a practicar:** `find -maxdepth 1 -type f -printf`, `sort`, `uniq -d`
    o `comm -12`


    **Estructuras de Bash:** tuberías, agrupación `{ ...; ...; }`


    **Detalle importante:** `ls` no distingue un fichero de un directorio con el mismo
    nombre. El evaluador deja `p12-solodir` como directorio en `/etc`: no debe aparecer.'
  script:
    path: /home/learner/aso/p12/homonimos.sh
    usage: homonimos.sh
  input_requirements:
  - description: No recibe argumentos.
    error: uso
  output_requirements:
  - id: correcto
    description: Un nombre por línea, ordenados.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: homonimos.sh'
  examples:
  - command: /home/learner/aso/p12/homonimos.sh
    stdout: 'crontab

      hostname

      p12-comun

      passwd

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p12/homonimos.sh x
    stdout: ''
    stderr: 'uso: homonimos.sh

      '
    exit_code: 1
  evaluations:
  - id: comunes
    description: Solo ficheros regulares comunes.
    points: 6
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: '{ find /usr/bin -maxdepth 1 -type f -printf ''%f\n''; find
          /etc -maxdepth 1 -type f -printf ''%f\n''; } | LC_ALL=C sort | uniq -d'
      stderr:
        match: empty
      prepare: touch /etc/p12-comun /usr/bin/p12-comun; mkdir -p /etc/p12-solodir;
        touch /usr/bin/p12-solodir
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: contains
        value: p12-comun
      stderr:
        match: empty
      prepare: touch /etc/p12-comun /usr/bin/p12-comun; mkdir -p /etc/p12-solodir;
        touch /usr/bin/p12-solodir
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - 'S=/home/learner/aso/p12/homonimos.sh

        D=/home/learner/aso/p12

        ! $S | grep -qx p12-solodir'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
  - id: error-uso
    description: 'Rechaza la entrada: No recibe argumentos.'
    points: 2
    checks:
    - type: run
      args:
      - x
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: homonimos.sh'
