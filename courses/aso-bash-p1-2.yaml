- id: expansiones
  title: Expansión de llaves
  description: "Crea en el directorio indicado (y los padres que falten), mediante\
    \ **expansión de llaves**: `tema1.txt`...`tema5.txt` vacíos, los directorios `practica1`...`practica4`\
    \ y `memoria1`...`memoria4`,\n    y los ficheros `texto1.txt`...`datos4.pdf` (todas\
    \ las combinaciones de `texto`/`datos`, 1–4 y `txt`/`pdf`). Termina mostrando\
    \ `ficheros: N` y `directorios: N`, contando lo que realmente hay.\n\n**Comandos\
    \ a practicar:** `touch`, `mkdir -p`, `{a,b}`, `{1..5}`, `find -type`, `wc -l`\n\
    \n**Estructuras de Bash:** `if ! mkdir ...; then`\n\n**Detalle importante:** Las\
    \ llaves generan nombres aunque no existan ficheros: los comodines solo seleccionan\
    \ lo que ya existe. Por eso `echo {1..3}` funciona en cualquier directorio."
  script:
    path: /home/learner/aso/p12/expansiones.sh
    usage: expansiones.sh DIRECTORIO
