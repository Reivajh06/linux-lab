- id: regex
  title: Expresiones regulares sobre el diccionario
  description: 'Muestra **cuántas** líneas de `/usr/share/dict/words` cumplen cada
    condición del apartado 8, sin distinguir mayúsculas. Una «letra» es de la `a`
    a la `z`:


    1. Empiezan por vocal.

    2. Tienen exactamente cinco letras (y nada más).

    3. Tienen entre una y cuatro letras (y nada más).

    4. Contienen dos vocales consecutivas.

    5. Terminan en `ing` o `ed`.

    6. Empiezan por vocal y terminan en `tion`.

    7. Empiezan por vocal, terminan en `tion`, tienen hasta ocho letras y solo letras.

    8. Solo tienen letras y ninguna es vocal.

    9. `sh` aparece al menos dos veces.


    **Comandos a practicar:** `grep -E`, `grep -i`, `grep -c`


    **Estructuras de Bash:** `case`, `$( )`


    **Detalle importante:** Sin anclas `^` y `$`, `[a-z]{5}` también coincide dentro
    de palabras más largas. El diccionario contiene guiones, dígitos y mayúsculas.'
  script:
    path: /home/learner/aso/p12/regex.sh
    usage: regex.sh N
  input_requirements:
  - description: Recibe exactamente un número.
    error: uso
  - description: El número está entre 1 y 9.
    error: rango
  output_requirements:
  - id: correcto
    description: Un número.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: regex.sh N'
  - id: rango
    description: Mensaje en stderr; stdout vacío.
    exit_code: 3
    stream: stderr
    message: N debe estar entre 1 y 9
  examples:
  - command: /home/learner/aso/p12/regex.sh 2
    stdout: '24124

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p12/regex.sh 7
    stdout: '80

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p12/regex.sh
    stdout: ''
    stderr: 'uso: regex.sh N

      '
    exit_code: 1
  - command: /home/learner/aso/p12/regex.sh 0
    stdout: ''
    stderr: 'N debe estar entre 1 y 9

      '
    exit_code: 3
  evaluations:
  - id: re1
    description: Condición 1.
    points: 3
    checks:
    - type: run
      args:
      - '1'
      cwd: /home/learner
      user: learner
      timeout: 30
      requirement: correcto
      stdout:
        match: lines
        from_command: grep -icE '^[aeiou]' /usr/share/dict/words
      stderr:
        match: empty
  - id: re2
    description: Condición 2.
    points: 3
    checks:
    - type: run
      args:
      - '2'
      cwd: /home/learner
      user: learner
      timeout: 30
      requirement: correcto
      stdout:
        match: lines
        from_command: grep -icE '^[a-z]{5}$' /usr/share/dict/words
      stderr:
        match: empty
  - id: re3
    description: Condición 3.
    points: 3
    checks:
    - type: run
      args:
      - '3'
      cwd: /home/learner
      user: learner
      timeout: 30
      requirement: correcto
      stdout:
        match: lines
        from_command: grep -icE '^[a-z]{1,4}$' /usr/share/dict/words
