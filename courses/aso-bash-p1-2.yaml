      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: filtros-a.sh N'
  - id: error-formato
    description: 'Rechaza la entrada: El argumento es un número.'
    points: 2
    checks:
    - type: run
      args:
      - dos
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: formato
      stderr:
