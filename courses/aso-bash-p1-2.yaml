  description: 'Dado un nombre, muestra las secciones del manual en las que tiene
    página, una por línea y ordenadas. `passwd` está en la 1 (el comando) y en la
    5 (el fichero `/etc/passwd`).


    **Comandos a practicar:** `man -aw`, `grep -o`, `sort -u`


    **Estructuras de Bash:** `if ! rutas=$(...)`


    **Detalle importante:** `man -w` da las rutas sin abrir el paginador; `-a` las
    da todas. La sección está en el directorio: `/usr/share/man/man5/passwd.5.gz`.'
