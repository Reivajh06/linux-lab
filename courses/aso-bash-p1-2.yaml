      args:
      - '3'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: 'tr : '' '' < /etc/passwd'
      stderr:
        match: empty
  - id: ej4
    description: Ejercicio 4.
    points: 3
    checks:
    - type: run
      args:
      - '4'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: tail -n +2 /etc/passwd
      stderr:
        match: empty
  - id: ej5
    description: Ejercicio 5.
    points: 3
    checks:
    - type: run
      args:
      - '5'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: head -n 3 /etc/passwd | sort
      stderr:
        match: empty
  - id: ej6
    description: Ejercicio 6.
    points: 3
    checks:
    - type: run
      args:
      - '6'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: 'cut -d: -f1 /etc/passwd | sort'
      stderr:
        match: empty
  - id: ej7
    description: Ejercicio 7.
    points: 3
    checks:
    - type: run
      args:
      - '7'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: grep bash /etc/passwd | nl
      stderr:
        match: empty
  - id: ej8
    description: Ejercicio 8.
    points: 3
    checks:
    - type: run
      args:
      - '8'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: grep -c bash /etc/passwd
      stderr:
        match: empty
  - id: error-uso
    description: 'Rechaza la entrada: Recibe exactamente un número.'
    points: 2
