  description: 'Ejercicio autónomo 9. Cuenta cuántas veces aparece una palabra completa
    en un fichero. En una misma línea puede aparecer varias veces: en `/etc/passwd`,
    la línea de `root` contiene dos.


    **Comandos a practicar:** `grep -o`, `grep -w`, `grep -F`, `wc -l`


    **Estructuras de Bash:** comillas dobles en los argumentos


    **Detalle importante:** `grep -c` cuenta **líneas**, no apariciones. `grep -o`
    deja una coincidencia por línea. Con `-F` la palabra es literal aunque contenga
    un punto.'
