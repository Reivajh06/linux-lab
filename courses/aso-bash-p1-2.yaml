    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: linea.sh N [FICHERO]'
  - id: formato
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: N debe ser un entero positivo
  - id: rango
    description: Mensaje en stderr; stdout vacío.
    exit_code: 3
    stream: stderr
    message: el fichero no tiene tantas líneas
  - id: fichero
    description: Mensaje en stderr; stdout vacío.
    exit_code: 4
    stream: stderr
    message: el fichero no existe
