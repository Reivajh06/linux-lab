- id: comodines
  title: Comodines sobre un directorio real
  description: 'Dado un directorio, muestra cuántos elementos no ocultos cumplen cada
    patrón, usando **comodines del shell**:


    ```text

    conf: N      (terminan en .conf)

    tres: N      (nombre de exactamente tres caracteres)

    a-c: N       (empiezan por a, b o c)

    ```


    **Comandos a practicar:** `*`, `?`, `[a-c]`, `shopt -s nullglob`


    **Estructuras de Bash:** vectores `f=("$1"/*.conf)`, `${#f[@]}`


