- id: dispositivos
  title: Dispositivos de bloque y de carácter
  description: 'Ejercicio autónomo 6. Muestra cuántos dispositivos de bloque y de
    carácter hay directamente en `/dev`, a partir del primer carácter de `ls -l`:


    ```text

    bloque: N

    caracter: M

    ```


    **Comandos a practicar:** `ls -l`, `grep -c ''^b''`, `grep -c ''^c''`


    **Estructuras de Bash:** sustitución de comandos


    **Detalle importante:** En un contenedor no hay discos, así que `bloque` vale
    0 y `grep -c` devuelve 1. Usa el número que imprime, no su código de salida.'
  script:
    path: /home/learner/aso/p12/dispositivos.sh
    usage: dispositivos.sh
  input_requirements:
  - description: No recibe argumentos.
    error: uso
  output_requirements:
  - id: correcto
    description: Las dos líneas de recuento.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: dispositivos.sh'
  examples:
  - command: /home/learner/aso/p12/dispositivos.sh
    stdout: 'bloque: 0

      caracter: 6

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p12/dispositivos.sh x
    stdout: ''
    stderr: 'uso: dispositivos.sh

      '
    exit_code: 1
  evaluations:
  - id: real
    description: Coincide con /dev.
    points: 6
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: lines
        from_command: 'printf ''bloque: %s\ncaracter: %s\n'' "$(find /dev -maxdepth
          1 -type b | wc -l)" "$(find /dev -maxdepth 1 -type c | wc -l)"'
      stderr:
        match: empty
  - id: error-uso
    description: 'Rechaza la entrada: No recibe argumentos.'
    points: 2
    checks:
    - type: run
      args:
      - x
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: dispositivos.sh'
