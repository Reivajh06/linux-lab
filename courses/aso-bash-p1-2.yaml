- id: filtros-b
  title: Ejercicios de filtros 9–15
  description: 'Igual que el anterior, para los ejercicios 9 a 15 del apartado 7 sobre
    `/etc/passwd`:


    9. Líneas que contienen `bash`, ordenadas por UID.

    10. Primer y quinto campo, ordenados alfabéticamente por el comentario.

    11. Primer y quinto campo de las líneas que contienen `root`, ordenados por nombre.

    12. Primer, tercer y quinto campo, ordenados por UID.

    13. Primer, tercer y quinto campo, ordenados por nombre ignorando su primer carácter.

    14. GID que se usan más de una vez.

    15. Número de shells distintos.


    **Comandos a practicar:** `sort -t -k -n`, `sort -k1.2`, `uniq -d`, `sort -u`


    **Estructuras de Bash:** `case ... esac`


    **Detalle importante:** Sin `-n`, `sort` ordena los UID como texto y `10` queda
    antes que `9`. Tras `cut -d: -f1,3,5` el UID pasa a ser el **segundo** campo.
    `uniq` solo detecta duplicados consecutivos: ordena antes.'
  script:
    path: /home/learner/aso/p12/filtros-b.sh
    usage: filtros-b.sh N
  input_requirements:
  - description: Recibe exactamente un número.
    error: uso
  - description: El número está entre 9 y 15.
    error: rango
  output_requirements:
  - id: correcto
    description: La salida del ejercicio pedido.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
