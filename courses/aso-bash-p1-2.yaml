    stdout: '3

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p12/cuenta-palabra.sh root
    stdout: ''
    stderr: 'uso: cuenta-palabra.sh PALABRA FICHERO

      '
    exit_code: 1
