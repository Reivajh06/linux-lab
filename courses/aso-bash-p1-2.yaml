  description: "Ejercicio autónomo 7. Muestra un fichero de texto sin comentarios:\
    \ un comentario va desde `#` hasta el final de la línea. El resto de cada línea\
    \ se conserva, y las líneas que eran solo comentario quedan vacías.\n    `/etc/protocols`\
    \ tiene comentarios a mitad de línea.\n\n**Comandos a practicar:** `cut -d'#'\
    \ -f1`\n\n**Estructuras de Bash:** `[[ -f ]] && [[ -r ]]`\n\n**Detalle importante:**\
    \ `grep -v '#'` borraría también las líneas con datos y un comentario al final,\
    \ que es justo lo que no se pide."
