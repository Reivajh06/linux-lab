- id: sin-bash
  title: Usuarios que no usan /bin/bash
  description: 'Ejercicio autónomo 5. Lista por orden alfabético los usuarios cuyo
    shell no es exactamente `/bin/bash`. Con la opción `-c` muestra solo cuántos son.


