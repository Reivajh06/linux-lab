- id: linea
  title: La línea N de un fichero
  description: 'Ejercicio autónomo 2, generalizado. Muestra la línea N de un fichero
    combinando `head` y `tail`. Si no se indica fichero se usa `/etc/passwd`.


    **Comandos a practicar:** `head -n`, `tail -n 1`, `wc -l`


    **Estructuras de Bash:** `${2:-valor}`, `(( ))`


    **Detalle importante:** Si N supera las líneas del fichero, `head | tail` imprime
    la **última** línea sin avisar: compruébalo antes con `wc -l`.'
