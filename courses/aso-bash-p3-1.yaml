- id: lanza
  title: Procesos en segundo plano y wait
  description: 'Apartado 7. Lanza N procesos `sleep 0.7` **en segundo plano**, espera
    a que terminen todos y muestra `lanzados: N` y `terminados: N`, contando los `wait`
    correctos.


    **Comandos a practicar:** `&`, `wait`, `$!`, `jobs`


    **Estructuras de Bash:** `for ((i=0;i<n;i++))`, vector de PID `pids+=($!)`


    **Detalle importante:** Con `&` todos corren a la vez: 5 procesos tardan unos
    0,7 s en total, no 3,5 s. Sin `wait`, el script terminaría dejándolos huérfanos.
    `$!` es el PID del último proceso lanzado en segundo plano.'
  script:
    path: /home/learner/aso/p31/lanza.sh
    usage: lanza.sh N
  input_requirements:
  - description: Recibe exactamente un número.
    error: uso
  - description: N es un entero positivo.
    error: formato
  output_requirements:
  - id: correcto
    description: Las dos líneas.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: lanza.sh N'
  - id: formato
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: N debe ser un entero positivo
  examples:
  - command: /home/learner/aso/p31/lanza.sh 3
    stdout: 'lanzados: 3

      terminados: 3

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p31/lanza.sh
    stdout: ''
    stderr: 'uso: lanza.sh N

      '
    exit_code: 1
  - command: /home/learner/aso/p31/lanza.sh x
    stdout: ''
    stderr: 'N debe ser un entero positivo

      '
    exit_code: 2
  evaluations:
  - id: concurrente
    description: Lanza en paralelo y espera.
    points: 6
    checks:
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - 'S=/home/learner/aso/p31/lanza.sh

        D=/home/learner/aso/p31

        i=$(date +%s%N); o=$($S 5); f=$(date +%s%N); ms=$(( (f-i)/1000000 )); [ "$o"
        = "lanzados: 5

        terminados: 5" ] && [ "$ms" -ge 650 ] && [ "$ms" -lt 2500 ]'
      cwd: /home/learner
      user: learner
      timeout: 20
      requirement: correcto
  - id: sin-huerfanos
    description: No deja procesos al terminar.
    points: 6
    checks:
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - 'S=/home/learner/aso/p31/lanza.sh

        D=/home/learner/aso/p31

        [ "$($S 2 | head -n 1)" = "lanzados: 2" ] && ! pgrep -u learner -f ''^sleep
        0.7$'' >/dev/null'
      cwd: /home/learner
      user: learner
      timeout: 20
      requirement: correcto
  - id: error-uso
    description: 'Rechaza la entrada: Recibe exactamente un número.'
    points: 2
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: lanza.sh N'
  - id: error-formato
    description: 'Rechaza la entrada: N es un entero positivo.'
    points: 2
