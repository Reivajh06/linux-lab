- id: hijos
  title: Procesos hijos de un PID
  description: 'Apartado 5. Muestra `PID COMANDO` de los hijos directos de un proceso,
    ordenados por PID. Si no tiene hijos, muestra `sin hijos`. Es la relación padre-hijo
    que dibuja `pstree`.


    **Comandos a practicar:** `ps --ppid`, `-o pid,comm`, `pstree`, `/proc`


    **Estructuras de Bash:** `[[ -d /proc/$1 ]]`, variable intermedia


    **Detalle importante:** `ps --ppid N` devuelve 1 si no hay coincidencias. Comprueba
    la existencia del proceso aparte: cada proceso tiene su directorio en `/proc`.'
