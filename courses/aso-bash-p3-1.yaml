- id: estado
  title: 'Ejemplo 3: procesos en un estado exacto'
  description: 'Apartado 4.3. Muestra PID, usuario y estado de los procesos cuyo estado
    es **exactamente** el indicado, sin cabecera. `S` no debe incluir `Ss` ni `S+`,
    y `T` no debe incluir `Ts`, el estado de un proceso detenido que además es líder
    de sesión. Si no hay ninguno, muestra `ninguno`.


    **Comandos a practicar:** `ps -eo pid,user,stat`, `grep -E` o `awk`


    **Estructuras de Bash:** `[[ =~ ]]`, variable intermedia, `${var:-ninguno}`


    **Detalle importante:** La hoja busca `'' S +[0-9]''` porque tras el estado hay
    un número. En una expresión regular el `+` de `S+` es un metacarácter y hay que
    escaparlo. Los códigos están en la sección *PROCESS STATE CODES* de `man ps`.'
