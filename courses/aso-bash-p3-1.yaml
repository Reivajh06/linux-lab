    stdout: "   9582 p31b     Ts\n   9583 p31b     Ts\n"
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p31/estado.sh
    stdout: ''
    stderr: 'uso: estado.sh ESTADO

      '
    exit_code: 1
  - command: /home/learner/aso/p31/estado.sh 1
    stdout: ''
    stderr: 'estado no válido

      '
    exit_code: 2
