schema_version: 1
id: aso-bash-p3-1
version: '1.0'
title: ASO Bash 3.1 · Procesos
folder: ASO Bash
description: "Consulta y controla **procesos reales** del contenedor: `ps` con `-e`,\
  \ `-o`, `-u`, `--sort` y `--no-headers`, `pgrep`, `top -b`, `kill`, señales, `&`,\
  \ `wait` y `$!`.\n    El evaluador lanza procesos `sleep` reales con las cuentas\
  \ `p31a`, `p31b`, `p31g1` y `p31g2` antes de cada caso, porque el resto de la lista\
  \ de procesos cambia de una ejecución a otra.\n    En la terminal puedes lanzar\
  \ los tuyos: `sudo runuser -u p31a -- sleep 900 &`.\n\nCada ejercicio es un **script\
  \ de Bash** en `/home/learner/aso/p31/`: empieza por `#!/bin/bash`, hazlo ejecutable\
  \ con `chmod u+x`, envía los resultados a stdout y los errores a stderr, y usa un\
  \ código de salida distinto para cada error. Los ejercicios trabajan con ficheros\
  \ y procesos reales del sistema (`/etc/passwd`, `/etc/group`, `/proc`, `/usr/share/dict/words`...):\
  \ la salida esperada se calcula al evaluar, así que no vale escribir el resultado\
  \ a mano."
setup:
- script: 'set -e

    install -d -o learner -g learner /home/learner/aso/p31

    getent group p31g >/dev/null || groupadd -g 23102 p31g

    for u in p31a p31b p31c usuario1; do id $u >/dev/null 2>&1 || useradd -m -s /bin/bash
    $u; done

    for u in p31g1 p31g2; do id $u >/dev/null 2>&1 || useradd -m -s /bin/bash -g p31g
    $u; done

    '
  user: root
  timeout: 60
exercises:
- id: procs-usuario
  title: 'Actividad 1: procesos por usuario'
  description: 'Actividad de laboratorio 1. Muestra `USUARIO: N` con el número de
    procesos de cada usuario indicado. Si un nombre no corresponde a un usuario, escribe
    `no existe: NOMBRE` en stderr, continúa y termina con el código 4.


    **Comandos a practicar:** `ps -u`, `--no-headers`, `wc -l`, `id`


    **Estructuras de Bash:** `for u in "$@"`, `continue`, sustitución de comandos


    **Detalle importante:** La cabecera de `ps` contaría como una línea más: usa `--no-headers`.
    Un usuario sin procesos existe y da 0, aunque `ps -u` devuelva 1 en ese caso.'
  script:
    path: /home/learner/aso/p31/procs-usuario.sh
    usage: procs-usuario.sh USUARIO...
  input_requirements:
  - description: Recibe al menos un usuario.
    error: uso
  - description: Cada usuario existe; si no, se avisa y se continúa.
    error: parcial
  output_requirements:
  - id: correcto
    description: Una línea por usuario.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: procs-usuario.sh USUARIO...'
  - id: parcial
    description: stdout con los válidos y stderr con los demás.
    exit_code: 4
    stream: stderr
    message: 'no existe: nadie'
  examples:
  - command: /home/learner/aso/p31/procs-usuario.sh p31a p31b
    stdout: 'p31a: 3

      p31b: 1

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p31/procs-usuario.sh
    stdout: ''
    stderr: 'uso: procs-usuario.sh USUARIO...

      '
    exit_code: 1
  evaluations:
  - id: cuentas
    description: Cuenta procesos reales.
    points: 6
    checks:
    - type: run
      args:
      - p31a
      - p31b
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'p31a: 3

          p31b: 1'
      stderr:
        match: empty
      prepare: 'pkill -KILL -u p31a ; for i in 0 1 2; do setsid setpriv --reuid=p31a
        --regid=$(id -g p31a) --init-groups sleep 900 >/dev/null 2>&1 </dev/null &
        done

        pkill -KILL -u p31b ; for i in 0; do setsid setpriv --reuid=p31b --regid=$(id
        -g p31b) --init-groups sleep 900 >/dev/null 2>&1 </dev/null & done

        pkill -KILL -u p31c ; for i in ; do setsid setpriv --reuid=p31c --regid=$(id
        -g p31c) --init-groups sleep 900 >/dev/null 2>&1 </dev/null & done

        sleep 0.4'
    - type: run
      args:
      - p31c
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'p31c: 0'
      stderr:
        match: empty
  - id: error-uso
    description: 'Rechaza la entrada: Recibe al menos un usuario.'
    points: 2
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: procs-usuario.sh USUARIO...'
  - id: error-parcial
    description: 'Rechaza la entrada: Cada usuario existe; si no, se avisa y se continúa.'
    points: 2
    checks:
    - type: run
      args:
      - nadie
      - p31a
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: parcial
      stdout:
        match: lines
        from_command: 'echo ''p31a: 3'''
      stderr:
        match: exact
        value: 'no existe: nadie'
      prepare: 'pkill -KILL -u p31a ; for i in 0 1 2; do setsid setpriv --reuid=p31a
        --regid=$(id -g p31a) --init-groups sleep 900 >/dev/null 2>&1 </dev/null &
        done

        pkill -KILL -u p31b ; for i in 0; do setsid setpriv --reuid=p31b --regid=$(id
        -g p31b) --init-groups sleep 900 >/dev/null 2>&1 </dev/null & done

        pkill -KILL -u p31c ; for i in ; do setsid setpriv --reuid=p31c --regid=$(id
        -g p31c) --init-groups sleep 900 >/dev/null 2>&1 </dev/null & done

        sleep 0.4'
  tips: []
  setup: []
  sources: []
  supplemental: Se ejecuta contra los ficheros reales del sistema Fedora del laboratorio;
    la salida esperada se calcula en vivo al evaluar.
- id: gid-umbral
  title: 'Actividad 2: grupo primario y umbral'
  description: "Actividad de laboratorio 2. Recibe un GID `G` y un mínimo `P`. Muestra\
    \ `USUARIO: N` para los usuarios cuyo grupo primario es `G` y que tienen `P` o\
    \ más procesos.\n    Si ningún usuario tiene ese GID como primario, o ninguno\
    \ llega a `P`, muestra el error correspondiente y termina.\n\n**Comandos a practicar:**\
    \ `ps -u --no-headers`, `wc -l`, `/etc/passwd`\n\n**Estructuras de Bash:** `while\
    \ IFS=: read`, `(( ))`, banderas `hay_grupo` y `hay_umbral`\n\n**Detalle importante:**\
    \ Son dos situaciones distintas y llevan códigos distintos. El grupo `p31g` tiene\
    \ GID 23102 y es primario de `p31g1` y `p31g2`."
  script:
    path: /home/learner/aso/p31/gid-umbral.sh
    usage: gid-umbral.sh G P
  input_requirements:
  - description: Recibe G y P.
    error: uso
  - description: G y P son enteros.
    error: formato
  - description: Algún usuario tiene G como grupo primario.
    error: sin-grupo
  - description: Algún usuario llega a P procesos.
    error: sin-umbral
  output_requirements:
  - id: correcto
    description: Una línea por usuario que cumple.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: gid-umbral.sh G P'
  - id: formato
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: G y P deben ser enteros
  - id: sin-grupo
    description: Mensaje en stderr; stdout vacío.
    exit_code: 4
    stream: stderr
    message: ningún usuario tiene ese grupo primario
  - id: sin-umbral
    description: Mensaje en stderr; stdout vacío.
    exit_code: 5
    stream: stderr
    message: ningún usuario llega a ese número de procesos
  examples:
  - command: /home/learner/aso/p31/gid-umbral.sh 23102 2
    stdout: 'p31g1: 3

      '
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p31/gid-umbral.sh 1
    stdout: ''
    stderr: 'uso: gid-umbral.sh G P

      '
    exit_code: 1
  - command: /home/learner/aso/p31/gid-umbral.sh a 1
    stdout: ''
    stderr: 'G y P deben ser enteros

      '
    exit_code: 2
  - command: /home/learner/aso/p31/gid-umbral.sh 99999 1
    stdout: ''
    stderr: 'ningún usuario tiene ese grupo primario

      '
    exit_code: 4
  evaluations:
  - id: umbral
    description: Filtra por GID y número de procesos.
    points: 6
    checks:
    - type: run
      args:
      - '23102'
      - '2'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'p31g1: 3'
      stderr:
        match: empty
      prepare: 'pkill -KILL -u p31g1 ; for i in 0 1 2; do setsid setpriv --reuid=p31g1
        --regid=$(id -g p31g1) --init-groups sleep 900 >/dev/null 2>&1 </dev/null
        & done

        pkill -KILL -u p31g2 ; for i in 0; do setsid setpriv --reuid=p31g2 --regid=$(id
        -g p31g2) --init-groups sleep 900 >/dev/null 2>&1 </dev/null & done

        sleep 0.4'
    - type: run
      args:
      - '23102'
      - '1'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'p31g1: 3

          p31g2: 1'
      stderr:
        match: empty
    - type: run
      args:
      - '23102'
      - '3'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: exact
        value: 'p31g1: 3'
      stderr:
        match: empty
  - id: error-uso
    description: 'Rechaza la entrada: Recibe G y P.'
    points: 2
    checks:
    - type: run
      args:
      - '1'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: gid-umbral.sh G P'
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: gid-umbral.sh G P'
  - id: error-formato
    description: 'Rechaza la entrada: G y P son enteros.'
    points: 2
    checks:
    - type: run
      args:
      - a
      - '1'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: formato
      stderr:
        match: exact
        value: G y P deben ser enteros
    - type: run
      args:
      - '1'
      - b
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: formato
      stderr:
        match: exact
        value: G y P deben ser enteros
  - id: error-sin-grupo
    description: 'Rechaza la entrada: Algún usuario tiene G como grupo primario.'
    points: 2
    checks:
    - type: run
      args:
      - '99999'
      - '1'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: sin-grupo
      stderr:
        match: exact
        value: ningún usuario tiene ese grupo primario
  - id: error-sin-umbral
    description: 'Rechaza la entrada: Algún usuario llega a P procesos.'
    points: 2
    checks:
    - type: run
      args:
      - '23102'
      - '9'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: sin-umbral
      stderr:
        match: exact
        value: ningún usuario llega a ese número de procesos
      prepare: 'pkill -KILL -u p31g1 ; for i in 0 1 2; do setsid setpriv --reuid=p31g1
        --regid=$(id -g p31g1) --init-groups sleep 900 >/dev/null 2>&1 </dev/null
        & done

        pkill -KILL -u p31g2 ; for i in 0; do setsid setpriv --reuid=p31g2 --regid=$(id
        -g p31g2) --init-groups sleep 900 >/dev/null 2>&1 </dev/null & done

        sleep 0.4'
  tips: []
  setup: []
  sources: []
  supplemental: Se ejecuta contra los ficheros reales del sistema Fedora del laboratorio;
    la salida esperada se calcula en vivo al evaluar.
- id: por-usuario
  title: 'Autónomo 1: listado ordenado por usuario'
  description: 'Ejercicio autónomo 1. Lista todos los procesos con PID, usuario y
    línea de comandos completa, ordenados por usuario y sin cabecera.


    **Comandos a practicar:** `ps -e`, `-o pid,user,cmd`, `--sort user`, `--no-headers`


    **Estructuras de Bash:** `(($#!=0))`


    **Detalle importante:** `comm` es solo el nombre del comando; `cmd` es la línea
    completa con opciones. No mezcles estilos: `ps -ef` y `ps ef` hacen cosas muy
    distintas.'
  script:
    path: /home/learner/aso/p31/por-usuario.sh
    usage: por-usuario.sh
  input_requirements:
  - description: No recibe argumentos.
    error: uso
  output_requirements:
  - id: correcto
    description: Una línea por proceso.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: por-usuario.sh'
  examples:
  - command: /home/learner/aso/p31/por-usuario.sh | tail -n 3
    stdout: "   8714 p31g2    sleep 900\n      1 root     /sbin/docker-init -- supervisord\
      \ -n -c /etc/supervisord.conf\n      7 root     /usr/bin/python3 -sP /usr/sbin/supervisord\
      \ -n -c /etc/supervisord.conf\n"
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p31/por-usuario.sh x
    stdout: ''
    stderr: 'uso: por-usuario.sh

      '
    exit_code: 1
  evaluations:
  - id: contenido
    description: Incluye la línea de comandos completa.
    points: 6
    checks:
    - type: run
      args: []
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: regex
        value: ^\s*[0-9]+\s+p31a\s+sleep 900\s*$
      stderr:
        match: empty
      prepare: 'pkill -KILL -u p31a ; for i in 0 1 2; do setsid setpriv --reuid=p31a
        --regid=$(id -g p31a) --init-groups sleep 900 >/dev/null 2>&1 </dev/null &
        done

        pkill -KILL -u p31b ; for i in 0; do setsid setpriv --reuid=p31b --regid=$(id
        -g p31b) --init-groups sleep 900 >/dev/null 2>&1 </dev/null & done

        pkill -KILL -u p31c ; for i in ; do setsid setpriv --reuid=p31c --regid=$(id
        -g p31c) --init-groups sleep 900 >/dev/null 2>&1 </dev/null & done

        sleep 0.4'
  - id: orden
    description: Agrupa y ordena por usuario.
    points: 6
    checks:
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - 'S=/home/learner/aso/p31/por-usuario.sh

        D=/home/learner/aso/p31

        $S | awk ''{print $2}'' | uniq | LC_ALL=C sort -c && [ -z "$($S | awk ''{print
        $2}'' | uniq | sort | uniq -d)" ] && [ -n "$($S)" ]'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
  - id: error-uso
    description: 'Rechaza la entrada: No recibe argumentos.'
    points: 2
    checks:
    - type: run
      args:
      - x
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: por-usuario.sh'
  tips: []
  setup: []
  sources: []
  supplemental: Se ejecuta contra los ficheros reales del sistema Fedora del laboratorio;
    la salida esperada se calcula en vivo al evaluar.
- id: mas-cpu
  title: 'Autónomo 6: los que más CPU han consumido'
  description: 'Ejercicio autónomo 6, ampliado. Muestra PID, comando y tiempo de CPU
    de los N procesos que más tiempo de CPU han consumido, de mayor a menor y sin
    cabecera. Por defecto, N es 5.


    **Comandos a practicar:** `ps -eo pid,comm,time`, `--sort -time`, `head -n`


    **Estructuras de Bash:** `${1:-5}`, `[[ =~ ]]`


    **Detalle importante:** El signo de `--sort` indica el sentido: `-time` es decreciente.
    `time` es el acumulado de CPU; `pcpu` es un porcentaje.'
  script:
    path: /home/learner/aso/p31/mas-cpu.sh
    usage: mas-cpu.sh [N]
  input_requirements:
  - description: Recibe como mucho un número.
    error: uso
  - description: N es un entero positivo.
    error: formato
  output_requirements:
  - id: correcto
    description: N líneas.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: mas-cpu.sh [N]'
  - id: formato
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: N debe ser un entero positivo
  examples:
  - command: /home/learner/aso/p31/mas-cpu.sh 2
    stdout: "     27 websockify      00:00:00\n     80 xfce4-terminal  00:00:00\n"
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p31/mas-cpu.sh 1 2
    stdout: ''
    stderr: 'uso: mas-cpu.sh [N]

      '
    exit_code: 1
  - command: /home/learner/aso/p31/mas-cpu.sh x
    stdout: ''
    stderr: 'N debe ser un entero positivo

      '
    exit_code: 2
  evaluations:
  - id: cantidad
    description: Devuelve N líneas ordenadas.
    points: 6
    checks:
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - 'S=/home/learner/aso/p31/mas-cpu.sh

        D=/home/learner/aso/p31

        [ "$($S | wc -l)" = 5 ] && [ "$($S 2 | wc -l)" = 2 ] && [ "$($S 7 | wc -l)"
        = 7 ] && $S 7 | awk ''{print $3}'' | LC_ALL=C sort -rc'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      prepare: 'pkill -KILL -u p31a ; for i in 0 1 2; do setsid setpriv --reuid=p31a
        --regid=$(id -g p31a) --init-groups sleep 900 >/dev/null 2>&1 </dev/null &
        done

        pkill -KILL -u p31b ; for i in 0; do setsid setpriv --reuid=p31b --regid=$(id
        -g p31b) --init-groups sleep 900 >/dev/null 2>&1 </dev/null & done

        pkill -KILL -u p31c ; for i in ; do setsid setpriv --reuid=p31c --regid=$(id
        -g p31c) --init-groups sleep 900 >/dev/null 2>&1 </dev/null & done

        sleep 0.4'
    - type: run
      args:
      - '1'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: correcto
      stdout:
        match: regex
        value: ^\s*[0-9]+\s+\S+\s+[0-9:-]+\s*$
      stderr:
        match: empty
  - id: error-uso
    description: 'Rechaza la entrada: Recibe como mucho un número.'
    points: 2
    checks:
    - type: run
      args:
      - '1'
      - '2'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: uso
      stderr:
        match: exact
        value: 'uso: mas-cpu.sh [N]'
  - id: error-formato
    description: 'Rechaza la entrada: N es un entero positivo.'
    points: 2
    checks:
    - type: run
      args:
      - x
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: formato
      stderr:
        match: exact
        value: N debe ser un entero positivo
    - type: run
      args:
      - '0'
      cwd: /home/learner
      user: learner
      timeout: 10
      requirement: formato
      stderr:
        match: exact
        value: N debe ser un entero positivo
  tips: []
  setup: []
  sources: []
  supplemental: Se ejecuta contra los ficheros reales del sistema Fedora del laboratorio;
    la salida esperada se calcula en vivo al evaluar.
- id: antiguos
  title: 'Autónomo 7: los procesos más antiguos'
  description: 'Ejercicio autónomo 7. Muestra PID, comando, tiempo de CPU y tiempo
    transcurrido desde su inicio de los N procesos que llevan más tiempo ejecutándose,
    del más antiguo al más reciente y sin cabecera. Por defecto, N es 10.


    **Comandos a practicar:** `ps -eo pid,comm,time,etime`, `--sort start_time`


    **Estructuras de Bash:** `${1:-10}`


    **Detalle importante:** `etime` es el tiempo transcurrido, `time` el de CPU: un
    proceso que duerme acumula mucho del primero y casi nada del segundo. El más antiguo
    es el PID 1.'
  script:
    path: /home/learner/aso/p31/antiguos.sh
    usage: antiguos.sh [N]
  input_requirements:
  - description: Recibe como mucho un número.
    error: uso
  - description: N es un entero positivo.
    error: formato
  output_requirements:
  - id: correcto
    description: N líneas, empezando por el PID 1.
    exit_code: 0
    stream: stdout
  - id: uso
    description: Mensaje en stderr; stdout vacío.
    exit_code: 1
    stream: stderr
    message: 'uso: antiguos.sh [N]'
  - id: formato
    description: Mensaje en stderr; stdout vacío.
    exit_code: 2
    stream: stderr
    message: N debe ser un entero positivo
  examples:
  - command: /home/learner/aso/p31/antiguos.sh 2
    stdout: "      1 docker-init     00:00:00       00:23\n      7 supervisord   \
      \  00:00:00       00:23\n"
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p31/antiguos.sh 1 2
    stdout: ''
    stderr: 'uso: antiguos.sh [N]

      '
    exit_code: 1
  - command: /home/learner/aso/p31/antiguos.sh x
    stdout: ''
    stderr: 'N debe ser un entero positivo

      '
    exit_code: 2
  evaluations:
  - id: orden
    description: Empieza por el PID 1 y devuelve N líneas.
    points: 6
    checks:
    - type: run
      path: /usr/bin/bash
      args:
