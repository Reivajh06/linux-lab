- id: matar
  title: Terminar un proceso de forma ordenada
  description: 'Apartado 6. Envía `SIGTERM` al PID indicado, espera un segundo y,
    si sigue vivo, envía `SIGKILL`. Muestra `terminado con SIGTERM` o `terminado con
    SIGKILL`.


    **Comandos a practicar:** `kill`, `kill -9`, `kill -0`, `sleep`


    **Estructuras de Bash:** `if kill -0 ...; then`, `2>/dev/null`


    **Detalle importante:** `SIGTERM` pide terminar y se puede ignorar; un proceso
    **detenido** no lo atiende hasta reanudarse; `SIGKILL` lo elimina el núcleo. `kill
    -0` no envía nada: solo comprueba si el proceso existe.'
