    checks:
    - type: run
      path: /usr/bin/bash
      args:
      - -c
      - 'S=/home/learner/aso/p31/matar.sh

        D=/home/learner/aso/p31

        p=$(pgrep -u learner -f ''^p31terco -c''); [ -n "$p" ] && [ "$($S "$p")" =
        "terminado con SIGKILL" ]'
      cwd: /home/learner
      user: learner
      timeout: 15
      requirement: correcto
      prepare: 'pkill -KILL -f ''^sleep 90[34]$'' ; pkill -KILL -f ''^p31terco -c''

        setsid setpriv --reuid=learner --regid=$(id -g learner) --init-groups sleep
        903 >/dev/null 2>&1 </dev/null &

        setsid setpriv --reuid=learner --regid=$(id -g learner) --init-groups sleep
        904 >/dev/null 2>&1 </dev/null &

        setsid setpriv --reuid=learner --regid=$(id -g learner) --init-groups bash
        -c ''exec -a p31terco bash -c "trap \"\" TERM; while :; do sleep 1; done"''
        >/dev/null 2>&1 </dev/null &

        sleep 0.4

        pkill -STOP -f ''^sleep 904$''

        sleep 0.2'
