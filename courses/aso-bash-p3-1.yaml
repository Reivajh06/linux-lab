      \     98 xfconfd\n    116 at-spi2-registr\n   5449 sleep\n   5452 bash\n   7186\
      \ bash\n   8707 sleep\n   8708 sleep\n   8710 sleep\n   8714 sleep\n   9446\
      \ sleep\n   9447 sleep\n   9449 sleep\n   9582 sleep\n   9583 sleep\n"
    stderr: ''
    exit_code: 0
  - command: /home/learner/aso/p31/hijos.sh
    stdout: ''
    stderr: 'uso: hijos.sh PID

      '
    exit_code: 1
