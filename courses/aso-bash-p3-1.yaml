  description: 'Apartado 2. Usa `top` en modo por lotes para contar los procesos de
    un usuario: ejecuta una sola actualización, salta la cabecera y muestra el número
    de líneas de procesos.


    **Comandos a practicar:** `top -b -n 1 -u`, `tail -n +8`, `wc -l`, `id`


