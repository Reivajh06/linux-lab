- id: autonomos-1
  title: Autónomos 1–4
  description: 'Cada apartado requiere su propio script ejecutable con shebang #!/bin/bash. No recibe
    argumentos salvo indicación expresa. Mantén el orden del fichero de entrada salvo que se pida ordenar.
    Para ordenar usa la configuración regional del contenedor.


    **ps-01** — Todos los procesos: PID, USER y COMMAND (línea completa), ordenados por usuario. Guarda
    el comando en /home/learner/aso/p31/ps-01.sh.


    **ps-02** — Todos los procesos: PID, COMMAND y TIME de CPU, ordenados por tiempo de CPU ascendente.
    Guarda el comando en /home/learner/aso/p31/ps-02.sh.


    **ps-03** — Procesos de usuario1: PID y ELAPSED (tiempo transcurrido), orden inverso por antigüedad.
    Guarda el comando en /home/learner/aso/p31/ps-03.sh.


    **ps-04** — Procesos de usuario1 vinculados a terminal: PID, COMMAND, PPID y %CPU, ordenados por PPID.
    Usa la pseudoterminal preparada. Guarda el comando en /home/learner/aso/p31/ps-04.sh.'
  evaluations:
  - id: ps-01
    description: 'Todos los procesos: PID, USER y COMMAND (línea completa), ordenados por usuario.'
    points: 2
    checks:
    - type: run
      path: /home/learner/aso/p31/ps-01.sh
      exit_code: 0
      stderr:
        match: empty
      stdout:
        match: regex
        value: ^\s*PID\s+USER\s+COMMAND\n
      prepare: 'count=$(pgrep -u p31_contador -xc sleep)

        if [ "$count" -ne 2 ]; then

        pkill -u p31_contador -x sleep || true

        sleep 0.1

        runuser -u p31_contador -- sleep 1000 >/dev/null 2>&1 &

        runuser -u p31_contador -- sleep 1000 >/dev/null 2>&1 &

        fi

        count=$(pgrep -u p31_grupo -xc sleep)

        if [ "$count" -ne 2 ]; then

        pkill -u p31_grupo -x sleep || true

        sleep 0.1

        runuser -u p31_grupo -- sleep 1000 >/dev/null 2>&1 &

        runuser -u p31_grupo -- sleep 1000 >/dev/null 2>&1 &

        fi

        if ! ps -u usuario1 -o tty=,comm= | grep -Eq "pts/[0-9]+[[:space:]]+sleep"; then

        runuser -u usuario1 -- script -q -c "sleep 1000" /dev/null >/dev/null 2>&1 &

        fi

        if ! pgrep -u p31_bash -x bash >/dev/null; then

        runuser -u p31_bash -- bash -c "while :; do sleep 1000; done" >/dev/null 2>&1 &

        fi

        sleep 0.2

        '
    - type: run
      path: /home/learner/aso/p31/ps-01.sh
      stdout:
        match: regex
        value: ^\s*\d+\s+p31_contador\s+sleep 1000\s*$
      stderr:
        match: empty
      exit_code: 0
      prepare: 'count=$(pgrep -u p31_contador -xc sleep)

        if [ "$count" -ne 2 ]; then

        pkill -u p31_contador -x sleep || true

        sleep 0.1

        runuser -u p31_contador -- sleep 1000 >/dev/null 2>&1 &

        runuser -u p31_contador -- sleep 1000 >/dev/null 2>&1 &

        fi

        count=$(pgrep -u p31_grupo -xc sleep)

        if [ "$count" -ne 2 ]; then

        pkill -u p31_grupo -x sleep || true

        sleep 0.1

        runuser -u p31_grupo -- sleep 1000 >/dev/null 2>&1 &

        runuser -u p31_grupo -- sleep 1000 >/dev/null 2>&1 &

        fi

        if ! ps -u usuario1 -o tty=,comm= | grep -Eq "pts/[0-9]+[[:space:]]+sleep"; then

        runuser -u usuario1 -- script -q -c "sleep 1000" /dev/null >/dev/null 2>&1 &

        fi

        if ! pgrep -u p31_bash -x bash >/dev/null; then

        runuser -u p31_bash -- bash -c "while :; do sleep 1000; done" >/dev/null 2>&1 &

        fi

        sleep 0.2

        '
    - type: command
      user: learner
