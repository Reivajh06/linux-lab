schema_version: 1
id: aso-p3-1
version: '1.0'
title: ASO Práctica 3.1 · Procesos
description: "Consulta y cuenta procesos del sistema con ps, top, pgrep y las herramientas de gestión de procesos. Guarda los scripts ejecutables con shebang #!/bin/bash en /home/learner/aso/p31/ y envía los resultados a stdout y los errores a stderr. Usa el código 0 al terminar correctamente y los distintos códigos de error indicados en cada ejercicio."
setup:
- script: 'set -e

    install -d -o learner -g learner /home/learner/aso/p31

    groupadd -g 23102 p31_equipo

    useradd -m -s /bin/bash p31_contador

    useradd -m -s /bin/bash -g p31_equipo p31_grupo

    useradd -m -s /bin/bash usuario1

    runuser -u p31_contador -- sleep 1000 >/dev/null 2>&1 &

    runuser -u p31_contador -- sleep 1000 >/dev/null 2>&1 &

    runuser -u p31_grupo -- sleep 1000 >/dev/null 2>&1 &

    runuser -u p31_grupo -- sleep 1000 >/dev/null 2>&1 &

    runuser -u usuario1 -- script -q -c "sleep 1000" /dev/null >/dev/null 2>&1 &

    sleep 0.2

    useradd -m -s /bin/bash p31_bash

    runuser -u p31_bash -- bash -c "while :; do sleep 1000; done" >/dev/null 2>&1 &

    sleep 0.2

    '
  user: root
exercises:
- id: procesos-usuario
  title: Laboratorio 1 · Procesos por usuario
  description: "Cuenta los procesos pertenecientes a cada usuario recibido, en el orden de los argumentos. Si un usuario no existe, muestra un error con su nombre y continúa con los demás; devuelve 4 al finalizar si hubo algún usuario inexistente.\n\nCrea el script ejecutable /home/learner/aso/p31/procesos-usuario.sh con shebang #!/bin/bash."
  script:
    path: /home/learner/aso/p31/procesos-usuario.sh
    usage: procesos-usuario.sh USUARIOS...
  input_requirements:
  - description: "Uno o más nombres de usuario."
    error: uso
  - description: "Cada nombre corresponde a un usuario existente; si alguno no existe, se procesan los restantes."
    error: usuario
  output_requirements:
  - id: ok
    description: "Imprime por stdout una línea `USUARIO: N` por cada usuario existente, en el orden recibido, donde N es su número de procesos en ejecución. Si un usuario no tiene procesos, imprime `USUARIO: 0`."
    exit_code: 0
    stream: stdout
  - id: uso
    description: "No se ha recibido ningún nombre de usuario."
    exit_code: 1
    stream: stderr
    message: 'uso: procesos-usuario.sh USUARIOS...'
  - id: usuario
    description: "Algún usuario no existe. Informa de cada nombre inexistente por stderr, continúa con los demás y devuelve 4 al finalizar."
    exit_code: 4
    stream: stderr
    message: 'el usuario no existe: USUARIO'
  examples:
  - command: ./procesos-usuario.sh p31_contador p31_grupo
    exit_code: 0
    stdout: 'p31_contador: 2
  
      p31_grupo: 2
  
      '
  - command: ./procesos-usuario.sh
    stderr: 'uso: procesos-usuario.sh USUARIOS...
  
      '
    exit_code: 1
  - command: ./procesos-usuario.sh aso_no_existe p31_contador
    stdout: 'p31_contador: 2
  
      '
    stderr: 'el usuario no existe: aso_no_existe
  
      '
    exit_code: 4
    description: Informa del usuario inexistente y cuenta los procesos del siguiente.
  evaluations:
  - id: correcto-1
    description: "Cuenta los dos procesos de cada usuario preparado"
    points: 2
    checks:
    - type: run
      args:
      - p31_contador
      - p31_grupo
      requirement: ok
      stdout:
        match: exact
        value: 'p31_contador: 2

          p31_grupo: 2

          '
      stderr:
        match: empty
      prepare: 'count=$(pgrep -u p31_contador -xc sleep)

        if [ "$count" -ne 2 ]; then

        pkill -u p31_contador -x sleep || true

        sleep 0.1

        runuser -u p31_contador -- sleep 1000 >/dev/null 2>&1 &

        runuser -u p31_contador -- sleep 1000 >/dev/null 2>&1 &

        fi

        count=$(pgrep -u p31_grupo -xc sleep)

        if [ "$count" -ne 2 ]; then

        pkill -u p31_grupo -x sleep || true

        sleep 0.1

        runuser -u p31_grupo -- sleep 1000 >/dev/null 2>&1 &

        runuser -u p31_grupo -- sleep 1000 >/dev/null 2>&1 &

        fi

        if ! ps -u usuario1 -o tty=,comm= | grep -Eq "pts/[0-9]+[[:space:]]+sleep"; then

        runuser -u usuario1 -- script -q -c "sleep 1000" /dev/null >/dev/null 2>&1 &

        fi

        if ! pgrep -u p31_bash -x bash >/dev/null; then

        runuser -u p31_bash -- bash -c "while :; do sleep 1000; done" >/dev/null 2>&1 &

        fi

        sleep 0.2

        '
  - id: uso
    description: "Sin argumentos → error de uso"
    points: 2
    checks:
    - type: run
      args: []
      requirement: uso
      prepare: 'count=$(pgrep -u p31_contador -xc sleep)

        if [ "$count" -ne 2 ]; then

        pkill -u p31_contador -x sleep || true

        sleep 0.1

        runuser -u p31_contador -- sleep 1000 >/dev/null 2>&1 &

        runuser -u p31_contador -- sleep 1000 >/dev/null 2>&1 &

        fi

        count=$(pgrep -u p31_grupo -xc sleep)

        if [ "$count" -ne 2 ]; then

        pkill -u p31_grupo -x sleep || true

        sleep 0.1

        runuser -u p31_grupo -- sleep 1000 >/dev/null 2>&1 &

        runuser -u p31_grupo -- sleep 1000 >/dev/null 2>&1 &

        fi

        if ! ps -u usuario1 -o tty=,comm= | grep -Eq "pts/[0-9]+[[:space:]]+sleep"; then

        runuser -u usuario1 -- script -q -c "sleep 1000" /dev/null >/dev/null 2>&1 &

        fi

        if ! pgrep -u p31_bash -x bash >/dev/null; then

        runuser -u p31_bash -- bash -c "while :; do sleep 1000; done" >/dev/null 2>&1 &

        fi

        sleep 0.2

        '
  - id: usuario
    description: "Usuario inexistente → error de usuario"
    points: 2
    checks:
    - type: run
      args:
      - aso_no_existe
      requirement: usuario
      prepare: 'count=$(pgrep -u p31_contador -xc sleep)

        if [ "$count" -ne 2 ]; then

        pkill -u p31_contador -x sleep || true

        sleep 0.1

        runuser -u p31_contador -- sleep 1000 >/dev/null 2>&1 &

        runuser -u p31_contador -- sleep 1000 >/dev/null 2>&1 &

        fi

        count=$(pgrep -u p31_grupo -xc sleep)

        if [ "$count" -ne 2 ]; then

        pkill -u p31_grupo -x sleep || true

        sleep 0.1

        runuser -u p31_grupo -- sleep 1000 >/dev/null 2>&1 &

        runuser -u p31_grupo -- sleep 1000 >/dev/null 2>&1 &

        fi

        if ! ps -u usuario1 -o tty=,comm= | grep -Eq "pts/[0-9]+[[:space:]]+sleep"; then

        runuser -u usuario1 -- script -q -c "sleep 1000" /dev/null >/dev/null 2>&1 &

        fi

        if ! pgrep -u p31_bash -x bash >/dev/null; then

        runuser -u p31_bash -- bash -c "while :; do sleep 1000; done" >/dev/null 2>&1 &

        fi

        sleep 0.2

        '
  - id: continuar
    description: "Continúa contando procesos después de un usuario inexistente"
    points: 2
    checks:
    - type: run
      args:
      - aso_no_existe
      - p31_contador
      requirement: usuario
      stdout:
        match: exact
        value: 'p31_contador: 2

          '
      prepare: 'count=$(pgrep -u p31_contador -xc sleep)

        if [ "$count" -ne 2 ]; then

        pkill -u p31_contador -x sleep || true

        sleep 0.1

        runuser -u p31_contador -- sleep 1000 >/dev/null 2>&1 &

        runuser -u p31_contador -- sleep 1000 >/dev/null 2>&1 &

        fi

        count=$(pgrep -u p31_grupo -xc sleep)

        if [ "$count" -ne 2 ]; then

        pkill -u p31_grupo -x sleep || true

        sleep 0.1

        runuser -u p31_grupo -- sleep 1000 >/dev/null 2>&1 &

        runuser -u p31_grupo -- sleep 1000 >/dev/null 2>&1 &

        fi

        if ! ps -u usuario1 -o tty=,comm= | grep -Eq "pts/[0-9]+[[:space:]]+sleep"; then

        runuser -u usuario1 -- script -q -c "sleep 1000" /dev/null >/dev/null 2>&1 &

        fi

        if ! pgrep -u p31_bash -x bash >/dev/null; then

        runuser -u p31_bash -- bash -c "while :; do sleep 1000; done" >/dev/null 2>&1 &

        fi

        sleep 0.2

        '
  tips:
  - Consulta man ps para seleccionar procesos por usuario y obtener una lista sin cabecera que puedas contar.
- id: procesos-grupo
  title: Laboratorio 2 · Grupo primario y umbral
  description: "Busca los usuarios cuyo grupo primario tenga el GID G y que sean propietarios de al menos P procesos en ejecución. Conserva el orden de /etc/passwd. Distingue entre la ausencia de usuarios con ese grupo primario (código 4) y la existencia de usuarios que no alcanzan el mínimo de procesos (código 5).\n\nCrea el script ejecutable /home/learner/aso/p31/procesos-grupo.sh con shebang #!/bin/bash."
  script:
    path: /home/learner/aso/p31/procesos-grupo.sh
    usage: procesos-grupo.sh G P
  input_requirements:
  - description: "Exactamente dos argumentos."
    error: uso
  - description: "G y P son enteros decimales: uno o más dígitos (0–9), opcionalmente precedidos por un signo menos."
    error: formato
  - description: "G y P son mayores o iguales que cero."
    error: rango
  - description: "Existe al menos un usuario cuyo grupo primario tiene GID G."
    error: grupo
  - description: "Al menos un usuario con grupo primario de GID G tiene P o más procesos."
    error: umbral
  output_requirements:
  - id: ok
    description: "Imprime por stdout una línea `USUARIO: N` por cada usuario cuyo grupo primario tenga GID G y cuyo número de procesos N sea mayor o igual que P. Conserva el orden de /etc/passwd y no añadas cabecera ni total."
    exit_code: 0
    stream: stdout
  - id: uso
    description: "No se han recibido exactamente dos argumentos."
    exit_code: 1
    stream: stderr
    message: 'uso: procesos-grupo.sh G P'
  - id: formato
    description: "Algún argumento no tiene formato de entero decimal; por ejemplo, contiene letras o un signo sin dígitos."
    exit_code: 2
    stream: stderr
    message: los argumentos deben ser enteros
  - id: rango
    description: "G o P tiene un valor negativo."
    exit_code: 3
    stream: stderr
    message: los argumentos deben ser no negativos
  - id: grupo
    description: "No hay ningún usuario cuyo grupo primario tenga el GID indicado."
    exit_code: 4
    stream: stderr
    message: no hay usuarios con ese grupo primario
  - id: umbral
    description: "Hay usuarios cuyo grupo primario tiene GID G, pero ninguno alcanza P procesos."
    exit_code: 5
    stream: stderr
    message: ningún usuario alcanza el mínimo
  examples:
  - command: ./procesos-grupo.sh 23102 1
    exit_code: 0
    stdout: 'p31_grupo: 2
  
      '
  - command: ./procesos-grupo.sh
    stderr: 'uso: procesos-grupo.sh G P
  
      '
